      ctx.restore();
    }

    function drawMonsters() {
      for (const m of monsters) drawMonster(m);
    }

    // Death burst particles
    const deathParticles = [];
    function spawnDeathParticles(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        deathParticles.push({
          x, y,
          vx: Math.cos(a) * (2 + Math.random() * 4),
          vy: Math.sin(a) * (2 + Math.random() * 4),
          life: 1.0,
          r: 3 + Math.random() * 4,
          color,
        });
      }
    }

    function updateDeathParticles(dt) {
      for (let i = deathParticles.length - 1; i >= 0; i--) {
        const p = deathParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.life -= 0.04 * dt;
        if (p.life <= 0) deathParticles.splice(i, 1);
      }
    }

    function drawDeathParticles() {
      for (const p of deathParticles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // Utility: lighten a hex color
    function lighten(hex) {
      const r = Math.min(255, parseInt(hex.slice(1,3),16) + 80);
      const g = Math.min(255, parseInt(hex.slice(3,5),16) + 80);
      const b = Math.min(255, parseInt(hex.slice(5,7),16) + 80);
      return `rgb(${r},${g},${b})`;
    }

    // --- Particle trail ---
    const particles = [];
    function spawnParticle(x, y) {
      particles.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y + egg.ry,
        vx: (Math.random() - 0.5) * 1.2,
        vy: -(Math.random() * 1.5 + 0.5),
        life: 1.0,
        r: Math.random() * 3 + 1.5,
      });
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.life -= 0.035;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(249, 168, 37, ${p.life * 0.5})`;
        ctx.fill();
      }
    }

    // --- Subtle grid background ---
    // =====================================================================
    // THEME / BACKGROUND SYSTEM
    // =====================================================================
    let activeTheme = 'space'; // 'space' | 'sonic' | 'lava'

    // Pre-generate stable star field
    const STARS = Array.from({length: 180}, () => ({
      x: Math.random(), y: Math.random(),
      r: 0.5 + Math.random() * 1.5,
      bright: Math.random(),
      speed: 0.1 + Math.random() * 0.4,
    }));
    let bgScroll = 0;

    function applyTheme(code) {
      const c = code.trim().toLowerCase();
      const msgEl = document.getElementById('code-msg');
      const validThemes = ['sonic','lava','space','backrooms','minecraft','mario','forest'];
      if (c === 'sonic') {
        activeTheme = 'sonic';
        msgEl.textContent = '✔ SONIC MODE!'; msgEl.style.color = '#44aaff';
      } else if (c === 'lava') {
        activeTheme = 'lava';
        msgEl.textContent = '✔ LAVA WORLD!'; msgEl.style.color = '#ff4400';
      } else if (c === 'space' || c === 'reset') {
        activeTheme = 'space';
        msgEl.textContent = '✔ SPACE MODE'; msgEl.style.color = '#4cff88';
      } else if (c === 'backrooms') {
        activeTheme = 'backrooms';
        msgEl.textContent = '✔ BACKROOMS'; msgEl.style.color = '#ccaa55';
      } else if (c === 'minecraft') {
        activeTheme = 'minecraft';
        msgEl.textContent = '✔ MINECRAFT'; msgEl.style.color = '#55cc44';
      } else if (c === 'mario') {
        activeTheme = 'mario';
        msgEl.textContent = '✔ MARIO WORLD!'; msgEl.style.color = '#e52222';
      } else if (c === 'forest') {
        activeTheme = 'forest';
        msgEl.textContent = '✔ 99 NIGHTS IN THE FOREST'; msgEl.style.color = '#44aa22';
      } else {
        msgEl.textContent = '✘ unknown code'; msgEl.style.color = '#e74c3c';
      }
      if (validThemes.includes(c) || c === 'reset') {
        setTimeout(() => { msgEl.textContent = ''; }, 2500);
      } else {
        setTimeout(() => { msgEl.textContent = ''; }, 1200);
      }
    }

    document.getElementById('code-btn').addEventListener('click', () => {
      applyTheme(document.getElementById('code-input').value);
      document.getElementById('code-input').value = '';
    });
    document.getElementById('code-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        applyTheme(e.target.value);
        e.target.value = '';
      }
    });
    document.getElementById('code-input').addEventListener('keyup', e => {
      const v = e.target.value.trim().toLowerCase();
      const themes = ['sonic','lava','space','backrooms','minecraft','mario','forest','reset'];
      if (themes.includes(v)) {
        applyTheme(v);
        e.target.value = '';
      }
    });

    function drawBackground() {
      bgScroll += 0.3;

      if (activeTheme === 'sonic') {
        // Blue sky gradient + scrolling checkerboard floor
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, '#1a6bd4');
        sky.addColorStop(0.6, '#5baaf5');
        sky.addColorStop(1, '#89c4f8');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Checkerboard ground strip
        const gY = canvas.height * 0.72;
        ctx.fillStyle = '#3d8c3d';
        ctx.fillRect(0, gY, canvas.width, canvas.height - gY);
        const cSize = 32;
        const offset = bgScroll % (cSize * 2);
        for (let cx2 = -cSize * 2 + (offset % cSize); cx2 < canvas.width + cSize; cx2 += cSize * 2) {
          for (let cy2 = gY; cy2 < canvas.height; cy2 += cSize) {
            ctx.fillStyle = ((Math.floor(cx2/cSize) + Math.floor((cy2-gY)/cSize)) % 2 === 0) ? '#2d6e2d' : '#3d8c3d';
            ctx.fillRect(cx2, cy2, cSize, cSize);
          }
        }
        // Clouds
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        [[80, 60], [240, 40], [420, 80], [600, 50]].forEach(([cx2, cy2]) => {
          const bx2 = ((cx2 - bgScroll * 0.5) % (canvas.width + 120) + canvas.width + 120) % (canvas.width + 120) - 60;
          ctx.beginPath(); ctx.ellipse(bx2, cy2, 45, 22, 0, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(bx2+30, cy2-10, 30, 18, 0, 0, Math.PI*2); ctx.fill();
        });

      } else if (activeTheme === 'lava') {
        // Dark rocky background + lava cracks
        ctx.fillStyle = '#1a0800';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Lava glow veins
        const t2 = bgScroll * 0.02;
        for (let i = 0; i < 8; i++) {
          const x1 = (i / 8 + Math.sin(t2 + i) * 0.05) * canvas.width;
          const y1 = (Math.cos(t2 * 0.7 + i * 1.3) * 0.3 + 0.5) * canvas.height;
          const grd = ctx.createRadialGradient(x1, y1, 5, x1, y1, 90);
          grd.addColorStop(0, `rgba(255,${80 + i*10},0,${0.25 + 0.1*Math.sin(t2+i)})`);
          grd.addColorStop(1, 'transparent');
          ctx.fillStyle = grd;
          ctx.beginPath(); ctx.arc(x1, y1, 90, 0, Math.PI*2); ctx.fill();
        }
        // Rock grid
        ctx.strokeStyle = 'rgba(80,20,0,0.4)';
        ctx.lineWidth = 1;
        for (let rx = 0; rx < canvas.width; rx += 48) {
          ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx, canvas.height); ctx.stroke();
        }
        for (let ry = 0; ry < canvas.height; ry += 48) {
          ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width, ry); ctx.stroke();
        }

      } else if (activeTheme === 'backrooms') {
        const BW = canvas.width, BH = canvas.height;
        const bcx = BW / 2, bcy = BH / 2;

        // ---- Base: sickly yellowed carpet ----
        ctx.fillStyle = '#a89438';
        ctx.fillRect(0, 0, BW, BH);

        // ---- Carpet tile grid ----
        const tileSize = 52;
        for (let gx = 0; gx < BW; gx += tileSize) {
          ctx.strokeStyle = `rgba(60,40,5,${0.12 + 0.18 * Math.abs(Math.sin(gx))})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, BH); ctx.stroke();
        }
        for (let gy = 0; gy < BH; gy += tileSize) {
          ctx.strokeStyle = `rgba(60,40,5,${0.12 + 0.18 * Math.abs(Math.cos(gy))})`;
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(BW, gy); ctx.stroke();
        }

        // ---- Moisture stains / dark wet patches ----
        [[0.15,0.35],[0.58,0.68],[0.82,0.22],[0.36,0.82],[0.71,0.52],[0.22,0.58],[0.91,0.42],[0.45,0.15]].forEach(([fx,fy]) => {
          const sx = fx * BW, sy = fy * BH;
          const sg = ctx.createRadialGradient(sx, sy, 1, sx, sy, 26 + Math.sin(fx*17)*10);
          sg.addColorStop(0, 'rgba(25,15,0,0.45)');
          sg.addColorStop(1, 'transparent');
          ctx.fillStyle = sg;
          ctx.beginPath(); ctx.ellipse(sx, sy, 28+Math.sin(fy*13)*8, 18+Math.cos(fx*11)*6, fx*Math.PI, 0, Math.PI*2); ctx.fill();
        });

        // ---- Perspective corridor — converging lines to vanishing point ----
        const vpY = BH * 0.4;
        ctx.lineWidth = 1.2;
        // Floor lines
        ctx.strokeStyle = 'rgba(140,115,40,0.5)';
        for (let i = 0; i <= 7; i++) {
          const fx = (i / 7) * BW;
          ctx.beginPath(); ctx.moveTo(fx, BH); ctx.lineTo(bcx, vpY); ctx.stroke();
        }
        // Ceiling lines
        ctx.strokeStyle = 'rgba(170,150,60,0.35)';
        for (let i = 0; i <= 7; i++) {
          const fx = (i / 7) * BW;
          ctx.beginPath(); ctx.moveTo(fx, 0); ctx.lineTo(bcx, vpY); ctx.stroke();
        }
        // Side wall outlines
        ctx.strokeStyle = 'rgba(100,80,20,0.4)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(bcx, vpY); ctx.lineTo(0, BH); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(BW, 0); ctx.lineTo(bcx, vpY); ctx.lineTo(BW, BH); ctx.stroke();

        // ---- Fluorescent lights — three ceiling strips, independent flicker ----
        const bt = bgScroll;
        [0.18, 0.5, 0.82].forEach((fx, li) => {
          const flicker = Math.max(0, 0.5 + 0.5 * Math.sin(bt * 0.25 + li * 2.4) * Math.cos(bt * 0.1 + li * 1.1));
          const blink = Math.sin(bt * 0.06 + li * 3.8) > 0.91 ? 0 : 1;
          const la = flicker * blink;
          const lx2 = fx * BW;

          // Fixture
          ctx.fillStyle = `rgba(200,200,140,${la * 0.9})`;
          ctx.beginPath(); ctx.roundRect(lx2 - 52, 0, 104, 13, 2); ctx.fill();

          // Light cone
          const cg = ctx.createLinearGradient(lx2, 13, lx2, BH * 0.65);
          cg.addColorStop(0, `rgba(255,255,155,${la * 0.24})`);
          cg.addColorStop(0.55, `rgba(240,235,110,${la * 0.10})`);
          cg.addColorStop(1, 'transparent');
          ctx.beginPath();
          ctx.moveTo(lx2 - 52, 13); ctx.lineTo(lx2 + 52, 13);
          ctx.lineTo(lx2 + BW * 0.38, BH * 0.65); ctx.lineTo(lx2 - BW * 0.38, BH * 0.65);
          ctx.closePath(); ctx.fillStyle = cg; ctx.fill();

          // Ceiling halo
          const halo = ctx.createRadialGradient(lx2, 7, 1, lx2, 7, 85);
          halo.addColorStop(0, `rgba(255,255,160,${la * 0.6})`);
          halo.addColorStop(1, 'transparent');
          ctx.fillStyle = halo;
          ctx.beginPath(); ctx.arc(lx2, 7, 85, 0, Math.PI*2); ctx.fill();
        });

        // ---- Heavy vignette — deep darkness from edges ----
        const bvg = ctx.createRadialGradient(bcx, bcy, BH * 0.15, bcx, bcy, BH * 1.0);
        bvg.addColorStop(0, 'transparent');
        bvg.addColorStop(0.55, 'rgba(0,0,0,0.32)');
        bvg.addColorStop(1, 'rgba(0,0,0,0.96)');
        ctx.fillStyle = bvg; ctx.fillRect(0, 0, BW, BH);

        // ---- Pitch-black corners ----
        [[0,0],[BW,0],[0,BH],[BW,BH]].forEach(([ex,ey]) => {
          const cg2 = ctx.createRadialGradient(ex, ey, 0, ex, ey, BW * 0.52);
          cg2.addColorStop(0, 'rgba(0,0,0,0.95)');
          cg2.addColorStop(0.35, 'rgba(0,0,0,0.6)');
          cg2.addColorStop(1, 'transparent');
          ctx.fillStyle = cg2; ctx.fillRect(0, 0, BW, BH);
        });

        // ---- Film grain / static noise ----
        ctx.save();
        ctx.globalAlpha = 0.045 + 0.025 * Math.sin(bt * 1.9);
        for (let ny = 0; ny < BH; ny += 4) {
          for (let nx = 0; nx < BW; nx += 4) {
            if (Math.sin(nx * 14.1 + ny * 7.9 + bt * 37) > 0.58) {
              ctx.fillStyle = ny % 8 < 4 ? '#ffffcc' : '#888';
              ctx.fillRect(nx, ny, 2, 2);
            }
          }
        }
        ctx.restore();

      } else if (activeTheme === 'minecraft') {
        // Sky
        ctx.fillStyle = '#78a8ff';
        ctx.fillRect(0, 0, canvas.width, canvas.height * 0.15);
        // Dirt/grass main area
        ctx.fillStyle = '#8B6040';
        ctx.fillRect(0, canvas.height * 0.15, canvas.width, canvas.height);
        // Grass strip
        ctx.fillStyle = '#5a9e2f';
        ctx.fillRect(0, canvas.height * 0.15, canvas.width, 22);
        // Block grid overlay
        const bsz = 48;
        ctx.strokeStyle = 'rgba(0,0,0,0.22)';
        ctx.lineWidth = 1.5;
        for (let gx = 0; gx < canvas.width; gx += bsz) {
          ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, canvas.height); ctx.stroke();
        }
        for (let gy = 0; gy < canvas.height; gy += bsz) {
          ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
        }
        // Scattered stone patches
        ctx.fillStyle = '#7a7a7a';
        [[0.2,0.4],[0.5,0.65],[0.75,0.35],[0.1,0.7],[0.85,0.55]].forEach(([fx,fy]) => {
          ctx.fillRect(Math.floor(fx*canvas.width/bsz)*bsz, Math.floor(fy*canvas.height/bsz)*bsz, bsz, bsz);
          ctx.strokeStyle='rgba(0,0,0,0.3)'; ctx.lineWidth=1.5;
          ctx.strokeRect(Math.floor(fx*canvas.width/bsz)*bsz, Math.floor(fy*canvas.height/bsz)*bsz, bsz, bsz);
        });

      } else if (activeTheme === 'mario') {
        // Sky gradient
        const marioSky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        marioSky.addColorStop(0, '#5c94fc');
        marioSky.addColorStop(1, '#9bbdff');
        ctx.fillStyle = marioSky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        const groundY = canvas.height * 0.75;
        const dirtH = canvas.height - groundY - 40;
        // Grass strip
        ctx.fillStyle = '#5aac00';
        ctx.fillRect(0, groundY, canvas.width, 40);
        // Dirt strip
        ctx.fillStyle = '#c84c0c';
        ctx.fillRect(0, groundY + 40, canvas.width, dirtH);
        // Brick grid on dirt
        const bsz = 48;
        ctx.strokeStyle = 'rgba(100,30,0,0.5)';
        ctx.lineWidth = 1.5;
        for (let gx = 0; gx < canvas.width; gx += bsz) {
          ctx.beginPath(); ctx.moveTo(gx, groundY+40); ctx.lineTo(gx, canvas.height); ctx.stroke();
        }
        for (let gy = groundY+40; gy < canvas.height; gy += bsz) {
          ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
        }
        // Scrolling hills
        const hillOffsets = [0.1, 0.45, 0.78];
        hillOffsets.forEach((fx, i) => {
          const hx = ((fx * canvas.width - bgScroll * 0.3 * (i+1) * 0.4) % (canvas.width + 200) + canvas.width + 200) % (canvas.width + 200) - 100;
          const hr = 70 + i * 20;
          ctx.fillStyle = '#4a9000';
          ctx.beginPath();
          ctx.arc(hx, groundY, hr, Math.PI, 0, false);
          ctx.closePath();
          ctx.fill();
          // Lighter top
          ctx.fillStyle = '#5aac00';
          ctx.beginPath();
          ctx.arc(hx, groundY, hr * 0.6, Math.PI, 0, false);
          ctx.closePath();
          ctx.fill();
        });
        // Scrolling clouds
        [[0.1,0.12],[0.35,0.08],[0.62,0.15],[0.85,0.1]].forEach(([fx, fy], i) => {
          const cx2 = ((fx * canvas.width - bgScroll * 0.2 * (i*0.3+0.5)) % (canvas.width+200) + canvas.width+200) % (canvas.width+200) - 100;
          const cy2 = fy * canvas.height;
          ctx.fillStyle = 'rgba(255,255,255,0.95)';
          ctx.beginPath(); ctx.arc(cx2,      cy2,     22, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(cx2+22,   cy2-8,   18, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(cx2+44,   cy2,     22, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(cx2+15,   cy2-18,  16, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.arc(cx2+30,   cy2-20,  14, 0, Math.PI*2); ctx.fill();
        });
        // Floating coins
        const coinY = canvas.height * 0.55;
        for (let ci = 0; ci < 6; ci++) {
          const cx2 = ((ci * 110 + 50 - bgScroll * 0.5) % (canvas.width + 100) + canvas.width + 100) % (canvas.width + 100) - 50;
          const bob = Math.sin(bgScroll * 0.05 + ci) * 5;
          ctx.fillStyle = '#ffd700';
          ctx.beginPath();
          ctx.arc(cx2, coinY + bob, 10, 0, Math.PI*2);
          ctx.fill();
          ctx.strokeStyle = '#c8a000';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = '#c8a000';
          ctx.font = 'bold 9px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('$', cx2, coinY + bob + 3);
        }
        // Question blocks
        [[0.2, 0.6],[0.5, 0.55],[0.75, 0.62]].forEach(([fx, fy], i) => {
          const qx = ((fx * canvas.width - bgScroll * 0.4) % (canvas.width+150) + canvas.width+150) % (canvas.width+150) - 75;
          const qy = fy * canvas.height;
          ctx.fillStyle = '#f8b800';
          ctx.fillRect(qx-16, qy-16, 32, 32);
          ctx.strokeStyle = '#c88000';
          ctx.lineWidth = 2;
          ctx.strokeRect(qx-16, qy-16, 32, 32);
          ctx.fillStyle = '#8B4000';
          ctx.font = 'bold 18px monospace';
          ctx.textAlign = 'center';
          ctx.fillText('?', qx, qy + 6);
        });
        // Green pipes
        [[0.3, 44],[0.7, 60]].forEach(([fx, pw], i) => {
          const px = ((fx * canvas.width - bgScroll * 0.6) % (canvas.width+200) + canvas.width+200) % (canvas.width+200) - 100;
          const py = groundY;
          const ph = 70 + i*20;
          // Pipe body
          ctx.fillStyle = '#3aaa00';
          ctx.fillRect(px - pw/2, py - ph, pw, ph);
          ctx.fillStyle = '#2a8800';
          ctx.fillRect(px - pw/2 + 4, py - ph, 6, ph);
          // Pipe cap
          ctx.fillStyle = '#3aaa00';
          ctx.fillRect(px - pw/2 - 6, py - ph - 14, pw + 12, 14);
          ctx.fillStyle = '#2a8800';
          ctx.fillRect(px - pw/2 - 6 + 4, py - ph - 14, 6, 14);
          ctx.strokeStyle = '#1a6600';
          ctx.lineWidth = 1.5;
          ctx.strokeRect(px - pw/2 - 6, py - ph - 14, pw + 12, 14);
        });

      } else if (activeTheme === 'forest') {
        // Sky gradient — dark atmospheric night
        const forestSky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        forestSky.addColorStop(0, '#0a1208');
        forestSky.addColorStop(1, '#0d1f0a');
        ctx.fillStyle = forestSky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Moon — upper right
        const moonX = canvas.width * 0.82, moonY = canvas.height * 0.12;
        const moonGlow = ctx.createRadialGradient(moonX, moonY, 0, moonX, moonY, 80);
        moonGlow.addColorStop(0, 'rgba(255,255,200,0.18)');
        moonGlow.addColorStop(1, 'transparent');
        ctx.fillStyle = moonGlow;
        ctx.fillRect(moonX-80, moonY-80, 160, 160);
        ctx.fillStyle = '#ffffc0';
        ctx.beginPath(); ctx.arc(moonX, moonY, 34, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = '#ffffd8';
        ctx.beginPath(); ctx.arc(moonX-8, moonY-8, 26, 0, Math.PI*2); ctx.fill();
        // Stars — stable positions using seed
        for (let si = 0; si < 30; si++) {
          const sx = ((si * 137.5 + 17) % 97) / 97 * canvas.width;
          const sy = ((si * 73.1 + 5) % 53) / 53 * canvas.height * 0.6;
          const twink = 0.4 + 0.4 * Math.sin(bgScroll * 0.04 + si * 0.7);
          ctx.fillStyle = `rgba(220,240,220,${twink.toFixed(2)})`;
          ctx.beginPath(); ctx.arc(sx, sy, 1.2 + (si%3)*0.4, 0, Math.PI*2); ctx.fill();
        }
        // Ground
        const fGroundY = canvas.height * 0.7;
        ctx.fillStyle = '#1a1208';
        ctx.fillRect(0, fGroundY, canvas.width, canvas.height - fGroundY);
        // Trees — dark silhouettes with slight parallax
        const treePosX = [0.05,0.18,0.3,0.44,0.56,0.68,0.8,0.92];
        treePosX.forEach((fx, i) => {
          const tx = ((fx * canvas.width - bgScroll * 0.1 * (1+(i%3)*0.3)) % (canvas.width+200) + canvas.width+200) % (canvas.width+200) - 100;
          const th = 100 + (i%3)*40;
          const tw = 38 + (i%4)*10;
          const treeCol = i%2===0 ? '#0a1a04' : '#152808';
          // Trunk
          ctx.fillStyle = '#0d1400';
          ctx.fillRect(tx - 5, fGroundY - 18, 10, 20);
          // Triangle canopy (3 layers)
          for (let layer = 0; layer < 3; layer++) {
            const lh = th * (0.5 - layer*0.1);
            const lw = tw * (1 - layer*0.25);
            const lyBot = fGroundY - 18 - layer * (th*0.3);
            ctx.fillStyle = treeCol;
            ctx.beginPath();
            ctx.moveTo(tx, lyBot - lh);
            ctx.lineTo(tx - lw/2, lyBot);
            ctx.lineTo(tx + lw/2, lyBot);
            ctx.closePath();
            ctx.fill();
          }
        });
        // Fog patches near ground
        for (let fi = 0; fi < 3; fi++) {
          const fogX = ((fi * 280 + 60 - bgScroll * 0.15) % (canvas.width+400) + canvas.width+400) % (canvas.width+400) - 200;
          ctx.fillStyle = 'rgba(200,220,200,0.06)';
          ctx.beginPath();
          ctx.ellipse(fogX, fGroundY + 10, 160, 30, 0, 0, Math.PI*2);
          ctx.fill();
        }
        // Undergrowth tufts
        for (let gi = 0; gi < 20; gi++) {
          const gx2 = ((gi * 61 + 20 - bgScroll * 0.2) % (canvas.width+80) + canvas.width+80) % (canvas.width+80) - 40;
          const gh = 8 + (gi%4)*4;
          ctx.strokeStyle = '#1e3010';
          ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.moveTo(gx2, fGroundY); ctx.lineTo(gx2-4, fGroundY-gh); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(gx2, fGroundY); ctx.lineTo(gx2, fGroundY-gh-3); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(gx2, fGroundY); ctx.lineTo(gx2+4, fGroundY-gh); ctx.stroke();
        }
        // Green vignette overlay
        const vigGrad = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height*0.25, canvas.width/2, canvas.height/2, canvas.width*0.8);
        vigGrad.addColorStop(0, 'transparent');
        vigGrad.addColorStop(1, 'rgba(0,20,4,0.35)');
        ctx.fillStyle = vigGrad;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

      } else {
        // SPACE (default) — deep space with scrolling stars and nebula
        const spaceBg = ctx.createLinearGradient(0, 0, 0, canvas.height);
        spaceBg.addColorStop(0, '#000008');
        spaceBg.addColorStop(0.5, '#04001a');
        spaceBg.addColorStop(1, '#08000f');
        ctx.fillStyle = spaceBg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Nebula wisps
        const nb = ctx.createRadialGradient(canvas.width*0.3, canvas.height*0.4, 20, canvas.width*0.3, canvas.height*0.4, 220);
        nb.addColorStop(0, 'rgba(80,0,120,0.08)');
        nb.addColorStop(1, 'transparent');
        ctx.fillStyle = nb; ctx.fillRect(0, 0, canvas.width, canvas.height);
        const nb2 = ctx.createRadialGradient(canvas.width*0.75, canvas.height*0.6, 10, canvas.width*0.75, canvas.height*0.6, 180);
        nb2.addColorStop(0, 'rgba(0,40,100,0.10)');
        nb2.addColorStop(1, 'transparent');
        ctx.fillStyle = nb2; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Stars
        STARS.forEach(s => {
          const sx = (s.x * canvas.width + bgScroll * s.speed * 0.4) % canvas.width;
          const sy = s.y * canvas.height;
          const alpha = 0.3 + s.bright * 0.7 * (0.7 + 0.3 * Math.sin(bgScroll * 0.05 + s.bright * 10));
          ctx.beginPath();
          ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
          ctx.fill();
        });
      }
    }

    // --- Input: shoot + slot keys ---
    window.addEventListener('keydown', e => {
      if (e.key === ' ' && !e.repeat) {
        e.preventDefault();
        shootBullet();
      }
      // E: use kid to heal
      if ((e.key === 'e' || e.key === 'E') && !e.repeat) {
        useKid();
      }
      // R: ride / dismount — try truck first, then dino
      if ((e.key === 'r' || e.key === 'R') && !e.repeat) {
        if (!tryRideTruck()) tryRideDino();
      }
      // 1-4: equip slot
      if (['1','2','3','4'].includes(e.key)) {
        const idx = parseInt(e.key) - 1;
        if (inventory.slots[idx] && inventory.slots[idx].unlocked) {
          inventory.equipped = idx;
          renderInventory();
        }
      }
    });

    // --- Game loop ---
    let lastTime = 0;
    function loop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 16.67, 3); // normalize to 60fps
      lastTime = timestamp;

      // --- Game over ---
      if (gameOver) {
        drawBackground();
        return;
      }
      if (egg.hp <= 0 && !gameOver) {
        gameOver = true;
        gameoverStats.textContent = `Wave ${wave.number} · ${coins} 🪙 · ${diamonds} 💎`;
        gameoverEl.classList.add('show');
        document.getElementById('code-bar').style.display = 'none';
        bossBarEl.style.display = 'none';
        // Reset truck state on death
        monsterTruck  = null;
        ridingTruck   = false;
        dinosDisabled = false;
        initWheels();
        return;
      }

      // --- Wave intermission countdown ---
      if (wave.phase === 'intermission') {
        wave.intermissionTimer -= dt;
        if (wave.intermissionTimer <= 0) {
          waveBarFill.style.background = 'linear-gradient(90deg,#ff4400,#ff9900)';
          waveBarFill.style.width = '0%';
          upgradeDinosForWave();
          startWave(wave.number + 1);
        }
      }

      // Input
      let dx = 0, dy = 0;
      if (keys['ArrowLeft']  || keys['a'] || keys['A']) dx -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
      if (keys['ArrowUp']    || keys['w'] || keys['W']) dy -= 1;
      if (keys['ArrowDown']  || keys['s'] || keys['S']) dy += 1;

      // Normalize diagonal
      if (dx !== 0 && dy !== 0) {
        const len = Math.sqrt(dx * dx + dy * dy);
        dx /= len;
        dy /= len;
      }

      egg.isMoving = dx !== 0 || dy !== 0;

      // Move
      if (egg.isMoving) {
        egg.x += dx * egg.speed * dt;
        egg.y += dy * egg.speed * dt;
        egg.dirX = dx;
        egg.dirY = dy;
        egg.walkAngle += 0.15 * dt;
        egg.squashTarget = 0.92;
        // Clamp to canvas
        egg.x = Math.max(egg.rx + 20, Math.min(canvas.width - egg.rx - 20, egg.x));
        egg.y = Math.max(egg.ry + 20, Math.min(canvas.height - egg.ry - 20, egg.y));
        // Particle trail
        if (Math.random() < 0.3 * dt) spawnParticle(egg.x, egg.y);
      } else {
        egg.squashTarget = 1.0;
        // Idle bob
        egg.bobAngle += 0.04 * dt;
      }

      // Smooth squash
      egg.squash += (egg.squashTarget - egg.squash) * 0.15 * dt;

      // Bob offset (idle)
      const bobY = egg.isMoving ? 0 : Math.sin(egg.bobAngle) * 3;

      // Update aim direction from movement, keep last known when idle
      if (egg.isMoving) {
        egg.aimDX = dx;
        egg.aimDY = dy;
      }

      // Decay muzzle flash and recoil
      egg.muzzleFlash = Math.max(0, egg.muzzleFlash - 0.12 * dt);
      egg.recoil      = Math.max(0, egg.recoil      - 0.1  * dt);

      // --- Monster touch damage to player ---
      if (egg.invincible > 0) {
        egg.invincible -= dt;
      } else {
        for (const m of monsters) {
          const dx = egg.x - m.x, dy = egg.y - m.y;
          if (Math.sqrt(dx*dx + dy*dy) < egg.rx + m.r - 4) {
            egg.hp = Math.max(0, egg.hp - 8);
            egg.invincible = 45;
            egg.squashTarget = 1.3;
            break;
          }
        }
      }
      // Update health bar — rainbow stays fixed, only width changes
      healthFill.style.width = (egg.hp / egg.maxHp * 100) + '%';
      healthBarText.textContent = `❤️ ${egg.hp} / ${egg.maxHp}`;

      updateParticles();
      updateBullets(dt);
      updateMonsters(dt);
      // Boss bar update
      const bossM = monsters.find(m => m.boss);
      if (bossM) {
        bossBarEl.style.display = 'block';
        bossBarLabel.textContent = `\u{1F480} ${getBossName()}`;
        const bossHpPct = bossM.hp / bossM.maxHp * 100;
        bossBarFill.style.width = bossHpPct + '%';
        bossBarText.textContent = `${bossM.hp} / ${bossM.maxHp}`;
        bossBarFill.style.background = bossHpPct < 30
          ? 'linear-gradient(90deg,#ff0000,#ff2200)'
          : 'linear-gradient(90deg,#cc0000,#ff4400,#ff8800)';
      } else {
        bossBarEl.style.display = 'none';
      }
      updateDinosaurs(dt);
      updateMonsterTruck(dt);
      updateDeathParticles(dt);
      updateShockwaves(dt);
      updateDrops(dt);
      updateSword(dt);
      updateKidOrbiters(dt);
      if (pickupFlash) {
        pickupFlash.life -= 0.02 * dt;
        if (pickupFlash.life <= 0) pickupFlash = null;
      }
      if (kidHealFlash > 0) kidHealFlash = Math.max(0, kidHealFlash - 0.03 * dt);

      // Draw
      drawBackground();
      drawDinosaurs();
      drawMonsterTruck();
      drawKidOrbiters();
      drawDrops();
      drawMonsters();
      drawShockwaves();
      drawBullets();
      drawParticles();
      drawDeathParticles();
      // Sword arm drawn separately (outside egg transform)
      if (equippedWeapon() && equippedWeapon().type === 'melee') drawSwordArm();
      drawEgg(egg.x, egg.y, egg.walkAngle, bobY, egg.squash);

      // Pickup flash overlay
      if (pickupFlash && pickupFlash.life > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, pickupFlash.life * 2);
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // Upgrade = purple glow, new pickup = gold
        const flashCol = pickupFlash.upgrade ? '#cc88ff' : '#ffd700';
        ctx.fillStyle = flashCol;
        ctx.shadowColor = flashCol;
        ctx.shadowBlur = 16;
        // Maxed (5 stars) gets extra SIZE
        const txt = '✦ ' + pickupFlash.text + ' ✦';
        const isMax = pickupFlash.text.includes('★★★★★');
        ctx.font = `bold ${isMax ? 28 : 22}px monospace`;
        if (isMax) {
          ctx.shadowBlur = 30;
          ctx.shadowColor = '#ffd700';
        }
        ctx.fillText(txt, canvas.width / 2, canvas.height / 2 - 80);
        ctx.restore();
      }

      // Kid heal flash overlay
      if (kidHealFlash > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, kidHealFlash * 2);
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffdd44';
        ctx.shadowColor = '#ffdd44';
        ctx.shadowBlur = 20;
        ctx.fillText(`🥚 +${KID_HEAL} HP`, canvas.width / 2, canvas.height / 2 - 110);
        ctx.restore();
      }

      requestAnimationFrame(loop);
    }

    // Sync initial position after first resize
    egg.x = canvas.width / 2;
    egg.y = canvas.height / 2;
    egg.aimDX = 1;   // default aim right
    egg.aimDY = 0;
    egg.muzzleFlash = 0;
    egg.recoil = 0;

    startWave(1);
    requestAnimationFrame(loop);
 
    // =====================================================================
    // SPIN WHEELS
    // =====================================================================
    const COIN_WHEEL_COST    = 20;
    const DIAMOND_WHEEL_COST = 8;

    // Coin wheel — costs 20 🪙, casual rewards (HP, coins, kids, items)
    const COIN_SEGMENTS = [
      { label: '+1 Kid',    icon: '🥚', color: '#e67e22', reward: () => { addKid();                                          return '+1 Kid 🥚'; } },
      { label: '+30 Coins', icon: '🪙', color: '#f39c12', reward: () => { addCoins(30);                                      return '+30 🪙 Coins'; } },
      { label: '+60 HP',    icon: '❤️', color: '#27ae60', reward: () => { egg.hp = Math.min(egg.maxHp, egg.hp + 60);         return '+60 HP!'; } },
      { label: 'Bazooka+',  icon: '💥', color: '#8e44ad', reward: () => { grantWeapon('bazooka');                            return 'Bazooka upgraded!'; } },
      { label: '+2 Kids',   icon: '🐣', color: '#d35400', reward: () => { addKid(); addKid();                                return '+2 Kids 🐣'; } },
      { label: '+15 Coins', icon: '🪙', color: '#d4ac0d', reward: () => { addCoins(15);                                      return '+15 🪙 Coins'; } },
      { label: '+40 HP',    icon: '💚', color: '#148f77', reward: () => { egg.hp = Math.min(egg.maxHp, egg.hp + 40);         return '+40 HP!'; } },
      { label: 'RPG+',      icon: '🚀', color: '#4488ff', reward: () => { grantWeapon('rpg');                                return 'RPG upgraded!'; } },
    ];

    // Diamond wheel — costs 8 💎, premium rewards (weapons, backgrounds, max HP)
    const DIAMOND_SEGMENTS = [
      { label: 'Sword 5★',   icon: '⚔️', color: '#c0392b', reward: () => { for(let i=0;i<5;i++) grantWeapon('sword');              return '⚔️ Sword → 5★!'; } },
      { label: 'SONIC BG',   icon: '💙', color: '#1a8cff', reward: () => { applyTheme('sonic');                                     return '💙 Sonic Background!'; } },
      { label: 'Dino Cann+', icon: '💣', color: '#d4ac0d', reward: () => { grantWeapon('bomb_gun');                                 return '💣 Dino Cannon ⬆'; } },
      { label: 'MAX HP+50',  icon: '❤️', color: '#117a65', reward: () => { egg.maxHp += 50; egg.hp = egg.maxHp;                     return '❤️ Max HP +50!'; } },
      { label: 'RPG 5★',     icon: '🚀', color: '#154360', reward: () => { for(let i=0;i<5;i++) grantWeapon('rpg');                 return '🚀 RPG → 5★!'; } },
      { label: 'LAVA BG',    icon: '🔥', color: '#b03a00', reward: () => { applyTheme('lava');                                      return '🔥 Lava Background!'; } },
      { label: 'All Weapons',icon: '🎁', color: '#784212', reward: () => { ['rpg','bazooka','sword'].forEach(w=>grantWeapon(w));    return '🎁 All weapons unlocked!'; } },
      { label: '+100 HP',    icon: '💖', color: '#1a5276', reward: () => { egg.hp = Math.min(egg.maxHp, egg.hp + 100);              return '+100 HP!'; } },
    ];

    function drawWheel(canvasEl, segments, rotation) {
      const wctx = canvasEl.getContext('2d');
      const cx = canvasEl.width / 2, cy = canvasEl.height / 2, r = cx - 4;
      const arc = (Math.PI * 2) / segments.length;
      wctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      segments.forEach((seg, i) => {
        const start = rotation + i * arc;
        const end   = start + arc;
        // Slice fill
        wctx.beginPath();
        wctx.moveTo(cx, cy);
        wctx.arc(cx, cy, r, start, end);
        wctx.closePath();
        wctx.fillStyle = seg.color;
        wctx.fill();
        wctx.strokeStyle = 'rgba(0,0,0,0.35)';
        wctx.lineWidth = 1.5;
        wctx.stroke();
        // Draw text label + emoji icon along the slice
        wctx.save();
        wctx.translate(cx, cy);
        wctx.rotate(start + arc / 2);
        wctx.textAlign = 'right';
        wctx.fillStyle = '#fff';
        wctx.shadowColor = '#000';
        wctx.shadowBlur = 3;
        // Icon (emoji) — slightly larger font, closer to edge
        wctx.font = 'bold 13px sans-serif';
        wctx.fillText(seg.icon, r - 8, -6);
        // Label text beneath icon
        wctx.font = 'bold 9px monospace';
        wctx.fillText(seg.label, r - 8, 7);
        wctx.restore();
      });
      // Pointer notch at top
      wctx.save();
      wctx.fillStyle = '#fff';
      wctx.strokeStyle = '#000';
      wctx.lineWidth = 1;
      wctx.beginPath();
      wctx.moveTo(cx - 7, 0);
      wctx.lineTo(cx + 7, 0);
      wctx.lineTo(cx, 16);
      wctx.closePath();
      wctx.fill();
      wctx.stroke();
      wctx.restore();
      // Center cap
      wctx.beginPath();
      wctx.arc(cx, cy, 14, 0, Math.PI * 2);
      wctx.fillStyle = '#111';
      wctx.fill();
      wctx.strokeStyle = '#555';
      wctx.lineWidth = 2;
      wctx.stroke();
    }

    function spinWheel(canvasEl, segments, resultEl, btnEl, onDone) {
      btnEl.disabled = true;
      const totalSpins = (5 + Math.random() * 4) * Math.PI * 2; // 5–9 full spins
      const extra      = Math.random() * Math.PI * 2;            // random landing offset
      const target     = totalSpins + extra;
      const duration   = 3500; // ms
      let startTime    = null;
      const startRot   = 0;

      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

      function frame(ts) {
        if (!startTime) startTime = ts;
        const elapsed = ts - startTime;
        const t   = Math.min(elapsed / duration, 1);
        const rot = startRot + target * easeOut(t);
        drawWheel(canvasEl, segments, rot);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          // Determine winning segment — pointer is at top (−π/2), wheel rotated by rot
          const arc = (Math.PI * 2) / segments.length;
          // Pointer at top = angle -π/2 in wheel's frame
          const pointerAngle = ((-Math.PI / 2 - rot) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
          const winIdx = Math.floor(pointerAngle / arc) % segments.length;
          const seg    = segments[((winIdx % segments.length) + segments.length) % segments.length];
          const msg    = seg.reward();
          resultEl.textContent = '✨ ' + msg;
          resultEl.style.color = seg.color;
          onDone();
        }
      }
      requestAnimationFrame(frame);
    }

    function initWheels() {
      const wCoin    = document.getElementById('wheel-coin');
      const wDiamond = document.getElementById('wheel-diamond');
      const btnC     = document.getElementById('btn-coin');
      const btnD     = document.getElementById('btn-diamond');
      const resC     = document.getElementById('result-coin');
      const resD     = document.getElementById('result-diamond');
      const coinLbl  = document.getElementById('coin-cost-label');
      const diamLbl  = document.getElementById('diamond-cost-label');

      drawWheel(wCoin,    COIN_SEGMENTS,    0);
      drawWheel(wDiamond, DIAMOND_SEGMENTS, 0);

      // Live currency labels
      coinLbl.textContent = `Costs ${COIN_WHEEL_COST} 🪙 · spin until coins run out!`;
      diamLbl.textContent = `Costs ${DIAMOND_WHEEL_COST} 💎 · spin until diamonds run out!`;

      // ---- Coin wheel: spin repeatedly while coins last ----
      btnC.onclick = () => {
        if (btnC.disabled) return;
        if (coins < COIN_WHEEL_COST) {
          resC.textContent = `Need ${COIN_WHEEL_COST} 🪙 (you have ${coins})`;
          resC.style.color = '#e74c3c';
          return;
        }
        coins -= COIN_WHEEL_COST;
        coinCountEl.textContent = coins;
        coinLbl.textContent = `${coins} 🪙 remaining — spin again!`;
        spinWheel(wCoin, COIN_SEGMENTS, resC, btnC, () => {
          // After spin: re-enable button if still enough coins
          if (coins >= COIN_WHEEL_COST) {
            btnC.disabled = false;
            coinLbl.textContent = `${coins} 🪙 remaining — spin again!`;
          } else {
            coinLbl.textContent = `Out of coins 🪙`;
          }
        });
      };

      // ---- Diamond wheel: spin repeatedly while diamonds last ----
      btnD.onclick = () => {
        if (btnD.disabled) return;
        if (diamonds < DIAMOND_WHEEL_COST) {
          resD.textContent = `Need ${DIAMOND_WHEEL_COST} 💎 (you have ${diamonds})`;
          resD.style.color = '#e74c3c';
          return;
        }
        diamonds -= DIAMOND_WHEEL_COST;
        diamondCountEl.textContent = diamonds;
        diamLbl.textContent = `${diamonds} 💎 remaining — spin again!`;
        spinWheel(wDiamond, DIAMOND_SEGMENTS, resD, btnD, () => {
          if (diamonds >= DIAMOND_WHEEL_COST) {
            btnD.disabled = false;
            diamLbl.textContent = `${diamonds} 💎 remaining — spin again!`;
          } else {
            diamLbl.textContent = `Out of diamonds 💎`;
          }
        });
      };
    }
  </script>
