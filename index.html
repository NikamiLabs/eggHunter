<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EggHonter</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; display: flex; align-items: center; justify-content: center; height: 100vh; overflow: hidden; font-family: monospace; }
    canvas { display: block; background: #000; }
    /* code bar */
    #code-bar {
      position: fixed; bottom: 36px; right: 18px; z-index: 20;
      display: flex; gap: 6px; align-items: center;
    }
    #code-input {
      background: rgba(0,0,0,0.7); border: 1px solid #444; border-radius: 6px;
      color: #aaa; font-size: 11px; font-family: monospace; padding: 4px 8px;
      width: 110px; outline: none;
    }
    #code-input::placeholder { color: #444; }
    #code-btn {
      background: #222; border: 1px solid #555; border-radius: 6px;
      color: #888; font-size: 10px; font-family: monospace; padding: 4px 8px;
      cursor: pointer;
    }
    #code-btn:hover { background: #333; color: #fff; }
    #code-msg { font-size: 10px; color: #4cff88; min-width: 80px; }

    #hint {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      color: #333; font-size: 12px; letter-spacing: 0.07em;
      pointer-events: none; user-select: none;
    }
    /* ---- HUD top bar (health) — full-width rainbow ---- */
    #hud {
      position: fixed; top: 0; left: 0; right: 0;
      display: flex; align-items: center; gap: 14px;
      padding: 8px 16px;
      pointer-events: none; user-select: none;
      z-index: 10;
    }
    #hud-label { color: #f9a825; font-size: 20px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 900; white-space: nowrap; text-shadow: 0 0 10px #f9a825bb; }
    #health-bar-bg { flex: 1; height: 52px; background: #111; border: 3px solid #555; border-radius: 26px; overflow: hidden; position: relative; }
    #health-bar-fill {
      height: 100%; width: 100%;
      background: linear-gradient(90deg, #ff0000, #ff7700, #ffee00, #00dd44, #00aaff, #aa44ff);
      border-radius: 26px; transition: width 0.12s;
    }
    #health-bar-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: #fff; letter-spacing: 0.08em; text-shadow: 0 0 10px #000, 0 1px 3px #000; pointer-events: none; font-family: monospace; }

    /* ---- Kids HUD (right side) ---- */
    #kids-hud {
      position: fixed; top: 70px; right: 14px;
      display: flex; flex-direction: column; gap: 4px; align-items: flex-end;
      pointer-events: none; user-select: none;
    }
    #kids-label { color: #ffcc44; font-size: 11px; letter-spacing: 0.07em; font-weight: bold; }
    #kids-row { display: flex; gap: 5px; }
    .kid-icon { font-size: 18px; line-height: 1; filter: drop-shadow(0 0 4px #ffcc44aa); }
    .kid-icon.empty { opacity: 0.18; filter: none; }
    #kids-hint { color: #666; font-size: 9px; letter-spacing: 0.05em; }

    /* ---- Dino HUD (left side) ---- */
    #dino-hud {
      position: fixed; top: 70px; left: 14px;
      display: flex; flex-direction: column; gap: 3px;
      pointer-events: none; user-select: none;
    }
    #dino-label { color: #4cff88; font-size: 11px; letter-spacing: 0.07em; font-weight: bold; }
    #dino-row   { display: flex; gap: 3px; }
    .dino-icon  { font-size: 16px; line-height: 1; filter: drop-shadow(0 0 4px #4cff8888); }
    #dino-hint  { color: #555; font-size: 9px; letter-spacing: 0.05em; }

    /* ---- Wave HUD — compact bar, top-left below dino HUD ---- */
    #wave-hud {
      position: fixed; top: 8px; left: 16px;
      display: flex; flex-direction: column; gap: 3px;
      pointer-events: none; user-select: none;
      z-index: 10;
    }
    #wave-label {
      color: #ff6644; font-size: 13px; letter-spacing: 0.1em; font-weight: 900;
      text-shadow: 0 0 10px #ff440088;
      line-height: 1;
    }
    #wave-bar-bg {
      width: 200px; height: 14px;
      background: #1a1a1a; border: 1px solid #444; border-radius: 7px;
      overflow: hidden; position: relative;
    }
    #wave-bar-fill { height: 100%; width: 0%; background: linear-gradient(90deg,#ff2200,#ff6600,#ffaa00); border-radius: 7px; transition: width 0.1s; }
    #wave-bar-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: bold; color: #fff; letter-spacing: 0.08em; text-shadow: 0 0 4px #000; pointer-events: none; }
    #currency-row { display: flex; gap: 10px; margin-top: 1px; }
    .curr-item { color: #eee; font-size: 11px; display: flex; align-items: center; gap: 3px; font-weight: bold; }
    .curr-coin { color: #ffd700; }
    .curr-diamond { color: #44ddff; }

    /* ---- Inventory bar (bottom-center, raised) ---- */
    #inv-bar {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 10px; padding: 10px 16px;
      background: rgba(0,0,0,0.88); border: 1px solid #3a3a3a; border-radius: 16px;
      user-select: none;
    }
    .inv-slot {
      width: 72px; height: 72px; border-radius: 12px; border: 2px solid #333;
      background: #111; cursor: pointer; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 3px;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s; position: relative;
    }
    .inv-slot:hover:not(.locked) { border-color: #888; background: #1c1c1c; }
    .inv-slot.equipped { border-color: #f9a825 !important; background: #1a1100; box-shadow: 0 0 12px 3px #f9a82555; }
    .inv-slot.locked { opacity: 0.28; cursor: default; filter: grayscale(1); }
    .inv-slot .slot-icon { font-size: 26px; line-height: 1; }
    .inv-slot .slot-name { font-size: 8px; color: #aaa; letter-spacing: 0.02em; text-align: center; line-height: 1.2; }
    .inv-slot.equipped .slot-name { color: #f9a825; }
    .inv-slot .slot-stars { font-size: 9px; letter-spacing: -1px; line-height: 1; }
    .inv-slot.rarity-common  { border-color: #555; }
    .inv-slot.rarity-rare    { border-color: #4488ff; }
    .inv-slot.rarity-epic    { border-color: #aa44ff; }
    .inv-slot.rarity-legend  { border-color: #ffd700; background: #110a00; }
    .inv-slot.equipped.rarity-legend { background: #1c1200; }
    @keyframes legendPulse {
      0%,100% { box-shadow: 0 0 22px 6px #ffd70099, 0 0 40px 10px #ff880066; }
      50%      { box-shadow: 0 0 32px 10px #ffd700cc, 0 0 56px 16px #ff6600aa; }
    }
    /* ---- Game over / spin screen ---- */
    #gameover {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      align-items: flex-start; justify-content: center; flex-direction: column; gap: 0;
      color: #fff; font-family: monospace; overflow-y: auto;
    }
    #gameover.show { display: flex; }
    #go-header { text-align: center; width: 100%; padding: 18px 0 6px; }
    #go-header h1 { font-size: 40px; color: #e74c3c; text-shadow: 0 0 20px #e74c3c88; margin: 0; }
    #go-header p  { font-size: 14px; color: #aaa; margin: 4px 0 0; }
    #wheels-row {
      display: flex; gap: 32px; justify-content: center; align-items: flex-start;
      width: 100%; padding: 12px 24px 0; flex-wrap: wrap;
    }
    .wheel-panel {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.04); border: 1px solid #333; border-radius: 16px;
      padding: 16px 20px 14px;
    }
    .wheel-title { font-size: 15px; font-weight: bold; letter-spacing: 0.08em; }
    .wheel-cost  { font-size: 11px; color: #888; }
    .wheel-wrap  { position: relative; width: 220px; height: 220px; }
    .wheel-canvas { border-radius: 50%; }
    .wheel-pointer {
      position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
      width: 0; height: 0;
      border-left: 10px solid transparent; border-right: 10px solid transparent;
      border-top: 22px solid #fff;
      filter: drop-shadow(0 2px 4px #000);
    }
    .wheel-btn {
      padding: 9px 28px; border: none; border-radius: 8px;
      font-size: 14px; font-family: monospace; font-weight: bold;
      cursor: pointer; transition: opacity 0.15s;
    }
    .wheel-btn:disabled { opacity: 0.35; cursor: default; }
    .wheel-btn.coin-btn   { background: #c9900a; color: #fff; border: 2px solid #ffd700; }
    .wheel-btn.coin-btn:hover:not(:disabled)   { background: #a87800; }
    .wheel-btn.diamond-btn { background: #1565c0; color: #fff; border: 2px solid #44aaff; }
    .wheel-btn.diamond-btn:hover:not(:disabled){ background: #0d47a1; }
    .wheel-result { font-size: 13px; font-weight: bold; min-height: 20px; text-align: center; }
    #go-actions { display: flex; gap: 14px; justify-content: center; width: 100%; padding: 14px 0 20px; }
    #go-actions button { padding: 11px 30px; background: #e74c3c; border: none; border-radius: 8px; color: #fff; font-size: 15px; font-family: monospace; cursor: pointer; }
    #go-actions button:hover { background: #c0392b; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hint">WASD · SPACE attack · 1-4 weapon · E heal · R ride dino</div>
  <div id="hud">
    <span id="hud-label">❤️ HP</span>
    <div id="health-bar-bg">
      <div id="health-bar-fill"></div>
      <div id="health-bar-text">300 / 300</div>
    </div>
  </div>
  <div id="wave-hud">
    <span id="wave-label">WAVE 1</span>
    <div id="wave-bar-bg">
      <div id="wave-bar-fill"></div>
      <div id="wave-bar-text">0 / 12 kills</div>
    </div>
    <div id="currency-row">
      <span class="curr-item"><span class="curr-coin">🪙</span><span id="coin-count">0</span></span>
      <span class="curr-item"><span class="curr-diamond">💎</span><span id="diamond-count">0</span></span>
    </div>
  </div>
  <div id="kids-hud">
    <span id="kids-label">🥚 KIDS</span>
    <div id="kids-row"></div>
    <span id="kids-hint">[ E ] use kid → heal</span>
  </div>
  <div id="dino-hud">
    <span id="dino-label">🦕 DINOS</span>
    <div id="dino-row"></div>
    <span id="dino-hint">[ R ] ride nearest dino</span>
  </div>
  <div id="inv-bar"></div>
  <div id="code-bar">
    <input id="code-input" type="text" placeholder="enter code..." maxlength="20" autocomplete="off" spellcheck="false"/>
    <button id="code-btn">APPLY</button>
    <span id="code-msg"></span>
  </div>
  <div id="gameover">
    <div id="go-header">
      <h1>💀 YOU DIED</h1>
      <p id="gameover-stats"></p>
    </div>
    <div id="wheels-row">
      <!-- Coin Wheel (golden) -->
      <div class="wheel-panel" style="border-color:#b8860b;">
        <div class="wheel-title" style="color:#ffd700">🪙 COIN WHEEL</div>
        <div class="wheel-cost" id="coin-cost-label">Costs 20 🪙 · once per death</div>
        <div class="wheel-wrap">
          <canvas id="wheel-coin" class="wheel-canvas" width="220" height="220"></canvas>
          <div class="wheel-pointer" style="border-top-color:#ffd700;"></div>
        </div>
        <div class="wheel-result" id="result-coin"></div>
        <button class="wheel-btn coin-btn" id="btn-coin">SPIN (20 🪙)</button>
      </div>
      <!-- Diamond Wheel (blue) -->
      <div class="wheel-panel" style="border-color:#1565c0;">
        <div class="wheel-title" style="color:#44aaff">💎 DIAMOND WHEEL</div>
        <div class="wheel-cost" id="diamond-cost-label">Costs 8 💎 · once per death</div>
        <div class="wheel-wrap">
          <canvas id="wheel-diamond" class="wheel-canvas" width="220" height="220"></canvas>
          <div class="wheel-pointer" style="border-top-color:#44aaff;"></div>
        </div>
        <div class="wheel-result" id="result-diamond"></div>
        <button class="wheel-btn diamond-btn" id="btn-diamond">SPIN (8 💎)</button>
      </div>
    </div>
    <div id="go-actions">
      <button onclick="location.reload()">▶ PLAY AGAIN</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // Resize canvas to 80% of window, centered
    function resize() {
      canvas.width  = Math.floor(window.innerWidth  * 0.80);
      canvas.height = Math.floor(window.innerHeight * 0.80);
    }
    resize();
    window.addEventListener('resize', resize);

    // --- Egg character state ---
    const egg = {
      x: canvas.width / 2,
      y: canvas.height / 2,
      speed: 4,
      rx: 22, ry: 28,
      bobAngle: 0, walkAngle: 0,
      isMoving: false,
      dirX: 0, dirY: 0,
      squash: 1.0, squashTarget: 1.0,
      hp: 300, maxHp: 300,
      invincible: 0,   // frames of invincibility after hit
    };

    // --- HUD refs ---
    const healthFill    = document.getElementById('health-bar-fill');
            const healthBarText = document.getElementById('health-bar-text');
    const invBarEl      = document.getElementById('inv-bar');
    const waveLabel     = document.getElementById('wave-label');
    const waveBarFill   = document.getElementById('wave-bar-fill');
    const waveBarText   = document.getElementById('wave-bar-text');
    const coinCountEl   = document.getElementById('coin-count');
    const diamondCountEl= document.getElementById('diamond-count');
    const gameoverEl    = document.getElementById('gameover');
    const gameoverStats = document.getElementById('gameover-stats');
    const kidsRowEl     = document.getElementById('kids-row');

    // --- Currency ---
    let coins    = 0;
    let diamonds = 0;
    let gameOver = false;

    function addCoins(n)    { coins    += n; coinCountEl.textContent    = coins; }
    function addDiamonds(n) { diamonds += n; diamondCountEl.textContent = diamonds; }

    // =====================================================================
    // KIDS SYSTEM
    // =====================================================================
    const MAX_KIDS = 3;
    const KID_HEAL = 80;      // HP restored when consuming a kid
    let kids = 0;             // how many kids the player is carrying

    function renderKidsHUD() {
      kidsRowEl.innerHTML = '';
      for (let i = 0; i < MAX_KIDS; i++) {
        const span = document.createElement('span');
        span.className = 'kid-icon' + (i < kids ? '' : ' empty');
        span.textContent = '🥚';
        kidsRowEl.appendChild(span);
      }
    }
    renderKidsHUD();

    function addKid() {
      if (kids < MAX_KIDS) { kids++; renderKidsHUD(); }
    }

    function useKid() {
      if (kids <= 0 || egg.hp >= egg.maxHp) return;
      kids--;
      renderKidsHUD();
      // Heal
      egg.hp = Math.min(egg.maxHp, egg.hp + KID_HEAL);
      // Burst of golden particles at egg position
      for (let i = 0; i < 18; i++) {
        const a = (i / 18) * Math.PI * 2;
        deathParticles.push({
          x: egg.x, y: egg.y,
          vx: Math.cos(a) * (3 + Math.random() * 5),
          vy: Math.sin(a) * (3 + Math.random() * 5),
          life: 1.0, r: 4 + Math.random() * 5,
          color: '#ffdd44',
        });
      }
      kidHealFlash = 1.0;
    }

    let kidHealFlash = 0; // for on-screen heal text

    // Kid companions (canvas-drawn mini-eggs orbiting player)
    // These are purely visual — each represents one carried kid
    const kidOrbiters = [];   // { angle, dist, bobAngle }
    function syncKidOrbiters() {
      // Add or remove orbiters to match kids count
      while (kidOrbiters.length < kids) {
        kidOrbiters.push({ angle: (kidOrbiters.length / MAX_KIDS) * Math.PI * 2, dist: 55 + kidOrbiters.length * 10, bobAngle: Math.random() * Math.PI * 2 });
      }
      while (kidOrbiters.length > kids) kidOrbiters.pop();
    }
    syncKidOrbiters();

    function updateKidOrbiters(dt) {
      syncKidOrbiters();
      for (const k of kidOrbiters) {
        k.angle    += 0.018 * dt;
        k.bobAngle += 0.07 * dt;
      }
    }

    function drawKidOrbiters() {
      for (const k of kidOrbiters) {
        const kx = egg.x + Math.cos(k.angle) * k.dist;
        const ky = egg.y + Math.sin(k.angle) * k.dist + Math.sin(k.bobAngle) * 3;
        ctx.save();
        ctx.translate(kx, ky);

        // tiny shadow
        ctx.save();
        ctx.scale(1, 0.25);
        ctx.beginPath();
        ctx.ellipse(0, 18, 10, 5, 0, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fill();
        ctx.restore();

        // tiny egg body
        const g = ctx.createRadialGradient(-3, -4, 1, 0, 0, 13);
        g.addColorStop(0, '#fffde7');
        g.addColorStop(0.5, '#fff9c4');
        g.addColorStop(1, '#f9a825');
        ctx.beginPath();
        ctx.ellipse(0, 0, 9, 12, 0, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
        ctx.strokeStyle = 'rgba(0,0,0,0.15)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // tiny eyes
        ctx.fillStyle = '#1a1a1a';
        ctx.beginPath(); ctx.arc(-3.5, -3, 1.8, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc( 3.5, -3, 1.8, 0, Math.PI * 2); ctx.fill();
        // eye shines
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(-4, -3.5, 0.6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc( 3, -3.5, 0.6, 0, Math.PI * 2); ctx.fill();

        // tiny smile
        ctx.beginPath();
        ctx.arc(0, 3, 3.5, 0.2, Math.PI - 0.2);
        ctx.strokeStyle = 'rgba(0,0,0,0.4)';
        ctx.lineWidth = 1.2;
        ctx.lineCap = 'round';
        ctx.stroke();

        // glow ring
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255,220,50,0.18)';
        ctx.lineWidth = 6;
        ctx.stroke();

        ctx.restore();
      }
    }

    // =====================================================================
    // WAVE SYSTEM
    // =====================================================================
    const wave = {
      number:   1,
      killsNeeded: 10,
      kills:    0,
      phase: 'fighting',   // 'fighting' | 'boss' | 'intermission'
      bossAlive: false,
      intermissionTimer: 0,
    };

    function startWave(n) {
      wave.number      = n;
      wave.kills       = 0;
      wave.killsNeeded = 8 + n * 4;
      wave.phase       = 'fighting';
      wave.bossAlive   = false;
      waveLabel.textContent = `WAVE ${n}`;
      waveBarText.textContent = `0 / ${wave.killsNeeded} kills`;
      monsters.length  = 0;
      bullets.length   = 0;
      // Scale monster difficulty
      SPAWN_INTERVAL_CURRENT = Math.max(40, 120 - n * 8);
      monsterSpeedMult       = 1 + (n - 1) * 0.18;
      monsterHpMult          = Math.ceil(1 + (n - 1) * 0.5);
    }

    function onKill(m) {
      // Currency drops
      if (m.boss)        { addCoins(15); addDiamonds(3); }
      else if (m.golden) { addCoins(5);  addDiamonds(1); }
      else               { addCoins(1); }

      // Kid drop: golden zombies have 40% chance, boss always drops one
      if (m.boss || (m.golden && Math.random() < 0.4)) {
        addKid();
      }

      // Bomb gun upgrade drop: every normal zombie has 60% chance, golden 100%
      if (!m.boss) {
        if (m.golden || Math.random() < 0.60) {
          const bombSlot = inventory.slots.find(s => s.weapon && s.weapon.id === 'bomb_gun');
          if (bombSlot && bombSlot.stars < 5) {
            grantWeapon('bomb_gun');
          }
        }
      }

      if (wave.phase === 'fighting') {
        wave.kills++;
        const pct = Math.min(1, wave.kills / wave.killsNeeded);
        waveBarFill.style.width = (pct * 100) + '%';
        waveBarText.textContent = `${wave.kills} / ${wave.killsNeeded} kills`;
        if (wave.kills >= wave.killsNeeded) {
          wave.phase = 'boss';
          waveBarText.textContent = '⚠ BOSS INCOMING ⚠';
          spawnBoss();
        }
      } else if (wave.phase === 'boss' && m.boss) {
        wave.bossAlive = false;
        wave.phase     = 'intermission';
        wave.intermissionTimer = 180; // ~3s
        waveBarFill.style.width = '100%';
        waveBarFill.style.background = 'linear-gradient(90deg,#ffd700,#fff)';
        waveBarText.textContent = '✔ WAVE COMPLETE!';
      }
    }

    let SPAWN_INTERVAL_CURRENT = 120;
    let monsterSpeedMult = 1;
    let monsterHpMult    = 1;

    // =====================================================================
    // WEAPON DEFINITIONS
    // =====================================================================
    const WEAPONS = {
      bomb_gun: {
        id: 'bomb_gun', name: 'Dino Cannon', icon: '💣',
        rarity: 'legend', type: 'ranged',
        desc: 'Legendary explosive. Spawns dinosaurs at 5★.',
      },
      rpg: {
        id: 'rpg', name: 'RPG', icon: '🚀',
        rarity: 'rare', type: 'ranged',
        desc: 'Rocket launcher. Big blast.',
      },
      bazooka: {
        id: 'bazooka', name: 'Bazooka', icon: '💥',
        rarity: 'epic', type: 'ranged',
        desc: 'Massive AOE explosion.',
      },
      sword: {
        id: 'sword', name: 'Legendary Sword', icon: '⚔️',
        rarity: 'legend', type: 'melee',
        desc: 'Swing to slash all nearby enemies.',
      },
    };

    // Weapon loot pool for golden zombie drops (excluding starting weapon)
    // bomb_gun included so it can be upgraded easily via drops
    const LOOT_POOL = ['bomb_gun', 'bomb_gun', 'bomb_gun', 'rpg', 'bazooka', 'sword'];

    // =====================================================================
    // INVENTORY STATE
    // =====================================================================
    const inventory = {
      // Fixed order: bomb_gun (always owned) → bazooka → rpg → sword
      slots: [
        { weapon: WEAPONS.bomb_gun, unlocked: true,  stars: 1 },
        { weapon: WEAPONS.bazooka,  unlocked: false, stars: 0 },
        { weapon: WEAPONS.rpg,      unlocked: false, stars: 0 },
        { weapon: WEAPONS.sword,    unlocked: false, stars: 0 },
      ],
      equipped: 0,
    };

    function equippedWeapon() { return inventory.slots[inventory.equipped].weapon; }
    function equippedStars()  { return inventory.slots[inventory.equipped].stars;  }
    const MAX_STARS = 20;
    function isMaxStar()      { return equippedStars() >= MAX_STARS; }

    // Stars to display (up to 20 — show blocks of 5 with separators)
    function starsLabel(n) {
      const filled = Math.min(n, MAX_STARS);
      const empty  = MAX_STARS - filled;
      return '★'.repeat(filled) + '☆'.repeat(empty);
    }

    function grantWeapon(weaponId) {
      const existing = inventory.slots.find(s => s.weapon && s.weapon.id === weaponId);
      if (existing) {
        // If the slot exists but was never unlocked, unlock it now
        if (!existing.unlocked) {
          existing.unlocked = true;
          existing.stars    = 1;
          inventory.equipped = inventory.slots.indexOf(existing);
          renderInventory();
          pickupFlash = { text: WEAPONS[weaponId].icon + ' ' + WEAPONS[weaponId].name + ' ★', life: 1.0, upgrade: false };
          return;
        }
        // Already unlocked → upgrade stars (max 20)
        if (existing.stars < MAX_STARS) {
          existing.stars++;
          renderInventory();
          pickupFlash = {
            text: WEAPONS[weaponId].icon + ' ' + WEAPONS[weaponId].name + ' ' + existing.stars + '★',
            life: 1.0, upgrade: true,
          };
        }
        return;
      }
      // Fallback: weapon not in slots at all — shouldn't happen but handle it
      renderInventory();
    }

    let pickupFlash = null;

    function renderInventory() {
      invBarEl.innerHTML = '';
      inventory.slots.forEach((slot, i) => {
        const div = document.createElement('div');
        div.className = 'inv-slot';
        // Always show weapon identity (even when locked)
        div.classList.add('rarity-' + slot.weapon.rarity);
        if (!slot.unlocked) {
          div.classList.add('locked');
          // Show greyed weapon icon so player knows what's coming
          div.innerHTML = `<span class="slot-icon">${slot.weapon.icon}</span><span class="slot-name">${slot.weapon.name}</span><span class="slot-stars" style="color:#444">${starsLabel(0)}</span>`;
        } else {
          if (i === inventory.equipped) div.classList.add('equipped');
          const maxed = slot.stars >= 5;
          const isBombLegend = slot.weapon.id === 'bomb_gun' && maxed;
          const starColor = maxed ? '#ffd700' : '#aaa';
          div.innerHTML = `<span class="slot-icon">${slot.weapon.icon}</span><span class="slot-name">${slot.weapon.name}</span><span class="slot-stars" style="color:${starColor}">${starsLabel(slot.stars)}</span>`;
          if (isBombLegend) {
            // Rainbow animated glow for legendary maxed Dino Cannon
            div.style.boxShadow = '0 0 22px 6px #ffd70099, 0 0 40px 10px #ff880066';
            div.style.border = '2px solid #ffd700';
            div.style.background = 'linear-gradient(135deg,#1c1200,#2a1800,#1c1200)';
            div.style.animation = 'legendPulse 1.4s ease-in-out infinite';
          } else if (maxed) {
            div.style.boxShadow = '0 0 14px 3px #ffd70077';
          }
          div.addEventListener('click', () => { inventory.equipped = i; renderInventory(); });
        }
        // Slot number badge
        const num = document.createElement('span');
        num.style.cssText = 'position:absolute;top:3px;left:5px;font-size:9px;color:#555;font-weight:bold;';
        num.textContent = i + 1;
        div.appendChild(num);
        invBarEl.appendChild(div);
      });
    }
    renderInventory();

    // --- Input ---
    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.key] = true;
      // Prevent page scroll
      if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) {
        e.preventDefault();
      }
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });

    // =====================================================================
    // DINOSAUR SYSTEM
    // =====================================================================
    const dinoRowEl  = document.getElementById('dino-row');
    const dinoHintEl = document.getElementById('dino-hint');
    const dinosaurs  = [];   // active normal dino allies on the field
    let   ridingDino = null; // the dino the egg is currently riding (or null)

    // Mega dino state — null when not alive
    let megaDino = null;
    let dinoDeathCount = 0;      // how many normal dinos have died total
    const MEGA_THRESHOLD = 10;   // deaths needed to summon the mega dino

    // Per-wave base stats — scale with wave number
    function dinoBaseHp()    { return 40 + wave.number * 15; }
    function dinoBaseAtk()   { return 10 + wave.number * 3;  }
    function dinoBaseSpeed() { return 2.2 + wave.number * 0.1; }

    function renderDinoHUD() {
      dinoRowEl.innerHTML = '';
      if (megaDino) {
        // Show mega dino status
        const sp = document.createElement('span');
        sp.className = 'dino-icon';
        sp.style.fontSize = '28px';
        sp.textContent = '🦖';
        dinoRowEl.appendChild(sp);
        dinoHintEl.textContent = ridingDino === megaDino ? '🔴 RIDING MEGA DINO' : '[ R ] ride MEGA dino';
      } else {
        const max = Math.min(dinosaurs.length, 8);
        for (let i = 0; i < max; i++) {
          const sp = document.createElement('span');
          sp.className = 'dino-icon';
          sp.textContent = '🦕';
          dinoRowEl.appendChild(sp);
        }
        // Show progress toward mega dino
        const remaining = MEGA_THRESHOLD - dinoDeathCount;
        dinoHintEl.textContent = remaining > 0
          ? `${dinoDeathCount}/${MEGA_THRESHOLD} deaths → MEGA DINO`
          : '[ R ] ride nearest dino';
      }
    }

    function spawnDino(x, y) {
      const hp = dinoBaseHp();
      dinosaurs.push({
        x, y,
        r: 28,
        speed: dinoBaseSpeed(),
        hp, maxHp: hp,
        atk: dinoBaseAtk(),
        atkCooldown: 0,
        bobAngle: Math.random() * Math.PI * 2,
        walkAngle: 0,
        hitFlash: 0,
        mega: false,
      });
      renderDinoHUD();
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        deathParticles.push({
          x, y,
          vx: Math.cos(a) * (2 + Math.random() * 5),
          vy: Math.sin(a) * (2 + Math.random() * 5),
          life: 1.0, r: 5 + Math.random() * 5,
          color: '#4cff88',
        });
      }
    }

    function spawnMegaDino() {
      // Kill all normal dinos first
      dinosaurs.length = 0;
      if (ridingDino && !ridingDino.mega) { ridingDino = null; egg.speed = 4; }

      const cx = canvas.width / 2, cy = canvas.height / 2;
      const hp = 600 + wave.number * 80;
      megaDino = {
        x: cx, y: cy,
        r: 72,
        speed: 3.8 + wave.number * 0.12,
        hp, maxHp: hp,
        atk: 35 + wave.number * 8,
        atkCooldown: 0,
        bobAngle: 0,
        walkAngle: 0,
        hitFlash: 0,
        mega: true,
      };
      renderDinoHUD();
      // Big red dramatic burst
      for (let i = 0; i < 40; i++) {
        const a = (i / 40) * Math.PI * 2;
        deathParticles.push({
          x: cx, y: cy,
          vx: Math.cos(a) * (3 + Math.random() * 10),
          vy: Math.sin(a) * (3 + Math.random() * 10),
          life: 1.0, r: 8 + Math.random() * 10,
          color: ['#ff2200','#ff6600','#ff0000','#ff4400'][Math.floor(Math.random()*4)],
        });
      }
      shockwaves.push({ x: cx, y: cy, r: 10, life: 1.5 });
    }

    function upgradeDinosForWave() {
      for (const d of dinosaurs) {
        const hp = dinoBaseHp();
        const heal = hp - d.maxHp;
        d.maxHp = hp;
        d.hp    = Math.min(d.maxHp, d.hp + Math.max(0, heal));
        d.atk   = dinoBaseAtk();
        d.speed = dinoBaseSpeed();
      }
      if (megaDino) {
        const hp = 600 + wave.number * 80;
        megaDino.maxHp = hp;
        megaDino.hp = Math.min(hp, megaDino.hp + 100);
        megaDino.atk = 35 + wave.number * 8;
        megaDino.speed = 3.8 + wave.number * 0.12;
      }
    }

    function tryRideDino() {
      // Dismount if already riding
      if (ridingDino) {
        ridingDino = null;
        egg.speed = 4;
        return;
      }
      // Try mega dino first
      if (megaDino) {
        const dx = egg.x - megaDino.x, dy = egg.y - megaDino.y;
        if (Math.sqrt(dx*dx + dy*dy) < egg.rx + megaDino.r + 40) {
          ridingDino = megaDino;
          egg.speed = 11; // mega speed boost
          renderDinoHUD();
          return;
        }
      }
      // Fall back to nearest normal dino
      let nearest = null, bestDist = Infinity;
      for (const d of dinosaurs) {
        const dx = egg.x - d.x, dy = egg.y - d.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < bestDist) { bestDist = dist; nearest = d; }
      }
      if (nearest && bestDist < egg.rx + nearest.r + 28) {
        ridingDino = nearest;
        egg.speed = 7;
        renderDinoHUD();
      }
    }

    // Shared movement/attack logic for one dino object (normal or mega)
    function updateOneDino(d, i, isMega, dt) {
      if (d === ridingDino) {
        // Snap below egg when riding
        d.x = egg.x + (isMega ? 0 : 2);
        d.y = egg.y + egg.ry + (isMega ? 30 : 12);
      } else {
        // Chase nearest zombie
        let target = null, bestDist = Infinity;
        for (const m of monsters) {
          const dx = m.x - d.x, dy = m.y - d.y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < bestDist) { bestDist = dist; target = m; }
        }
        if (target) {
          const dx = target.x - d.x, dy = target.y - d.y;
          const dist = Math.sqrt(dx*dx + dy*dy) || 1;
          d.x += (dx / dist) * d.speed * dt;
          d.y += (dy / dist) * d.speed * dt;
        }
      }

      d.bobAngle  += 0.07 * dt;
      d.walkAngle += 0.14 * dt;
      if (d.hitFlash > 0)    d.hitFlash    = Math.max(0, d.hitFlash    - 0.06 * dt);
      if (d.atkCooldown > 0) d.atkCooldown -= dt;

      // Attack zombies in range
      for (let j = monsters.length - 1; j >= 0; j--) {
        const m = monsters[j];
        const dx = m.x - d.x, dy = m.y - d.y;
        if (Math.sqrt(dx*dx + dy*dy) < d.r + m.r + (isMega ? 20 : 5) && d.atkCooldown <= 0) {
          d.atkCooldown = isMega ? 25 : 40;
          m.hp -= d.atk;
          m.hitFlash = 1.0;
          if (m.hp <= 0) {
            if (m.golden) dropWeaponAt(m.x, m.y);
            spawnDeathParticles(m.x, m.y, m.color);
            spawnDeathParticles(m.x, m.y, isMega ? '#ff4400' : '#4cff88');
            onKill(m);
            monsters.splice(j, 1);
          }
          break;
        }
      }

      // Monsters damage the dino
      for (const m of monsters) {
        const dx = m.x - d.x, dy = m.y - d.y;
        if (Math.sqrt(dx*dx + dy*dy) < d.r + m.r - 4 && d.atkCooldown <= 0) {
          d.hp -= m.boss ? (isMega ? 12 : 8) : (isMega ? 5 : 3);
          d.hitFlash = 1.0;
          d.atkCooldown = 30;
          break;
        }
      }
    }

    function updateDinosaurs(dt) {
      // Update normal dinos
      for (let i = dinosaurs.length - 1; i >= 0; i--) {
        const d = dinosaurs[i];
        updateOneDino(d, i, false, dt);
        if (d.hp <= 0) {
          if (d === ridingDino) { ridingDino = null; egg.speed = 4; }
          spawnDeathParticles(d.x, d.y, '#4cff88');
          spawnDeathParticles(d.x, d.y, '#22aa55');
          dinosaurs.splice(i, 1);
          dinoDeathCount++;
          renderDinoHUD();
          // Reached threshold → summon the mega dino
          if (dinoDeathCount >= MEGA_THRESHOLD && !megaDino) {
            spawnMegaDino();
          }
        }
      }

      // Update mega dino
      if (megaDino) {
        updateOneDino(megaDino, -1, true, dt);
        if (megaDino.hp <= 0) {
          if (ridingDino === megaDino) { ridingDino = null; egg.speed = 4; }
          // Mega dino death — huge explosion
          for (let i = 0; i < 50; i++) {
            const a = (i / 50) * Math.PI * 2;
            deathParticles.push({
              x: megaDino.x, y: megaDino.y,
              vx: Math.cos(a) * (4 + Math.random() * 12),
              vy: Math.sin(a) * (4 + Math.random() * 12),
              life: 1.0, r: 10 + Math.random() * 12,
              color: ['#ff2200','#ff6600','#ff0000'][Math.floor(Math.random()*3)],
            });
          }
          shockwaves.push({ x: megaDino.x, y: megaDino.y, r: 10, life: 1.5 });
                    const mx = megaDino.x, my = megaDino.y;
          megaDino = null;
          // Spawn fresh pack of 5 normal dinos at the mega's last position
          dinoDeathCount = 0;
          for (let i = 0; i < 5; i++) {
            const a = (i / 5) * Math.PI * 2;
            spawnDino(mx + Math.cos(a) * 60, my + Math.sin(a) * 60);
          }
          renderDinoHUD();
        }
      }
    }

    function drawDinosaur(d) {
      const isRiding = d === ridingDino;
      const bob = isRiding ? 0 : Math.sin(d.bobAngle) * 2.5;
      ctx.save();
      ctx.translate(d.x, d.y + bob);

      const f = d.hitFlash;
      const isMega = !!d.mega;

      // --- colour palette: red for mega, green for normal ---
      const bodyCol  = f > 0 ? `rgba(255,255,255,${f})` : (isMega ? '#cc1100' : '#2d8a4e');
      const bodyCol2 = f > 0 ? `rgba(220,180,180,${f})` : (isMega ? '#7a0800' : '#1a5c33');
      const headCol  = f > 0 ? `rgba(255,255,255,${f})` : (isMega ? '#ee2200' : '#3aaa60');
      const spikeCol = f > 0 ? `rgba(255,255,255,${f})` : (isMega ? '#ff4400' : '#22aa55');
      const legCol   = f > 0 ? `rgba(220,180,180,${f})` : (isMega ? '#cc1100' : '#2d8a4e');
      const legCol2  = f > 0 ? `rgba(180,140,140,${f})` : (isMega ? '#7a0800' : '#1a5c33');

      // Riding glow ring
      if (isRiding) {
        ctx.beginPath();
        ctx.arc(0, 0, d.r + (isMega ? 14 : 8), 0, Math.PI * 2);
        ctx.strokeStyle = isMega ? 'rgba(255,80,30,0.5)' : 'rgba(80,255,140,0.35)';
        ctx.lineWidth = isMega ? 8 : 5;
        ctx.stroke();
      }

      // Mega aura pulse
      if (isMega) {
        const pulse = 0.12 + 0.08 * Math.sin(d.bobAngle * 2);
        const aura = ctx.createRadialGradient(0, 0, d.r * 0.6, 0, 0, d.r * 1.8);
        aura.addColorStop(0, `rgba(255,40,0,${pulse})`);
        aura.addColorStop(1, 'transparent');
        ctx.beginPath(); ctx.arc(0, 0, d.r * 1.8, 0, Math.PI * 2);
        ctx.fillStyle = aura; ctx.fill();
      }

      // Torso
      const bg = ctx.createRadialGradient(-d.r * 0.3, -d.r * 0.3, 2, 0, 0, d.r * 1.2);
      bg.addColorStop(0, bodyCol); bg.addColorStop(1, bodyCol2);
      ctx.beginPath();
      ctx.ellipse(0, 0, d.r * 0.75, d.r, 0, 0, Math.PI * 2);
      ctx.fillStyle = bg; ctx.fill();
      ctx.strokeStyle = isMega ? 'rgba(80,0,0,0.6)' : 'rgba(0,0,0,0.3)';
      ctx.lineWidth = isMega ? 3 : 1.5; ctx.stroke();

      // Tail
      ctx.beginPath();
      ctx.moveTo(-d.r * 0.6, d.r * 0.2);
      ctx.bezierCurveTo(-d.r * 1.3, d.r * 0.4, -d.r * 1.7, -d.r * 0.1, -d.r * 2.0, -d.r * 0.5);
      ctx.strokeStyle = bodyCol; ctx.lineWidth = d.r * (isMega ? 0.45 : 0.38); ctx.lineCap = 'round'; ctx.stroke();

      // Head
      ctx.beginPath();
      ctx.ellipse(d.r * 0.55, -d.r * 0.65, d.r * (isMega ? 0.62 : 0.5), d.r * (isMega ? 0.46 : 0.38), 0.3, 0, Math.PI * 2);
      ctx.fillStyle = headCol;
      ctx.fill(); ctx.strokeStyle = isMega ? 'rgba(60,0,0,0.4)' : 'rgba(0,0,0,0.25)'; ctx.lineWidth = isMega ? 2 : 1; ctx.stroke();

      // Snout
      ctx.beginPath();
      ctx.ellipse(d.r * (isMega ? 1.05 : 0.95), -d.r * 0.55, d.r * (isMega ? 0.36 : 0.28), d.r * 0.2, 0.15, 0, Math.PI * 2);
      ctx.fillStyle = bodyCol; ctx.fill();

      // Nostrils (mega gets two)
      if (isMega) {
        ctx.fillStyle = '#330000';
        ctx.beginPath(); ctx.arc(d.r * 1.2, -d.r * 0.62, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(d.r * 1.2, -d.r * 0.48, 3.5, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(d.r * 1.1, -d.r * 0.55, 2, 0, Math.PI * 2);
        ctx.fillStyle = '#111'; ctx.fill();
      }

      // Eyes — mega gets glowing red eyes
      const eyeR = d.r * (isMega ? 0.17 : 0.13);
      ctx.beginPath(); ctx.arc(d.r * 0.72, -d.r * 0.72, eyeR, 0, Math.PI * 2);
      ctx.fillStyle = isMega ? '#ff2200' : '#fff'; ctx.fill();
      if (isMega) {
        // Glowing slit pupil
        ctx.beginPath(); ctx.arc(d.r * 0.72, -d.r * 0.72, eyeR * 0.45, 0, Math.PI * 2);
        ctx.fillStyle = '#660000'; ctx.fill();
        // Eye glow
        const eyeGlow = ctx.createRadialGradient(d.r*0.72, -d.r*0.72, 0, d.r*0.72, -d.r*0.72, eyeR * 2.2);
        eyeGlow.addColorStop(0, 'rgba(255,60,0,0.55)');
        eyeGlow.addColorStop(1, 'transparent');
        ctx.beginPath(); ctx.arc(d.r * 0.72, -d.r * 0.72, eyeR * 2.2, 0, Math.PI * 2);
        ctx.fillStyle = eyeGlow; ctx.fill();
      } else {
        ctx.beginPath(); ctx.arc(d.r * 0.74, -d.r * 0.72, d.r * 0.08, 0, Math.PI * 2);
        ctx.fillStyle = '#111'; ctx.fill();
        ctx.beginPath(); ctx.arc(d.r * 0.71, -d.r * 0.75, d.r * 0.03, 0, Math.PI * 2);
        ctx.fillStyle = '#fff'; ctx.fill();
      }

      // Spikes — mega gets 6 larger jagged spikes
      const spikeCount = isMega ? 6 : 4;
      for (let s = 0; s < spikeCount; s++) {
        const sx = -d.r * 0.55 + s * d.r * (isMega ? 0.26 : 0.3);
        const sy = -d.r * (isMega ? 0.9 : 0.85);
        const sh = d.r * (isMega ? 0.45 : 0.28);
        ctx.beginPath();
        ctx.moveTo(sx - d.r * 0.12, sy + d.r * 0.15);
        ctx.lineTo(sx, sy - sh);
        ctx.lineTo(sx + d.r * 0.12, sy + d.r * 0.15);
        ctx.closePath();
        ctx.fillStyle = spikeCol; ctx.fill();
        if (isMega) {
          ctx.strokeStyle = '#440000'; ctx.lineWidth = 1.5; ctx.stroke();
        }
      }

      // Legs (walk cycle)
      const legSwing = Math.sin(d.walkAngle) * 0.35;
      ctx.save();
      ctx.translate(-d.r * 0.1, d.r * 0.55); ctx.rotate(-legSwing - 0.2);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(-d.r*0.25, d.r*0.55);
      ctx.strokeStyle = legCol; ctx.lineWidth = d.r * (isMega ? 0.32 : 0.25); ctx.stroke();
      ctx.beginPath(); ctx.arc(-d.r*0.25, d.r*0.55, d.r*0.16, 0, Math.PI*2);
      ctx.fillStyle = legCol2; ctx.fill();
      ctx.restore();

      ctx.save();
      ctx.translate(d.r * 0.25, d.r * 0.55); ctx.rotate(legSwing + 0.2);
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(d.r*0.25, d.r*0.55);
      ctx.strokeStyle = legCol; ctx.lineWidth = d.r * (isMega ? 0.32 : 0.25); ctx.stroke();
      ctx.beginPath(); ctx.arc(d.r*0.25, d.r*0.55, d.r*0.16, 0, Math.PI*2);
      ctx.fillStyle = legCol2; ctx.fill();
      ctx.restore();

      // HP bar — mega gets a wide red bar
      const barW = d.r * (isMega ? 3.2 : 2.4);
      const barH = isMega ? 14 : 7;
      const bx   = -barW / 2, by2 = -d.r - (isMega ? 24 : 14);
      ctx.fillStyle = isMega ? '#220000' : '#111';
      ctx.beginPath(); ctx.roundRect(bx, by2, barW, barH, barH/2); ctx.fill();
      const hpP = d.hp / d.maxHp;
      ctx.fillStyle = isMega
        ? (hpP > 0.5 ? '#cc0000' : hpP > 0.25 ? '#ff4400' : '#ff0000')
        : (hpP > 0.5 ? '#27ae60' : hpP > 0.25 ? '#e67e22' : '#e74c3c');
      ctx.beginPath(); ctx.roundRect(bx, by2, barW * hpP, barH, barH/2); ctx.fill();
      ctx.strokeStyle = isMega ? '#550000' : '#333'; ctx.lineWidth = isMega ? 2 : 1;
      ctx.beginPath(); ctx.roundRect(bx, by2, barW, barH, barH/2); ctx.stroke();

      // Label above bar
      ctx.font = `bold ${isMega ? 14 : 9}px monospace`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
      if (isMega) {
        ctx.fillStyle = isRiding ? '#ff6644' : '#ff2200';
        ctx.shadowColor = '#ff0000'; ctx.shadowBlur = 10;
        ctx.fillText(isRiding ? '🔴 RIDING BOSS DINO' : '🦖 BOSS DINO', 0, by2 - 2);
        ctx.shadowBlur = 0;
      } else if (isRiding) {
        ctx.fillStyle = '#4cff88';
        ctx.fillText('RIDING', 0, by2 - 2);
      }

      ctx.restore();
    }

    function drawDinosaurs() {
      for (const d of dinosaurs) drawDinosaur(d);
      if (megaDino) drawDinosaur(megaDino);
    }

    // --- Draw egg character ---
    function drawEgg(x, y, walkAngle, bobY, squash) {
      ctx.save();
      ctx.translate(x, y + bobY);

      // Squash/stretch transform
      ctx.scale(1 / squash, squash);

      // ---- Shadow ----
      ctx.save();
      ctx.scale(1, 0.25);
      const shadowGrad = ctx.createRadialGradient(0, egg.ry * squash + 6, 2, 0, egg.ry * squash + 6, 28);
      shadowGrad.addColorStop(0, 'rgba(255,255,255,0.08)');
      shadowGrad.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.ellipse(0, egg.ry * squash + 6, 28, 14, 0, 0, Math.PI * 2);
      ctx.fillStyle = shadowGrad;
      ctx.fill();
      ctx.restore();

      // ---- Body ----
      const bodyGrad = ctx.createRadialGradient(-6, -10, 4, 0, 0, egg.ry * 1.4);
      bodyGrad.addColorStop(0, '#fffde7');
      bodyGrad.addColorStop(0.5, '#fff9c4');
      bodyGrad.addColorStop(1, '#f9a825');

      ctx.beginPath();
      ctx.ellipse(0, 0, egg.rx, egg.ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = bodyGrad;

      ctx.arc(-eyeOffsetX + lookX - 1, eyeOffsetY + lookY, 1.1, 0, Math.PI * 2);

      // Teeth peeking through (one big slab, slightly tilted)
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-6, 8.5);
      ctx.bezierCurveTo(-3, 12, 2, 13, 7, 9.5);
      ctx.lineTo(7, 9.5);
      ctx.lineTo(-6, 8.5);

      // Tooth gap lines

      ctx.moveTo(-1, 8.8);
      ctx.lineTo(-0.5, 12);

      // ---- Hands / Stubby arms ----

      // Gun arm — only drawn when NOT using melee weapon

      const facingRight = egg.aimDX >= 0;

      const tiltAngle = Math.atan2(egg.aimDY, Math.abs(egg.aimDX) || 0.01);

      ctx.translate(facingRight ? egg.rx - 2 : -(egg.rx - 2), 2);

      if (wid === 'rpg') {

          ctx.fillStyle = '#cce';
          ctx.beginPath(); ctx.arc(40, 0, 3, 0, Math.PI*2); ctx.fill();

        } else {

      } else if (wid === 'bazooka') {
        const bazMaxed = equippedStars() >= 5;

          // ---- SHARK BAZOOKA (5★ legendary) ----
          const t = egg.bobAngle;
          // Wide jaw glow

          ctx.fillStyle = '#00998a';
          ctx.beginPath(); ctx.roundRect(-3, -8, 44, 8, 5); ctx.fill();
          // Wide jaw/muzzle — open shark mouth
          ctx.fillStyle = '#004444';
          ctx.beginPath(); ctx.ellipse(44, 0, 8, 12, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#aa2222';

          ctx.fillStyle = '#fff';
          for (let tk = 0; tk < 5; tk++) {
            // upper teeth
            ctx.beginPath();

          // Eye

          ctx.beginPath(); ctx.arc(31, -2, 2.2, 0, Math.PI*2); ctx.fillStyle='#000'; ctx.fill();

          // Back vent with teal glow

          ventGrd.addColorStop(1, `rgba(0,255,200,${0.5+0.35*Math.sin(t*3)})`);
          ctx.beginPath(); ctx.roundRect(-12, -5, 10, 10, 3); ctx.fillStyle = ventGrd; ctx.fill();
          // Label
          ctx.save();
          ctx.font = 'bold 7px monospace'; ctx.fillStyle = '#00ffcc';

        } else {
          // ---- Bazooka: normal fat tube ----
          ctx.fillStyle = '#8B4513';
          ctx.beginPath(); ctx.roundRect(-3, -7, 42, 14, 4); ctx.fill();
          ctx.fillStyle = '#a0522d';
          ctx.beginPath(); ctx.roundRect(-2, -6, 40, 6, 3); ctx.fill();
          ['#666','#777','#666'].forEach((c, i) => {
            ctx.fillStyle = c;
            ctx.beginPath(); ctx.roundRect(4 + i * 11, -7, 4, 14, 1); ctx.fill();
          });
          ctx.fillStyle = '#444';
          ctx.beginPath(); ctx.ellipse(40, 0, 5, 9, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#111';
          ctx.beginPath(); ctx.ellipse(40, 0, 3, 6, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#333';
          ctx.beginPath();
          ctx.moveTo(-3, -7); ctx.lineTo(-12, -4); ctx.lineTo(-12, 4); ctx.lineTo(-3, 7);
          ctx.closePath(); ctx.fill();

        }
      } else {
        const bombStars = inventory.slots[0].stars;
        const bombMaxed = bombStars >= 5;

        if (bombMaxed) {
          // ---- LEGENDARY 5★ Dino Cannon ----
          // Animated shimmer using egg.bobAngle as time source
          const t = egg.bobAngle;

          // Outer golden glow halo
          const halo = ctx.createRadialGradient(10, 0, 2, 10, 0, 28);
          halo.addColorStop(0, `rgba(255,220,50,${0.35 + 0.2 * Math.sin(t * 3)})`);
          halo.addColorStop(0.5, `rgba(255,140,0,${0.2 + 0.15 * Math.sin(t * 2 + 1)})`);
          halo.addColorStop(1, 'transparent');

          ctx.arc(10, 0, 28, 0, Math.PI * 2);

          ctx.beginPath();
          ctx.roundRect(-4, -8, 38, 16, 5);

          // Barrel shine streak
          ctx.fillStyle = 'rgba(255,255,200,0.45)';
          ctx.beginPath();
          ctx.roundRect(-2, -6, 34, 5, 3);

          [4, 14, 24].forEach(bx2 => {

            ringGrd.addColorStop(0, '#ffe566');
            ringGrd.addColorStop(0.5, '#ffd700');
            ringGrd.addColorStop(1, '#7a5800');
            ctx.fillStyle = ringGrd;
            ctx.beginPath();
            ctx.roundRect(bx2, -9, 5, 18, 2);
            ctx.fill();

          // Muzzle bell — large dark opening with gold rim
          ctx.fillStyle = '#1a1a1a';
          ctx.beginPath();
          ctx.ellipse(35, 0, 6, 10, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.ellipse(35, 0, 6, 10, 0, 0, Math.PI * 2);
          ctx.stroke();
          // Barrel bore glow
          const boreGrd = ctx.createRadialGradient(35, 0, 0, 35, 0, 5);
          boreGrd.addColorStop(0, `rgba(255,200,50,${0.6 + 0.4 * Math.sin(t * 4)})`);
          boreGrd.addColorStop(1, 'transparent');
          ctx.beginPath();
          ctx.arc(35, 0, 5, 0, Math.PI * 2);
          ctx.fillStyle = boreGrd; ctx.fill();

          // Grip — ornate dark gold
          const gripGrd = ctx.createLinearGradient(-2, 8, 8, 8);
          gripGrd.addColorStop(0, '#7a5800');
          gripGrd.addColorStop(0.5, '#b8860b');
          gripGrd.addColorStop(1, '#7a5800');
          ctx.fillStyle = gripGrd;
          ctx.beginPath();
          ctx.roundRect(-2, 8, 8, 13, 3);
          ctx.fill();
          ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(-2, 8, 8, 13, 3);

          // Gem on the side — pulsing
          const gemPulse = 0.75 + 0.25 * Math.sin(t * 5);

          for (let sp = 0; sp < 4; sp++) {

            ctx.arc(sx2, sy2, 1.5, 0, Math.PI * 2);

        } else {
          // ---- Bomb Gun (plain pistol, non-maxed) ----
          ctx.fillStyle = '#222';
          ctx.beginPath();
          ctx.roundRect(-2, 1, 6, 9, 2);

      // Muzzle flash (when firing)
      if (egg.muzzleFlash > 0) {

      const leftFoot  = Math.sin(walkAngle) * 5;

      ctx.save();
      ctx.translate(-10, egg.ry - 2);
      ctx.rotate(leftFoot * 0.08);

      ctx.strokeStyle = 'rgba(0,0,0,0.15)';

      ctx.restore();
