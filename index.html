    // =====================================================================
    // SWORD SWING
    // =====================================================================
    const sword  = { swinging: false, angle: 0, baseAngle: 0, timer: 0, facingRight: true };
    const sword2 = { swinging: false, angle: 0, baseAngle: 0, timer: 0, facingRight: true }; // mirror blade at 5★
    const SWORD_RANGE = 90;
    const SWORD_ARC   = Math.PI * 1.1;

    // Hit a single arc against all monsters; returns indices killed (for shared kill logic)
    function swordArcHit(baseAngle, range, maxed) {
      for (let j = monsters.length - 1; j >= 0; j--) {
        const m = monsters[j];
        const dx = m.x - egg.x, dy = m.y - egg.y;
        if (Math.sqrt(dx*dx + dy*dy) < range + m.r) {
          let diff = Math.atan2(dy, dx) - baseAngle;
          while (diff >  Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          if (Math.abs(diff) < SWORD_ARC / 2 + 0.2) {
            if (maxed) {
              if (m.golden) dropWeaponAt(m.x, m.y);
              spawnDeathParticles(m.x, m.y, m.color);
              spawnDeathParticles(m.x, m.y, '#44aaff');
              onKill(m);
              monsters.splice(j, 1);
            } else {
              m.hp--;
              if (m.hp <= 0) {
                if (m.golden) dropWeaponAt(m.x, m.y);
                spawnDeathParticles(m.x, m.y, m.color);
                onKill(m);
                monsters.splice(j, 1);
              } else {
                m.hitFlash = 1.0;
              }
            }
          }
        }
      }
    }

    function swordSwing() {
      if (sword.swinging) return;
      const facingRight = egg.aimDX >= 0;
      const tiltAngle   = Math.atan2(egg.aimDY, Math.abs(egg.aimDX) || 0.01);
      const baseAngle   = facingRight ? tiltAngle : Math.PI - tiltAngle;
      const maxed       = isMaxStar();
      const range       = maxed ? SWORD_RANGE * 2.5 : SWORD_RANGE;

      // Primary sword — remember which way we were facing
      sword.swinging    = true;
      sword.timer       = 0;
      sword.baseAngle   = baseAngle;
      sword.angle       = baseAngle - SWORD_ARC / 2;
      sword.facingRight = facingRight;
      swordArcHit(baseAngle, range, maxed);

      // 5★: launch mirror sword in the opposite arc simultaneously
      if (maxed) {
        const mirrorBase    = baseAngle + Math.PI; // 180° opposite
        sword2.swinging     = true;
        sword2.timer        = 0;
        sword2.baseAngle    = mirrorBase;
        sword2.angle        = mirrorBase - SWORD_ARC / 2;
        sword2.facingRight  = facingRight;
        swordArcHit(mirrorBase, range, maxed);
      }
    }

    function updateSword(dt) {
      if (sword.swinging) {
        sword.timer += dt * 0.1;
        sword.angle  = sword.baseAngle - SWORD_ARC / 2 + SWORD_ARC * Math.min(sword.timer, 1);
        if (sword.timer >= 1) sword.swinging = false;
      }
      if (sword2.swinging) {
        sword2.timer += dt * 0.1;
        sword2.angle  = sword2.baseAngle - SWORD_ARC / 2 + SWORD_ARC * Math.min(sword2.timer, 1);
        if (sword2.timer >= 1) sword2.swinging = false;
      }
    }

    // Draw one sword blade — electric blue at 5★, gold otherwise
    function drawOneSword(sw, maxed, isSecond) {
      const r = maxed ? SWORD_RANGE * 2.5 : SWORD_RANGE;
      const bladeCol   = maxed ? '#44bbff' : '#c8c8ff';
      const guardCol   = maxed ? '#0066ff' : '#ffd700';
      const armCol     = maxed ? '#2288ff' : '#f9a825';
      const arcFill    = maxed ? 'rgba(40,140,255,0.11)' : 'rgba(255,215,0,0.09)';

      if (sw.swinging) {
        const startA = sw.baseAngle - SWORD_ARC / 2;
        // The pivot side depends on which way the egg was facing when the swing started
        const fr = sw.facingRight;
        const pivotX = fr ? egg.rx - 4 : -(egg.rx - 4);

        // Arc sweep fill
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, r, startA, sw.angle);
        ctx.closePath();
        ctx.fillStyle = arcFill; ctx.fill();

        // Electric arc trail along the sweep edge (5★ only)
        if (maxed) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(0, 0, r, startA, sw.angle);
          ctx.strokeStyle = `rgba(100,200,255,0.55)`;
          ctx.lineWidth = 6;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.7, startA, sw.angle);
          ctx.strokeStyle = `rgba(180,230,255,0.18)`;
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.restore();
        }

        // Blade at current sweep angle — pivot from correct side
        ctx.save(); ctx.rotate(sw.angle);
        const dir = fr ? 1 : -1;
        const px  = egg.rx * dir;
        // Arm from body edge outward
        ctx.beginPath(); ctx.moveTo(px - dir * 4, 2); ctx.lineTo(px + dir * 10, 2);
        ctx.strokeStyle = armCol; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.stroke();
        // Blade tip
        const bladeStart = px + dir * 10;
        const bladeEnd   = px + dir * (maxed ? 72 : 55);
        ctx.beginPath(); ctx.moveTo(bladeStart, 0); ctx.lineTo(bladeEnd, -4);
        ctx.strokeStyle = bladeCol; ctx.lineWidth = maxed ? 5 : 4;
        if (maxed) { ctx.shadowColor = '#44aaff'; ctx.shadowBlur = 14; }
        ctx.stroke(); ctx.shadowBlur = 0;
        // Guard
        const guardX = px + dir * 12;
        ctx.beginPath(); ctx.moveTo(guardX, -10); ctx.lineTo(guardX, 11);
        ctx.strokeStyle = guardCol; ctx.lineWidth = maxed ? 6 : 5; ctx.stroke();
        // Blade shine
        ctx.beginPath(); ctx.moveTo(px + dir * 15, -2); ctx.lineTo(px + dir * (maxed ? 65 : 48), -3);
        ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 1.5; ctx.stroke();
        // 5★: lightning crackle on blade
        if (maxed) {
          ctx.strokeStyle = 'rgba(180,240,255,0.85)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          const bstart = px + dir * 14;
          for (let seg = 0; seg < 5; seg++) {
            const lx = bstart + dir * seg * 11;
            seg === 0 ? ctx.moveTo(lx, 0) : ctx.lineTo(lx, 0);
            ctx.lineTo(lx + dir * 4, (Math.random() - 0.5) * 10);
            ctx.lineTo(lx + dir * 8, (Math.random() - 0.5) * 6);
          }
          ctx.stroke();
        }
        ctx.restore();
      } else {
        // Idle pose — sword held on the correct side
        const facingRight = egg.aimDX >= 0;
        const tiltAngle   = Math.atan2(egg.aimDY, Math.abs(egg.aimDX) || 0.01);
        ctx.save();
        if (isSecond) {
          // Second sword: held behind, pointing backward
          ctx.translate(facingRight ? -(egg.rx - 2) : (egg.rx - 2), 2);
          ctx.scale(facingRight ? -1 : 1, 1);
        } else {
          // Primary: on the arm side matching facing direction
          ctx.translate(facingRight ? egg.rx - 2 : -(egg.rx - 2), 2);
          if (!facingRight) ctx.scale(-1, 1);
        }
        ctx.rotate(tiltAngle);
        // Arm
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(12,0);
        ctx.strokeStyle = armCol; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.stroke();
        // Blade
        ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(maxed ? 66 : 50, -3);
        ctx.strokeStyle = bladeCol; ctx.lineWidth = maxed ? 5 : 3.5;
        if (maxed) { ctx.shadowColor = '#44aaff'; ctx.shadowBlur = 12; }
        ctx.stroke(); ctx.shadowBlur = 0;
        // Guard
        ctx.beginPath(); ctx.moveTo(14, -9); ctx.lineTo(14, 10);
        ctx.strokeStyle = guardCol; ctx.lineWidth = maxed ? 6 : 4; ctx.stroke();
        // 5★ legendary label on idle blade
        if (maxed) {
          ctx.save();
          ctx.font = 'bold 8px monospace';
          ctx.fillStyle = '#44aaff';
          ctx.shadowColor = '#44aaff'; ctx.shadowBlur = 8;
          ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText('LEGENDARY', 30, -8);
          ctx.shadowBlur = 0;
          ctx.restore();
        }
        ctx.restore();
      }
    }

    function drawSwordArm() {
      const maxed = isMaxStar();
      ctx.save();
      ctx.translate(egg.x, egg.y);
      drawOneSword(sword, maxed, false);
      if (maxed) drawOneSword(sword2, maxed, true);
      ctx.restore();
    }

    // =====================================================================
    // WEAPON DROPS (from golden zombies)
    // =====================================================================
    const drops = []; // { x, y, weaponId, bobAngle, life }

    function dropWeaponAt(x, y) {
      const id = LOOT_POOL[Math.floor(Math.random() * LOOT_POOL.length)];
      drops.push({ x, y, weaponId: id, bobAngle: 0, life: 1.0 });
    }

    function updateDrops(dt) {
      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.bobAngle += 0.05 * dt;
        d.life -= 0.002 * dt; // fade very slowly
        // Pickup if player walks over it
        const dx = egg.x - d.x, dy = egg.y - d.y;
        if (Math.sqrt(dx*dx + dy*dy) < egg.rx + 18) {
          grantWeapon(d.weaponId);
          drops.splice(i, 1);
        }
      }
    }

    function drawDrops() {
      for (const d of drops) {
        const bobY = Math.sin(d.bobAngle) * 5;
        const w = WEAPONS[d.weaponId];
        ctx.save();
        ctx.translate(d.x, d.y + bobY);
        // Glow
        const grd = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
        const gc = w.rarity === 'legend' ? '255,215,0' : w.rarity === 'epic' ? '180,80,255' : '80,150,255';
        grd.addColorStop(0, `rgba(${gc},0.35)`);
        grd.addColorStop(1, 'transparent');
        ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fillStyle = grd; ctx.fill();
        // Icon
        ctx.font = '20px serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(w.icon, 0, 0);
        // Label
        ctx.font = '8px monospace';
        ctx.fillStyle = '#ffd700';
        ctx.fillText(w.name, 0, 16);
        ctx.restore();
      }
    }

    // =====================================================================
    // BULLETS
    // =====================================================================
    const bullets = [];

    function shootBullet() {
      const w = equippedWeapon();
      if (!w) return;
      if (w.type === 'melee') { swordSwing(); return; }

      const facingRight = egg.aimDX >= 0;
      const tiltAngle   = Math.atan2(egg.aimDY, Math.abs(egg.aimDX) || 0.01);
      const fireAngle   = facingRight ? tiltAngle : Math.PI - tiltAngle;
      const armPivotX   = egg.x + (facingRight ? egg.rx - 2 : -(egg.rx - 2));
      const armPivotY   = egg.y + 2;
      const bx = armPivotX + Math.cos(fireAngle) * 32;
      const by = armPivotY + Math.sin(fireAngle) * 32;
      const speed  = w.id === 'rpg' ? 18 : w.id === 'bazooka' ? 10 : 14;
      const radius = w.id === 'rpg' ? 150 : w.id === 'bazooka' ? 210 : 110;
      bullets.push({ x: bx, y: by,
        vx: Math.cos(fireAngle) * speed,
        vy: Math.sin(fireAngle) * speed,
        life: 1.0, dist: 0, bomb: true,
        weaponId: w.id, blastRadius: radius,
      });
      egg.muzzleFlash = 1.0;
      egg.recoil = 1.0;
    }

    const BOMB_RADIUS = 110; // fallback

    function explodeBomb(bx, by, radius) {
      const r = radius || BOMB_RADIUS;
      // 5-star bomb_gun: blast radius doubles AND spawns a dinosaur ally
      const maxed    = isMaxStar();
      const isBombGun = (inventory.slots[inventory.equipped] && inventory.slots[inventory.equipped].weapon.id === 'bomb_gun');
      const effectR  = maxed ? r * 2 : r;
      let killedAny = false;
      for (let j = monsters.length - 1; j >= 0; j--) {
        const m = monsters[j];
        const dx = bx - m.x, dy = by - m.y;
        if (Math.sqrt(dx*dx + dy*dy) < effectR + m.r) {
          if (maxed) {
            // Insta-kill
            if (m.golden) dropWeaponAt(m.x, m.y);
            spawnDeathParticles(m.x, m.y, m.color);
            spawnDeathParticles(m.x, m.y, '#ffd700');
            onKill(m);
            monsters.splice(j, 1);
            killedAny = true;
          } else {
            m.hp--;
            if (m.hp <= 0) {
              if (m.golden) dropWeaponAt(m.x, m.y);
              spawnDeathParticles(m.x, m.y, m.color);
              onKill(m);
              monsters.splice(j, 1);
              killedAny = true;
            } else {
              m.hitFlash = 1.0;
            }
          }
        }
      }
      // 5-star bomb_gun: ALWAYS spawn a dino at the blast site
      if (maxed && isBombGun) {
        spawnDino(bx, by);
      }
      // Big explosion particle burst
      for (let i = 0; i < 28; i++) {
        const a = (i / 28) * Math.PI * 2;
        const spd = 3 + Math.random() * 7;
        deathParticles.push({
          x: bx, y: by,
          vx: Math.cos(a) * spd,
          vy: Math.sin(a) * spd,
          life: 1.0,
          r: 5 + Math.random() * 8,
          color: ['#ff6600','#ffcc00','#ff3300'][Math.floor(Math.random()*3)],
        });
      }
      // Shockwave ring stored separately
      shockwaves.push({ x: bx, y: by, r: 10, life: 1.0 });
    }

    // Shockwave rings
    const shockwaves = [];
    function updateShockwaves(dt) {
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.r += 6 * dt;
        s.life -= 0.06 * dt;
        if (s.life <= 0) shockwaves.splice(i, 1);
      }
    }
    function drawShockwaves() {
      for (const s of shockwaves) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,200,50,${s.life * 0.7})`;
        ctx.lineWidth = 3 * s.life;
        ctx.stroke();
        // Second ring slightly smaller
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 0.65, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,100,0,${s.life * 0.4})`;
        ctx.lineWidth = 2 * s.life;
        ctx.stroke();
      }
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        const step = Math.sqrt(b.vx * b.vx + b.vy * b.vy) * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.dist += step;
        b.life -= 0.018 * dt;
        if (b.life <= 0 || b.x < -20 || b.x > canvas.width + 20 || b.y < -20 || b.y > canvas.height + 20) {
          if (b.bomb) explodeBomb(b.x, b.y, b.blastRadius);
          bullets.splice(i, 1);
          continue;
        }
        // Hit monsters
        let hit = false;
        for (let j = monsters.length - 1; j >= 0; j--) {
          const m = monsters[j];
          const dx = b.x - m.x, dy = b.y - m.y;
          if (Math.sqrt(dx*dx + dy*dy) < m.r + (b.bomb ? 14 : 8)) {
            if (b.bomb) {
              explodeBomb(b.x, b.y, b.blastRadius);
            } else {
              spawnDeathParticles(m.x, m.y, m.color);
              monsters.splice(j, 1);
            }
            bullets.splice(i, 1);
            hit = true;
            break;
          }
        }
      }
    }

    function drawBullets() {
      for (const b of bullets) {
        const growScale = Math.min(1, b.dist / 600);

        if (b.weaponId === 'rpg' || b.weaponId === 'bazooka') {
          // ---- Rocket projectile ----
          const isRpg = b.weaponId === 'rpg';
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(Math.atan2(b.vy, b.vx));

          // Fire exhaust trail
          const trailLen = isRpg ? 30 + growScale * 20 : 40 + growScale * 30;
          const trailGrd = ctx.createLinearGradient(-trailLen, 0, 0, 0);
          trailGrd.addColorStop(0, 'transparent');
          trailGrd.addColorStop(0.5, `rgba(255,100,0,${b.life * 0.5})`);
          trailGrd.addColorStop(1, `rgba(255,220,50,${b.life * 0.9})`);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          // Wavy trail
          for (let t = 0; t <= 1; t += 0.1) {
            const tx = -trailLen * t;
            const ty = Math.sin(t * Math.PI * 3 + b.dist * 0.3) * (isRpg ? 3 : 5) * t;
            t === 0 ? ctx.moveTo(tx, ty) : ctx.lineTo(tx, ty);
          }
          ctx.lineWidth = isRpg ? 6 : 9;
          ctx.strokeStyle = trailGrd;
          ctx.lineCap = 'round';
          ctx.stroke();

          // Rocket body
          const bodyLen = isRpg ? 22 : 30;
          const bodyH   = isRpg ? 5  : 8;
          ctx.fillStyle = isRpg ? '#555' : '#8B4513';
          ctx.beginPath();
          ctx.roundRect(-bodyLen * 0.6, -bodyH / 2, bodyLen, bodyH, bodyH * 0.3);
          ctx.fill();
          ctx.fillStyle = isRpg ? '#777' : '#a0522d';
          ctx.beginPath();
          ctx.roundRect(-bodyLen * 0.6, -bodyH / 2, bodyLen * 0.7, bodyH * 0.5, 2);
          ctx.fill();

          // Nose cone
          ctx.fillStyle = isRpg ? '#cc3300' : '#cc6600';
          ctx.beginPath();
          const noseX = bodyLen * 0.4;
          ctx.moveTo(noseX, 0);
          ctx.lineTo(noseX - bodyLen * 0.3, -bodyH / 2);
          ctx.lineTo(noseX - bodyLen * 0.3,  bodyH / 2);
          ctx.closePath();
          ctx.fill();

          // Fins (back)
          ctx.fillStyle = isRpg ? '#333' : '#5a2d0c';
          const finX = -bodyLen * 0.55;
          [[-bodyH, -bodyH * 1.6], [bodyH * 0.1, bodyH * 1.6]].forEach(([y1, y2]) => {
            ctx.beginPath();
            ctx.moveTo(finX, y1);
            ctx.lineTo(finX - bodyLen * 0.25, y2);
            ctx.lineTo(finX + bodyLen * 0.15, y1);
            ctx.closePath();
            ctx.fill();
          });

          // Blast radius ring (faint dashed)
          ctx.beginPath();
          ctx.arc(0, 0, b.blastRadius, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,100,0,0.07)`;
          ctx.lineWidth = 1;
          ctx.setLineDash([5, 8]);
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.restore();

        } else if (b.bomb) {
          // ---- Bomb Gun: round dark casing ----
          const r = 6 + growScale * 8;
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fillStyle = '#222'; ctx.fill();
          ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.beginPath();
          ctx.arc(-r * 0.3, -r * 0.3, r * 0.25, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();
          ctx.beginPath();
          ctx.arc(r * 0.5, -r * 0.7, 2 + Math.random() * 2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,${150 + Math.random()*100|0},0,${b.life})`; ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 0, b.blastRadius || BOMB_RADIUS, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,100,0,0.1)`; ctx.lineWidth = 1;
          ctx.setLineDash([4, 6]); ctx.stroke(); ctx.setLineDash([]);
          ctx.restore();
        } else {
          // Normal bullet — glowing, grows
          const headR = 3 + growScale * 9;
          const tailLen = 10 + growScale * 30;
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(Math.atan2(b.vy, b.vx));
          const grad = ctx.createLinearGradient(-tailLen, 0, headR, 0);
          grad.addColorStop(0, 'transparent');
          grad.addColorStop(1, `rgba(255,220,60,${b.life})`);
          ctx.beginPath();
          ctx.roundRect(-tailLen, -headR * 0.5, tailLen + headR, headR, headR * 0.4);
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 0, headR, 0, Math.PI * 2);
          const hgrad = ctx.createRadialGradient(0, 0, 0, 0, 0, headR);
          hgrad.addColorStop(0, `rgba(255,255,180,${b.life})`);
          hgrad.addColorStop(1, `rgba(255,180,0,${b.life * 0.6})`);
          ctx.fillStyle = hgrad;
          ctx.fill();
          ctx.restore();
        }
      }
    }

    // --- Monsters ---
    const monsters = [];
    let monsterSpawnTimer = 0;
    const SPAWN_INTERVAL = 120; // base; overridden by SPAWN_INTERVAL_CURRENT

    // Wave tier → zombie shape: 1=blob, 2=skull, 3=spider, 4=phantom, 5=demon, 6+=abomination
    function waveShape() {
      const t = Math.min(wave.number, 6);
      return ['blob','blob','skull','spider','phantom','demon','abomination'][t];
    }

    function spawnMonster() {
      if (wave.phase !== 'fighting') return;
      const y = 60 + Math.random() * (canvas.height - 120);
      const isGolden = Math.random() < 0.25;
      // Colors get darker/sicker each wave tier
      const tierCols = [
        ['#6a0dad','#c0392b','#1a7a1a','#1a4a8a'],   // w1 blob
        ['#555','#777','#333','#444'],                 // w2 skull
        ['#1a1a00','#2a1a00','#1a2200','#001a1a'],     // w3 spider
        ['#330033','#001133','#330011','#003333'],      // w4 phantom
        ['#660000','#440022','#220044','#002200'],      // w5 demon
        ['#000','#111','#0a000a','#000a00'],            // w6+ abomination
      ];
      const tier = Math.min(wave.number - 1, 5);
      const pallete = tierCols[tier];
      const color = isGolden ? '#d4a017' : pallete[Math.floor(Math.random() * pallete.length)];
      const baseHp = isGolden ? 2 : 1;
      const shape = waveShape();
      monsters.push({
        x: -30, y,
        r: isGolden ? 22 + Math.random() * 6 : 18 + Math.random() * 10,
        speed: (isGolden ? 0.9 + Math.random() * 0.8 : 1.2 + Math.random() * 1.4) * monsterSpeedMult,
        color, bobAngle: Math.random() * Math.PI * 2,
        hp: baseHp * monsterHpMult, maxHp: baseHp * monsterHpMult,
        golden: isGolden, boss: false, hitFlash: 0, shape,
      });
    }

    function spawnBoss() {
      wave.bossAlive = true;
      const y = canvas.height / 2;
      // Boss colour escalates each wave — blood red → void black → toxic green → cosmic purple
      const bossHues = ['#8B0000','#4B0082','#006400','#00008B','#4a0000','#1a001a','#000','#220011'];
      const color = bossHues[(wave.number - 1) % bossHues.length];
      const hp = (5 + wave.number * 5) * monsterHpMult;
      const shape = waveShape();
      monsters.push({
        x: -60, y,
        r: Math.min(45 + wave.number * 6, 120),
        speed: (0.6 + wave.number * 0.12) * monsterSpeedMult,
        color, bobAngle: 0,
        hp, maxHp: hp,
        golden: false, boss: true, hitFlash: 0, shape,
      });
    }

    function updateMonsters(dt) {
      monsterSpawnTimer += dt;
      if (monsterSpawnTimer >= SPAWN_INTERVAL_CURRENT) {
        monsterSpawnTimer = 0;
        spawnMonster();
      }

      for (const m of monsters) {
        const dx = egg.x - m.x, dy = egg.y - m.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        m.x += (dx / dist) * m.speed * dt;
        m.y += (dy / dist) * m.speed * dt;
        m.bobAngle += 0.08 * dt;
        if (m.hitFlash > 0) m.hitFlash = Math.max(0, m.hitFlash - 0.08 * dt);
      }
    }

    function drawMonster(m) {
      const bob = Math.sin(m.bobAngle) * 2;
      ctx.save();
      ctx.translate(m.x, m.y + bob);

      const shape = m.shape || 'blob';
      const f = m.hitFlash;
      const c1 = f > 0 ? `rgba(255,255,255,${f})` : lighten(m.color);
      const c2 = f > 0 ? `rgba(220,220,220,${f})` : m.color;
      const lw =  Math.sin(m.bobAngle * 2.5) * 0.7;
      const rw = -Math.sin(m.bobAngle * 2.5 + 1) * 0.7;

      // ---- Arms (all shapes share waving arms) ----
      ctx.lineCap = 'round';
      const armCount = shape === 'spider' ? 6 : 2;
      for (let a = 0; a < armCount; a++) {
        const side = a % 2 === 0 ? -1 : 1;
        const wave2 = side > 0 ? rw + 0.5 : lw - 0.5;
        const extraAngle = armCount > 2 ? (a - armCount/2 + 0.5) * 0.5 : 0;
        ctx.save();
        ctx.translate(side * m.r * 0.85, -m.r * 0.1);
        ctx.rotate(wave2 + extraAngle);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(side * m.r * 0.7, -m.r * 0.5);
        ctx.strokeStyle = m.color; ctx.lineWidth = m.r * (shape==='spider'?0.18:0.35); ctx.stroke();
        ctx.beginPath(); ctx.arc(side * m.r * 0.7, -m.r * 0.5, m.r * (shape==='spider'?0.12:0.22), 0, Math.PI*2);
        ctx.fillStyle = lighten(m.color); ctx.fill();
        ctx.restore();
      }

      // ---- Body by shape ----
      if (shape === 'skull') {
        // Rounded skull shape
        const grad = ctx.createRadialGradient(-m.r*0.2,-m.r*0.2,2,0,0,m.r*1.2);
        grad.addColorStop(0,'#e0e0e0'); grad.addColorStop(1,'#888');
        ctx.beginPath(); ctx.arc(0,-m.r*0.05,m.r,0,Math.PI*2);
        ctx.fillStyle = f>0?c1:grad; ctx.fill();
        ctx.strokeStyle='#333'; ctx.lineWidth=1.5; ctx.stroke();
        // Jaw
        ctx.beginPath(); ctx.moveTo(-m.r*0.55,m.r*0.2); ctx.lineTo(-m.r*0.55,m.r*0.7);
        ctx.lineTo(m.r*0.55,m.r*0.7); ctx.lineTo(m.r*0.55,m.r*0.2);
        ctx.fillStyle=f>0?c2:'#aaa'; ctx.fill(); ctx.strokeStyle='#333'; ctx.lineWidth=1.5; ctx.stroke();
        // Hollow eye sockets
        ctx.fillStyle=f>0?`rgba(0,0,0,${f})`:'#111';
        ctx.beginPath(); ctx.ellipse(-m.r*0.28,-m.r*0.15,m.r*0.18,m.r*0.22,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse( m.r*0.28,-m.r*0.15,m.r*0.18,m.r*0.22,0,0,Math.PI*2); ctx.fill();
        // Red glow in sockets
        ctx.fillStyle=`rgba(255,0,0,${0.5+0.3*Math.sin(m.bobAngle*3)})`;
        ctx.beginPath(); ctx.ellipse(-m.r*0.28,-m.r*0.15,m.r*0.08,m.r*0.10,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse( m.r*0.28,-m.r*0.15,m.r*0.08,m.r*0.10,0,0,Math.PI*2); ctx.fill();
        // Teeth
        ctx.fillStyle='#fff';
        for(let t=0;t<5;t++){
          ctx.beginPath(); ctx.rect(-m.r*0.4+t*m.r*0.2, m.r*0.28, m.r*0.14, m.r*0.2); ctx.fill();
          ctx.strokeStyle='#555'; ctx.lineWidth=0.8; ctx.stroke();
        }

      } else if (shape === 'spider') {
        // Low wide body
        const grad = ctx.createRadialGradient(0,0,2,0,0,m.r);
        grad.addColorStop(0,'#222'); grad.addColorStop(1,'#000');
        ctx.beginPath(); ctx.ellipse(0,0,m.r*1.3,m.r*0.7,0,0,Math.PI*2);
        ctx.fillStyle=f>0?c1:grad; ctx.fill(); ctx.strokeStyle='#111'; ctx.lineWidth=1.5; ctx.stroke();
        // Eyes — 8 red dots
        const eyePos=[[-0.4,-0.3],[-0.15,-0.45],[0.15,-0.45],[0.4,-0.3],[-0.35,0.0],[0.35,0.0],[-0.2,0.2],[0.2,0.2]];
        eyePos.forEach(([ex,ey])=>{
          ctx.beginPath(); ctx.arc(ex*m.r,ey*m.r,m.r*0.09,0,Math.PI*2);
          ctx.fillStyle=`rgba(255,0,0,${0.7+0.3*Math.sin(m.bobAngle*4)})`; ctx.fill();
        });
        // Fangs
        ctx.fillStyle='#ddd';
        ctx.beginPath(); ctx.moveTo(-m.r*0.12,m.r*0.3); ctx.lineTo(-m.r*0.22,m.r*0.6); ctx.lineTo(0,m.r*0.3); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(m.r*0.12,m.r*0.3); ctx.lineTo(m.r*0.22,m.r*0.6); ctx.lineTo(0,m.r*0.3); ctx.closePath(); ctx.fill();

      } else if (shape === 'phantom') {
        // Wispy cloak
        const grad = ctx.createRadialGradient(0,-m.r*0.1,2,0,0,m.r*1.4);
        grad.addColorStop(0,f>0?'rgba(255,255,255,0.9)':'rgba(120,0,180,0.9)');
        grad.addColorStop(0.7,f>0?`rgba(255,255,255,${f*0.5})`:'rgba(60,0,100,0.5)');
        grad.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.arc(0,0,m.r*1.4,0,Math.PI*2);
        ctx.fillStyle=grad; ctx.fill();
        // Torn bottom edge
        ctx.beginPath(); ctx.moveTo(-m.r,m.r*0.3);
        for(let i=0;i<=8;i++){
          const wx=-m.r+i*m.r*0.25;
          const wy=m.r*0.4+Math.sin(m.bobAngle*2+i)*m.r*0.35*(i%2===0?1:-0.6);
          ctx.lineTo(wx,wy);
        }
        ctx.lineTo(m.r,m.r*0.3); ctx.closePath();
        ctx.fillStyle=f>0?'rgba(255,255,255,0.3)':'rgba(40,0,70,0.6)'; ctx.fill();
        // Glowing white eyes
        ctx.fillStyle=`rgba(255,255,255,${0.8+0.2*Math.sin(m.bobAngle*3)})`;
        ctx.beginPath(); ctx.ellipse(-m.r*0.28,-m.r*0.12,m.r*0.13,m.r*0.18,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse( m.r*0.28,-m.r*0.12,m.r*0.13,m.r*0.18,0,0,Math.PI*2); ctx.fill();

      } else if (shape === 'demon') {
        // Angular horned body
        const grad = ctx.createRadialGradient(-m.r*0.3,-m.r*0.3,2,0,0,m.r*1.2);
        grad.addColorStop(0,f>0?'#fff':'#880000'); grad.addColorStop(1,f>0?'#ccc':'#330000');
        ctx.beginPath(); ctx.arc(0,0,m.r,0,Math.PI*2);
        ctx.fillStyle=grad; ctx.fill(); ctx.strokeStyle='#220000'; ctx.lineWidth=2; ctx.stroke();
        // Horns
        ctx.fillStyle=f>0?'#fff':'#cc2200';
        ctx.beginPath(); ctx.moveTo(-m.r*0.3,-m.r); ctx.lineTo(-m.r*0.55,-m.r*1.8); ctx.lineTo(-m.r*0.05,-m.r); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo( m.r*0.3,-m.r); ctx.lineTo( m.r*0.55,-m.r*1.8); ctx.lineTo( m.r*0.05,-m.r); ctx.closePath(); ctx.fill();
        // Eyes — vertical slits
        ctx.fillStyle=f>0?'#fff':'#ff4400';
        ctx.beginPath(); ctx.ellipse(-m.r*0.28,-m.r*0.12,m.r*0.1,m.r*0.2,-0.2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse( m.r*0.28,-m.r*0.12,m.r*0.1,m.r*0.2, 0.2,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#000';
        ctx.beginPath(); ctx.ellipse(-m.r*0.28,-m.r*0.12,m.r*0.03,m.r*0.15,-0.2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse( m.r*0.28,-m.r*0.12,m.r*0.03,m.r*0.15, 0.2,0,Math.PI*2); ctx.fill();
        // Fanged grin
        ctx.beginPath(); ctx.arc(0,m.r*0.2,m.r*0.35,0.1,Math.PI-0.1); ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#eee';
        [-0.25,-0.08,0.08,0.25].forEach(tx=>{
          ctx.beginPath(); ctx.moveTo(tx*m.r,m.r*0.22); ctx.lineTo(tx*m.r,m.r*0.46); ctx.lineTo((tx+0.09)*m.r,m.r*0.22); ctx.closePath(); ctx.fill();
        });

      } else if (shape === 'abomination') {
        // Asymmetric mutant blob with tentacle stumps
        const grad = ctx.createRadialGradient(-m.r*0.2,-m.r*0.2,2,0,0,m.r*1.3);
        grad.addColorStop(0,f>0?'#fff':'#001a00'); grad.addColorStop(0.5,f>0?'#ccc':'#002200'); grad.addColorStop(1,'#000');
        // Pulsing irregular body
        ctx.beginPath();
        for(let ang=0;ang<Math.PI*2;ang+=Math.PI/8){
          const rr=m.r*(0.8+0.35*Math.sin(ang*3+m.bobAngle*2));
          ang===0?ctx.moveTo(Math.cos(ang)*rr,Math.sin(ang)*rr):ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr);
        }
        ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
        ctx.strokeStyle=f>0?'rgba(200,255,200,0.5)':'rgba(0,80,0,0.5)'; ctx.lineWidth=2; ctx.stroke();
        // Many glowing eyes (5 random-ish positions)
        [[-.35,-.25],[.35,-.2],[0,-.45],[-.2,.1],[.25,.15]].forEach(([ex,ey],i)=>{
          ctx.beginPath(); ctx.arc(ex*m.r,ey*m.r,m.r*0.13,0,Math.PI*2);
          ctx.fillStyle=f>0?'#fff':`rgba(0,255,0,${0.6+0.4*Math.sin(m.bobAngle*4+i)})`; ctx.fill();
          ctx.beginPath(); ctx.arc(ex*m.r,ey*m.r,m.r*0.06,0,Math.PI*2);
          ctx.fillStyle='#000'; ctx.fill();
        });
        // Dripping slime
        ctx.fillStyle=f>0?'rgba(200,255,200,0.3)':'rgba(0,200,0,0.35)';
        [-.3,0,.3].forEach(dx=>{
          const drip=m.r*0.2+Math.sin(m.bobAngle+dx*10)*m.r*0.15;
          ctx.beginPath(); ctx.ellipse(dx*m.r,m.r*0.7+drip,m.r*0.07,m.r*0.2,0,0,Math.PI*2); ctx.fill();
        });

      } else {
        // Default blob (wave 1)
        const grad = ctx.createRadialGradient(-m.r*0.3,-m.r*0.3,2,0,0,m.r*1.3);
        grad.addColorStop(0,c1); grad.addColorStop(1,c2);
        ctx.beginPath(); ctx.arc(0,0,m.r,0,Math.PI*2);
        ctx.fillStyle=grad; ctx.fill();
        ctx.strokeStyle=m.golden?'rgba(180,130,0,0.7)':'rgba(0,0,0,0.4)';
        ctx.lineWidth=m.golden?2.5:1.5; ctx.stroke();
        // Eyes
        ctx.fillStyle='#ff2222';
        ctx.beginPath(); ctx.arc(-m.r*0.28,-m.r*0.15,m.r*0.15,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc( m.r*0.28,-m.r*0.15,m.r*0.15,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(255,255,100,0.7)';
        ctx.beginPath(); ctx.arc(-m.r*0.28,-m.r*0.15,m.r*0.06,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc( m.r*0.28,-m.r*0.15,m.r*0.06,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.moveTo(-m.r*0.4,m.r*0.2); ctx.lineTo(-m.r*0.2,m.r*0.38);
        ctx.lineTo(0,m.r*0.22); ctx.lineTo(m.r*0.2,m.r*0.38); ctx.lineTo(m.r*0.4,m.r*0.2);
        ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=1.5; ctx.lineJoin='round'; ctx.stroke();
      }

      // Golden crown (all shapes)
      if (m.golden) {
        ctx.save();
        ctx.fillStyle='#ffd700'; ctx.strokeStyle='#b8860b'; ctx.lineWidth=1;
        const cy=-m.r-2, cw=m.r*0.9;
        ctx.beginPath(); ctx.roundRect(-cw,cy-4,cw*2,5,2); ctx.fill(); ctx.stroke();
        [-cw*0.7,0,cw*0.7].forEach((px,i)=>{
          const h=i===1?10:7;
          ctx.beginPath(); ctx.moveTo(px-cw*0.25,cy-3); ctx.lineTo(px,cy-3-h); ctx.lineTo(px+cw*0.25,cy-3);
          ctx.fillStyle='#ffd700'; ctx.fill(); ctx.strokeStyle='#b8860b'; ctx.stroke();
        });
        ctx.beginPath(); ctx.arc(0,cy-11,2.5,0,Math.PI*2); ctx.fillStyle='#ff4444'; ctx.fill();
        ctx.restore();
      }

      // Boss HP bar (all shapes)
      if (m.boss) {
        const barW=m.r*2.5, barH=10, bx=-barW/2, by=-m.r-26;
        ctx.fillStyle='#330000'; ctx.beginPath(); ctx.roundRect(bx,by,barW,barH,4); ctx.fill();
        const pct=m.hp/m.maxHp;
        ctx.fillStyle=pct>0.5?'#cc0000':pct>0.25?'#ff6600':'#ff0000';
        ctx.beginPath(); ctx.roundRect(bx,by,barW*pct,barH,4); ctx.fill();
        ctx.strokeStyle='#660000'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.roundRect(bx,by,barW,barH,4); ctx.stroke();
        // Wave tier label on boss
        const tierNames=['','','SKULL','SPIDER','PHANTOM','DEMON','ABOMINATION'];
        const bLabel=(tierNames[Math.min(wave.number,6)]||'BOSS')+' BOSS';
        ctx.font='bold 10px monospace'; ctx.fillStyle='#ff4444'; ctx.textAlign='center'; ctx.textBaseline='bottom';
        ctx.shadowColor='#ff0000'; ctx.shadowBlur=8;
        ctx.fillText(bLabel,0,by-2);
        ctx.shadowBlur=0;
        ctx.font='bold 8px monospace'; ctx.fillStyle='#fff'; ctx.textBaseline='middle';
        ctx.fillText(`${m.hp}/${m.maxHp}`,0,by+barH/2);
      }

      ctx.restore();
    }

    function drawMonsters() {
      for (const m of monsters) drawMonster(m);
    }

    // Death burst particles
    const deathParticles = [];
    function spawnDeathParticles(x, y, color) {
      for (let i = 0; i < 12; i++) {
        const a = (i / 12) * Math.PI * 2;
        deathParticles.push({
          x, y,
          vx: Math.cos(a) * (2 + Math.random() * 4),
          vy: Math.sin(a) * (2 + Math.random() * 4),
          life: 1.0,
          r: 3 + Math.random() * 4,
          color,
        });
      }
    }

    function updateDeathParticles(dt) {
      for (let i = deathParticles.length - 1; i >= 0; i--) {
        const p = deathParticles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.life -= 0.04 * dt;
        if (p.life <= 0) deathParticles.splice(i, 1);
      }
    }

    function drawDeathParticles() {
      for (const p of deathParticles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fill();
        ctx.globalAlpha = 1;
      }
    }

    // Utility: lighten a hex color
    function lighten(hex) {
      const r = Math.min(255, parseInt(hex.slice(1,3),16) + 80);
      const g = Math.min(255, parseInt(hex.slice(3,5),16) + 80);
      const b = Math.min(255, parseInt(hex.slice(5,7),16) + 80);
      return `rgb(${r},${g},${b})`;
    }

    // --- Particle trail ---
    const particles = [];
    function spawnParticle(x, y) {
      particles.push({
        x: x + (Math.random() - 0.5) * 20,
        y: y + egg.ry,
        vx: (Math.random() - 0.5) * 1.2,
        vy: -(Math.random() * 1.5 + 0.5),
        life: 1.0,
        r: Math.random() * 3 + 1.5,
      });
    }

    function updateParticles() {
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.04;
        p.life -= 0.035;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    function drawParticles() {
      for (const p of particles) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(249, 168, 37, ${p.life * 0.5})`;
        ctx.fill();
      }
    }

    // --- Subtle grid background ---
    // =====================================================================
    // THEME / BACKGROUND SYSTEM
    // =====================================================================
    let activeTheme = 'space'; // 'space' | 'sonic' | 'lava'

    // Pre-generate stable star field
    const STARS = Array.from({length: 180}, () => ({
      x: Math.random(), y: Math.random(),
      r: 0.5 + Math.random() * 1.5,
      bright: Math.random(),
      speed: 0.1 + Math.random() * 0.4,
    }));
    let bgScroll = 0;

    function applyTheme(code) {
      const c = code.trim().toLowerCase();
      const msgEl = document.getElementById('code-msg');
      if (c === 'sonic') {
        activeTheme = 'sonic';
        msgEl.textContent = '✔ SONIC MODE!';
        msgEl.style.color = '#44aaff';
      } else if (c === 'lava') {
        activeTheme = 'lava';
        msgEl.textContent = '✔ LAVA WORLD!';
        msgEl.style.color = '#ff4400';
      } else if (c === 'space' || c === 'reset') {
        activeTheme = 'space';
        msgEl.textContent = '✔ SPACE MODE';
        msgEl.style.color = '#4cff88';
      } else {
        msgEl.textContent = '✘ unknown code';
        msgEl.style.color = '#e74c3c';
      }
      setTimeout(() => { msgEl.textContent = ''; }, 2500);
    }

    document.getElementById('code-btn').addEventListener('click', () => {
      applyTheme(document.getElementById('code-input').value);
      document.getElementById('code-input').value = '';
    });
    document.getElementById('code-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        applyTheme(e.target.value);
        e.target.value = '';
      }
    });

    function drawBackground() {
      bgScroll += 0.3;

      if (activeTheme === 'sonic') {
        // Blue sky gradient + scrolling checkerboard floor
        const sky = ctx.createLinearGradient(0, 0, 0, canvas.height);
        sky.addColorStop(0, '#1a6bd4');
        sky.addColorStop(0.6, '#5baaf5');
        sky.addColorStop(1, '#89c4f8');
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Checkerboard ground strip
        const gY = canvas.height * 0.72;
        ctx.fillStyle = '#3d8c3d';
        ctx.fillRect(0, gY, canvas.width, canvas.height - gY);
        const cSize = 32;
        const offset = bgScroll % (cSize * 2);
        for (let cx2 = -cSize * 2 + (offset % cSize); cx2 < canvas.width + cSize; cx2 += cSize * 2) {
          for (let cy2 = gY; cy2 < canvas.height; cy2 += cSize) {
            ctx.fillStyle = ((Math.floor(cx2/cSize) + Math.floor((cy2-gY)/cSize)) % 2 === 0) ? '#2d6e2d' : '#3d8c3d';
            ctx.fillRect(cx2, cy2, cSize, cSize);
          }
        }
        // Clouds
        ctx.fillStyle = 'rgba(255,255,255,0.85)';
        [[80, 60], [240, 40], [420, 80], [600, 50]].forEach(([cx2, cy2]) => {
          const bx2 = ((cx2 - bgScroll * 0.5) % (canvas.width + 120) + canvas.width + 120) % (canvas.width + 120) - 60;
          ctx.beginPath(); ctx.ellipse(bx2, cy2, 45, 22, 0, 0, Math.PI*2); ctx.fill();
          ctx.beginPath(); ctx.ellipse(bx2+30, cy2-10, 30, 18, 0, 0, Math.PI*2); ctx.fill();
        });

      } else if (activeTheme === 'lava') {
        // Dark rocky background + lava cracks
        ctx.fillStyle = '#1a0800';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Lava glow veins
        const t2 = bgScroll * 0.02;
        for (let i = 0; i < 8; i++) {
          const x1 = (i / 8 + Math.sin(t2 + i) * 0.05) * canvas.width;
          const y1 = (Math.cos(t2 * 0.7 + i * 1.3) * 0.3 + 0.5) * canvas.height;
          const grd = ctx.createRadialGradient(x1, y1, 5, x1, y1, 90);
          grd.addColorStop(0, `rgba(255,${80 + i*10},0,${0.25 + 0.1*Math.sin(t2+i)})`);
          grd.addColorStop(1, 'transparent');
          ctx.fillStyle = grd;
          ctx.beginPath(); ctx.arc(x1, y1, 90, 0, Math.PI*2); ctx.fill();
        }
        // Rock grid
        ctx.strokeStyle = 'rgba(80,20,0,0.4)';
        ctx.lineWidth = 1;
        for (let rx = 0; rx < canvas.width; rx += 48) {
          ctx.beginPath(); ctx.moveTo(rx, 0); ctx.lineTo(rx, canvas.height); ctx.stroke();
        }
        for (let ry = 0; ry < canvas.height; ry += 48) {
          ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(canvas.width, ry); ctx.stroke();
        }

      } else {
        // SPACE (default) — deep space with scrolling stars and nebula
        const spaceBg = ctx.createLinearGradient(0, 0, 0, canvas.height);
        spaceBg.addColorStop(0, '#000008');
        spaceBg.addColorStop(0.5, '#04001a');
        spaceBg.addColorStop(1, '#08000f');
        ctx.fillStyle = spaceBg;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Nebula wisps
        const nb = ctx.createRadialGradient(canvas.width*0.3, canvas.height*0.4, 20, canvas.width*0.3, canvas.height*0.4, 220);
        nb.addColorStop(0, 'rgba(80,0,120,0.08)');
        nb.addColorStop(1, 'transparent');
        ctx.fillStyle = nb; ctx.fillRect(0, 0, canvas.width, canvas.height);
        const nb2 = ctx.createRadialGradient(canvas.width*0.75, canvas.height*0.6, 10, canvas.width*0.75, canvas.height*0.6, 180);
        nb2.addColorStop(0, 'rgba(0,40,100,0.10)');
        nb2.addColorStop(1, 'transparent');
        ctx.fillStyle = nb2; ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Stars
        STARS.forEach(s => {
          const sx = (s.x * canvas.width + bgScroll * s.speed * 0.4) % canvas.width;
          const sy = s.y * canvas.height;
          const alpha = 0.3 + s.bright * 0.7 * (0.7 + 0.3 * Math.sin(bgScroll * 0.05 + s.bright * 10));
          ctx.beginPath();
          ctx.arc(sx, sy, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,255,255,${alpha.toFixed(2)})`;
          ctx.fill();
        });
      }
    }

    // --- Input: shoot + slot keys ---
    window.addEventListener('keydown', e => {
      if (e.key === ' ' && !e.repeat) {
        e.preventDefault();
        shootBullet();
      }
      // E: use kid to heal
      if ((e.key === 'e' || e.key === 'E') && !e.repeat) {
        useKid();
      }
      // R: ride / dismount nearest dino
      if ((e.key === 'r' || e.key === 'R') && !e.repeat) {
        tryRideDino();
      }
      // 1-4: equip slot
      if (['1','2','3','4'].includes(e.key)) {
        const idx = parseInt(e.key) - 1;
        if (inventory.slots[idx] && inventory.slots[idx].unlocked) {
          inventory.equipped = idx;
          renderInventory();
        }
      }
    });

    // --- Game loop ---
    let lastTime = 0;
    function loop(timestamp) {
      const dt = Math.min((timestamp - lastTime) / 16.67, 3); // normalize to 60fps
      lastTime = timestamp;

      // --- Game over ---
      if (gameOver) {
        drawBackground();
        return;
      }
      if (egg.hp <= 0 && !gameOver) {
        gameOver = true;
        gameoverStats.textContent = `Wave ${wave.number} · ${coins} 🪙 · ${diamonds} 💎`;
        gameoverEl.classList.add('show');
        wheelSpun = { coin: false, diamond: false };
        initWheels();
        return;
      }

      // --- Wave intermission countdown ---
      if (wave.phase === 'intermission') {
        wave.intermissionTimer -= dt;
        if (wave.intermissionTimer <= 0) {
          waveBarFill.style.background = 'linear-gradient(90deg,#ff4400,#ff9900)';
          waveBarFill.style.width = '0%';
          upgradeDinosForWave();
          startWave(wave.number + 1);
        }
      }

      // Input
      let dx = 0, dy = 0;
      if (keys['ArrowLeft']  || keys['a'] || keys['A']) dx -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) dx += 1;
      if (keys['ArrowUp']    || keys['w'] || keys['W']) dy -= 1;
      if (keys['ArrowDown']  || keys['s'] || keys['S']) dy += 1;

      // Normalize diagonal
      if (dx !== 0 && dy !== 0) {
        const len = Math.sqrt(dx * dx + dy * dy);
        dx /= len;
        dy /= len;
      }

      egg.isMoving = dx !== 0 || dy !== 0;

      // Move
      if (egg.isMoving) {
        egg.x += dx * egg.speed * dt;
        egg.y += dy * egg.speed * dt;
        egg.dirX = dx;
        egg.dirY = dy;
        egg.walkAngle += 0.15 * dt;
        egg.squashTarget = 0.92;
        // Clamp to canvas
        egg.x = Math.max(egg.rx + 20, Math.min(canvas.width - egg.rx - 20, egg.x));
        egg.y = Math.max(egg.ry + 20, Math.min(canvas.height - egg.ry - 20, egg.y));
        // Particle trail
        if (Math.random() < 0.3 * dt) spawnParticle(egg.x, egg.y);
      } else {
        egg.squashTarget = 1.0;
        // Idle bob
        egg.bobAngle += 0.04 * dt;
      }

      // Smooth squash
      egg.squash += (egg.squashTarget - egg.squash) * 0.15 * dt;

      // Bob offset (idle)
      const bobY = egg.isMoving ? 0 : Math.sin(egg.bobAngle) * 3;

      // Update aim direction from movement, keep last known when idle
      if (egg.isMoving) {
        egg.aimDX = dx;
        egg.aimDY = dy;
      }

      // Decay muzzle flash and recoil
      egg.muzzleFlash = Math.max(0, egg.muzzleFlash - 0.12 * dt);
      egg.recoil      = Math.max(0, egg.recoil      - 0.1  * dt);

      // --- Monster touch damage to player ---
      if (egg.invincible > 0) {
        egg.invincible -= dt;
      } else {
        for (const m of monsters) {
          const dx = egg.x - m.x, dy = egg.y - m.y;
          if (Math.sqrt(dx*dx + dy*dy) < egg.rx + m.r - 4) {
            egg.hp = Math.max(0, egg.hp - 8);
            egg.invincible = 45;
            egg.squashTarget = 1.3;
            break;
          }
        }
      }
      // Update health bar — rainbow stays fixed, only width changes
      healthFill.style.width = (egg.hp / egg.maxHp * 100) + '%';
      healthBarText.textContent = `❤️ ${egg.hp} / ${egg.maxHp}`;

      updateParticles();
      updateBullets(dt);
      updateMonsters(dt);
      updateDinosaurs(dt);
      updateDeathParticles(dt);
      updateShockwaves(dt);
      updateDrops(dt);
      updateSword(dt);
      updateKidOrbiters(dt);
      if (pickupFlash) {
        pickupFlash.life -= 0.02 * dt;
        if (pickupFlash.life <= 0) pickupFlash = null;
      }
      if (kidHealFlash > 0) kidHealFlash = Math.max(0, kidHealFlash - 0.03 * dt);

      // Draw
      drawBackground();
      drawDinosaurs();
      drawKidOrbiters();
      drawDrops();
      drawMonsters();
      drawShockwaves();
      drawBullets();
      drawParticles();
      drawDeathParticles();
      // Sword arm drawn separately (outside egg transform)
      if (equippedWeapon() && equippedWeapon().type === 'melee') drawSwordArm();
      drawEgg(egg.x, egg.y, egg.walkAngle, bobY, egg.squash);

      // Pickup flash overlay
      if (pickupFlash && pickupFlash.life > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, pickupFlash.life * 2);
        ctx.font = 'bold 22px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        // Upgrade = purple glow, new pickup = gold
        const flashCol = pickupFlash.upgrade ? '#cc88ff' : '#ffd700';
        ctx.fillStyle = flashCol;
        ctx.shadowColor = flashCol;
        ctx.shadowBlur = 16;
        // Maxed (5 stars) gets extra SIZE
        const txt = '✦ ' + pickupFlash.text + ' ✦';
        const isMax = pickupFlash.text.includes('★★★★★');
        ctx.font = `bold ${isMax ? 28 : 22}px monospace`;
        if (isMax) {
          ctx.shadowBlur = 30;
          ctx.shadowColor = '#ffd700';
        }
        ctx.fillText(txt, canvas.width / 2, canvas.height / 2 - 80);
        ctx.restore();
      }

      // Kid heal flash overlay
      if (kidHealFlash > 0) {
        ctx.save();
        ctx.globalAlpha = Math.min(1, kidHealFlash * 2);
        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillStyle = '#ffdd44';
        ctx.shadowColor = '#ffdd44';
        ctx.shadowBlur = 20;
        ctx.fillText(`🥚 +${KID_HEAL} HP`, canvas.width / 2, canvas.height / 2 - 110);
        ctx.restore();
      }

      requestAnimationFrame(loop);
    }

    // Sync initial position after first resize
    egg.x = canvas.width / 2;
    egg.y = canvas.height / 2;
    egg.aimDX = 1;   // default aim right
    egg.aimDY = 0;
    egg.muzzleFlash = 0;
    egg.recoil = 0;

    startWave(1);
    requestAnimationFrame(loop);
 
    // =====================================================================
    // SPIN WHEELS
    // =====================================================================
    const COIN_WHEEL_COST    = 20;
    const DIAMOND_WHEEL_COST = 8;

    // Coin wheel — costs 20 🪙, casual rewards (HP, coins, kids, items)
    const COIN_SEGMENTS = [
      { label: '+1 Kid',    icon: '🥚', color: '#e67e22', reward: () => { addKid();                                          return '+1 Kid 🥚'; } },
      { label: '+30 Coins', icon: '🪙', color: '#f39c12', reward: () => { addCoins(30);                                      return '+30 🪙 Coins'; } },
      { label: '+60 HP',    icon: '❤️', color: '#27ae60', reward: () => { egg.hp = Math.min(egg.maxHp, egg.hp + 60);         return '+60 HP!'; } },
      { label: 'Bazooka+',  icon: '💥', color: '#8e44ad', reward: () => { grantWeapon('bazooka');                            return 'Bazooka upgraded!'; } },
      { label: '+2 Kids',   icon: '🐣', color: '#d35400', reward: () => { addKid(); addKid();                                return '+2 Kids 🐣'; } },
      { label: '+15 Coins', icon: '🪙', color: '#d4ac0d', reward: () => { addCoins(15);                                      return '+15 🪙 Coins'; } },
      { label: '+40 HP',    icon: '💚', color: '#148f77', reward: () => { egg.hp = Math.min(egg.maxHp, egg.hp + 40);         return '+40 HP!'; } },
      { label: 'RPG+',      icon: '🚀', color: '#4488ff', reward: () => { grantWeapon('rpg');                                return 'RPG upgraded!'; } },
    ];

    // Diamond wheel — costs 8 💎, premium rewards (weapons, backgrounds, max HP)
    const DIAMOND_SEGMENTS = [
      { label: 'Sword 5★',   icon: '⚔️', color: '#c0392b', reward: () => { for(let i=0;i<5;i++) grantWeapon('sword');              return '⚔️ Sword → 5★!'; } },
      { label: 'SONIC BG',   icon: '💙', color: '#1a8cff', reward: () => { applyTheme('sonic');                                     return '💙 Sonic Background!'; } },
      { label: 'Dino Cann+', icon: '💣', color: '#d4ac0d', reward: () => { grantWeapon('bomb_gun');                                 return '💣 Dino Cannon ⬆'; } },
      { label: 'MAX HP+50',  icon: '❤️', color: '#117a65', reward: () => { egg.maxHp += 50; egg.hp = egg.maxHp;                     return '❤️ Max HP +50!'; } },
      { label: 'RPG 5★',     icon: '🚀', color: '#154360', reward: () => { for(let i=0;i<5;i++) grantWeapon('rpg');                 return '🚀 RPG → 5★!'; } },
      { label: 'LAVA BG',    icon: '🔥', color: '#b03a00', reward: () => { applyTheme('lava');                                      return '🔥 Lava Background!'; } },
      { label: 'All Weapons',icon: '🎁', color: '#784212', reward: () => { ['rpg','bazooka','sword'].forEach(w=>grantWeapon(w));    return '🎁 All weapons unlocked!'; } },
      { label: '+100 HP',    icon: '💖', color: '#1a5276', reward: () => { egg.hp = Math.min(egg.maxHp, egg.hp + 100);              return '+100 HP!'; } },
    ];

    let wheelSpun = { coin: false, diamond: false };

    function drawWheel(canvasEl, segments, rotation) {
      const wctx = canvasEl.getContext('2d');
      const cx = canvasEl.width / 2, cy = canvasEl.height / 2, r = cx - 4;
      const arc = (Math.PI * 2) / segments.length;
      wctx.clearRect(0, 0, canvasEl.width, canvasEl.height);
      segments.forEach((seg, i) => {
        const start = rotation + i * arc;
        const end   = start + arc;
        // Slice fill
        wctx.beginPath();
        wctx.moveTo(cx, cy);
        wctx.arc(cx, cy, r, start, end);
        wctx.closePath();
        wctx.fillStyle = seg.color;
        wctx.fill();
        wctx.strokeStyle = 'rgba(0,0,0,0.35)';
        wctx.lineWidth = 1.5;
        wctx.stroke();
        // Draw text label + emoji icon along the slice
        wctx.save();
        wctx.translate(cx, cy);
        wctx.rotate(start + arc / 2);
        wctx.textAlign = 'right';
        wctx.fillStyle = '#fff';
        wctx.shadowColor = '#000';
        wctx.shadowBlur = 3;
        // Icon (emoji) — slightly larger font, closer to edge
        wctx.font = 'bold 13px sans-serif';
        wctx.fillText(seg.icon, r - 8, -6);
        // Label text beneath icon
        wctx.font = 'bold 9px monospace';
        wctx.fillText(seg.label, r - 8, 7);
        wctx.restore();
      });
      // Pointer notch at top
      wctx.save();
      wctx.fillStyle = '#fff';
      wctx.strokeStyle = '#000';
      wctx.lineWidth = 1;
      wctx.beginPath();
      wctx.moveTo(cx - 7, 0);
      wctx.lineTo(cx + 7, 0);
      wctx.lineTo(cx, 16);
      wctx.closePath();
      wctx.fill();
      wctx.stroke();
      wctx.restore();
      // Center cap
      wctx.beginPath();
      wctx.arc(cx, cy, 14, 0, Math.PI * 2);
      wctx.fillStyle = '#111';
      wctx.fill();
      wctx.strokeStyle = '#555';
      wctx.lineWidth = 2;
      wctx.stroke();
    }

    function spinWheel(canvasEl, segments, resultEl, btnEl, onDone) {
      btnEl.disabled = true;
      const totalSpins = (5 + Math.random() * 4) * Math.PI * 2; // 5–9 full spins
      const extra      = Math.random() * Math.PI * 2;            // random landing offset
      const target     = totalSpins + extra;
      const duration   = 3500; // ms
      let startTime    = null;
      const startRot   = 0;

      function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

      function frame(ts) {
        if (!startTime) startTime = ts;
        const elapsed = ts - startTime;
        const t   = Math.min(elapsed / duration, 1);
        const rot = startRot + target * easeOut(t);
        drawWheel(canvasEl, segments, rot);
        if (t < 1) {
          requestAnimationFrame(frame);
        } else {
          // Determine winning segment — pointer is at top (−π/2), wheel rotated by rot
          const arc = (Math.PI * 2) / segments.length;
          // Pointer at top = angle -π/2 in wheel's frame
          const pointerAngle = ((-Math.PI / 2 - rot) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
          const winIdx = Math.floor(pointerAngle / arc) % segments.length;
          const seg    = segments[((winIdx % segments.length) + segments.length) % segments.length];
          const msg    = seg.reward();
          resultEl.textContent = '✨ ' + msg;
          resultEl.style.color = seg.color;
          onDone();
        }
      }
      requestAnimationFrame(frame);
    }

    function initWheels() {
      const wCoin    = document.getElementById('wheel-coin');
      const wDiamond = document.getElementById('wheel-diamond');
      const btnC     = document.getElementById('btn-coin');
      const btnD     = document.getElementById('btn-diamond');
      const resC     = document.getElementById('result-coin');
      const resD     = document.getElementById('result-diamond');
      const coinLbl  = document.getElementById('coin-cost-label');
      const diamLbl  = document.getElementById('diamond-cost-label');

      drawWheel(wCoin,    COIN_SEGMENTS,    0);
      drawWheel(wDiamond, DIAMOND_SEGMENTS, 0);

      // Live currency labels
      coinLbl.textContent = `Costs ${COIN_WHEEL_COST} 🪙 · you have ${coins} 🪙`;
      diamLbl.textContent = `Costs ${DIAMOND_WHEEL_COST} 💎 · you have ${diamonds} 💎`;

      btnC.onclick = () => {
        if (wheelSpun.coin) return;
        if (coins < COIN_WHEEL_COST) {
          resC.textContent = `Need ${COIN_WHEEL_COST} 🪙 (you have ${coins})`;
          resC.style.color = '#e74c3c';
          return;
        }
        coins -= COIN_WHEEL_COST;
        coinCountEl.textContent = coins;
        coinLbl.textContent = `Spent ${COIN_WHEEL_COST} 🪙 · ${coins} remaining`;
        wheelSpun.coin = true;
        spinWheel(wCoin, COIN_SEGMENTS, resC, btnC, () => {});
      };

      btnD.onclick = () => {
        if (wheelSpun.diamond) return;
        if (diamonds < DIAMOND_WHEEL_COST) {
          resD.textContent = `Need ${DIAMOND_WHEEL_COST} 💎 (you have ${diamonds})`;
          resD.style.color = '#e74c3c';
          return;
        }
        diamonds -= DIAMOND_WHEEL_COST;
        diamondCountEl.textContent = diamonds;
        diamLbl.textContent = `Spent ${DIAMOND_WHEEL_COST} 💎 · ${diamonds} remaining`;
        wheelSpun.diamond = true;
        spinWheel(wDiamond, DIAMOND_SEGMENTS, resD, btnD, () => {});
      };
    }
  </script>
