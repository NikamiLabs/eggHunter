      ctx.fillStyle = '#111';
      ctx.beginPath(); ctx.roundRect(-12, -22, 10, 7, 2); ctx.fill();
      ctx.beginPath(); ctx.roundRect(2, -22, 10, 7, 2); ctx.fill();
      // Bridge
      ctx.beginPath(); ctx.moveTo(-2, -18); ctx.lineTo(2, -18);
      ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();

      // Smile
      ctx.beginPath(); ctx.arc(0, -10, 6, 0.2, Math.PI - 0.2);
      ctx.strokeStyle = '#8a5c2a'; ctx.lineWidth = 2; ctx.lineCap = 'round'; ctx.stroke();

      ctx.restore();
    }

    function drawSteveSkin(x, y, walkAngle, bobY, squash) {
      ctx.save();
      ctx.translate(x, y + bobY);
      ctx.scale(1 / squash, squash);

      // Shadow
      ctx.save(); ctx.scale(1, 0.25);
      ctx.beginPath(); ctx.ellipse(0, 38, 16, 7, 0, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fill();
      ctx.restore();

      // Legs (gray pants)
      const legSwing = Math.sin(walkAngle) * 0.28;
      ctx.save(); ctx.translate(-7, 14); ctx.rotate(-legSwing - 0.1);
      ctx.fillStyle = '#5a6680'; ctx.beginPath(); ctx.rect(-5, 0, 10, 20); ctx.fill();
      ctx.strokeStyle = '#444'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
      ctx.save(); ctx.translate(7, 14); ctx.rotate(legSwing + 0.1);
      ctx.fillStyle = '#5a6680'; ctx.beginPath(); ctx.rect(-5, 0, 10, 20); ctx.fill();
      ctx.strokeStyle = '#444'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();

      // Body — blue shirt
      ctx.fillStyle = '#3f5fa0';
      ctx.beginPath(); ctx.rect(-13, -4, 26, 20); ctx.fill();
      ctx.strokeStyle = '#2a3d6a'; ctx.lineWidth = 1; ctx.stroke();

      // Arms
      const armSwing = Math.sin(walkAngle) * 0.28;
      ctx.save(); ctx.translate(-17, -3); ctx.rotate(-armSwing - 0.15);
      ctx.fillStyle = '#3f5fa0'; ctx.beginPath(); ctx.rect(-4, 0, 8, 18); ctx.fill();
      ctx.strokeStyle = '#2a3d6a'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();
      ctx.save(); ctx.translate(17, -3); ctx.rotate(armSwing + 0.15);
      ctx.fillStyle = '#3f5fa0'; ctx.beginPath(); ctx.rect(-4, 0, 8, 18); ctx.fill();
      ctx.strokeStyle = '#2a3d6a'; ctx.lineWidth = 1; ctx.stroke();
      ctx.restore();

      // Head — peach face square
      ctx.fillStyle = '#c8a070';
      ctx.beginPath(); ctx.rect(-14, -30, 28, 26); ctx.fill();
      ctx.strokeStyle = '#8a5c2a'; ctx.lineWidth = 1; ctx.stroke();

      // Brown hair on top
      ctx.fillStyle = '#6b3e26';
      ctx.beginPath(); ctx.rect(-14, -32, 28, 8); ctx.fill();
      ctx.strokeStyle = '#3a1e0a'; ctx.lineWidth = 1; ctx.stroke();

      // Pixel eyes (dark squares)
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.rect(-9, -22, 6, 6); ctx.fill();
      ctx.beginPath(); ctx.rect(3, -22, 6, 6); ctx.fill();

      // Pixel mouth
      ctx.fillStyle = '#7a3c1a';
      ctx.beginPath(); ctx.rect(-7, -11, 14, 4); ctx.fill();

      ctx.restore();
    }

    // --- Draw egg character ---
    function drawEgg(x, y, walkAngle, bobY, squash) {
      // Theme-based player skin replaces egg body
      if (activeTheme === 'sonic')     { drawSonicSkin(x, y, walkAngle, bobY, squash); return; }
      if (activeTheme === 'backrooms') { drawRobloxSkin(x, y, walkAngle, bobY, squash); return; }
      if (activeTheme === 'minecraft') { drawSteveSkin(x, y, walkAngle, bobY, squash); return; }

      ctx.save();
      ctx.translate(x, y + bobY);

      // Squash/stretch transform
      ctx.scale(1 / squash, squash);

      // ---- Shadow ----
      ctx.save();
      ctx.scale(1, 0.25);
      const shadowGrad = ctx.createRadialGradient(0, egg.ry * squash + 6, 2, 0, egg.ry * squash + 6, 28);
      shadowGrad.addColorStop(0, 'rgba(255,255,255,0.08)');
      shadowGrad.addColorStop(1, 'transparent');
      ctx.beginPath();
      ctx.ellipse(0, egg.ry * squash + 6, 28, 14, 0, 0, Math.PI * 2);
      ctx.fillStyle = shadowGrad;
      ctx.fill();
      ctx.restore();

      // ---- Body ----
      const bodyGrad = ctx.createRadialGradient(-6, -10, 4, 0, 0, egg.ry * 1.4);
      bodyGrad.addColorStop(0, '#fffde7');
      bodyGrad.addColorStop(0.5, '#fff9c4');
      bodyGrad.addColorStop(1, '#f9a825');

      ctx.beginPath();
      ctx.ellipse(0, 0, egg.rx, egg.ry, 0, 0, Math.PI * 2);
      ctx.fillStyle = bodyGrad;
      ctx.fill();

      // Body outline (subtle)
      ctx.strokeStyle = 'rgba(0,0,0,0.18)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // ---- Eyes ----
      const eyeOffsetX = 9;
      const eyeOffsetY = -7;
      const eyeRadius = 6;
      const pupilRadius = 3.2;

      // Eye look direction
      const lookX = egg.dirX * 2.5;
      const lookY = egg.dirY * 2.5;

      // Left eye white
      ctx.beginPath();
      ctx.arc(-eyeOffsetX, eyeOffsetY, eyeRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Left pupil — narrow/squinted: clip to bottom half of eye
      ctx.save();
      ctx.beginPath();
      ctx.arc(-eyeOffsetX, eyeOffsetY, eyeRadius, 0, Math.PI * 2);
      ctx.clip();
      ctx.beginPath();
      ctx.arc(-eyeOffsetX + lookX, eyeOffsetY + lookY + 1.5, pupilRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#1a1a1a';
      ctx.fill();
      // shine
      ctx.beginPath();
      ctx.arc(-eyeOffsetX + lookX - 1, eyeOffsetY + lookY, 1.1, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.restore();

      // Right eye white
      ctx.beginPath();
      ctx.arc(eyeOffsetX, eyeOffsetY, eyeRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 1;
      ctx.stroke();

      // Right pupil — squinted
      ctx.save();
      ctx.beginPath();
      ctx.arc(eyeOffsetX, eyeOffsetY, eyeRadius, 0, Math.PI * 2);
      ctx.clip();
      ctx.beginPath();
      ctx.arc(eyeOffsetX + lookX, eyeOffsetY + lookY + 1.5, pupilRadius, 0, Math.PI * 2);
      ctx.fillStyle = '#1a1a1a';
      ctx.fill();
      // shine
      ctx.beginPath();
      ctx.arc(eyeOffsetX + lookX - 1, eyeOffsetY + lookY, 1.1, 0, Math.PI * 2);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.restore();

      // ---- Angry brows (V-shape, inward-slanting) ----
      ctx.lineCap = 'round';
      // Left brow: high outer edge, low inner edge → slopes down toward nose
      ctx.beginPath();
      ctx.moveTo(-eyeOffsetX - 7, eyeOffsetY - 9);   // outer (high)
      ctx.lineTo(-eyeOffsetX + 4, eyeOffsetY - 5);   // inner (low)
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 3;
      ctx.stroke();

      // Right brow: low inner edge, high outer edge
      ctx.beginPath();
      ctx.moveTo(eyeOffsetX - 4, eyeOffsetY - 5);    // inner (low)
      ctx.lineTo(eyeOffsetX + 7, eyeOffsetY - 9);    // outer (high)
      ctx.strokeStyle = '#1a1a1a';
      ctx.lineWidth = 3;
      ctx.stroke();

      // ---- Smug crooked grin ----
      // Lower lip curve (wide asymmetric smile — left side higher, right side drops)
      ctx.beginPath();
      ctx.moveTo(-8, 8);
      ctx.bezierCurveTo(-5, 13, 3, 14, 9, 9);
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Upper lip (flatter, slightly tilted)
      ctx.beginPath();
      ctx.moveTo(-8, 8);
      ctx.bezierCurveTo(-4, 6, 3, 7, 9, 9);
      ctx.strokeStyle = 'rgba(0,0,0,0.4)';
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // Teeth peeking through (one big slab, slightly tilted)
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-6, 8.5);
      ctx.bezierCurveTo(-3, 12, 2, 13, 7, 9.5);
      ctx.lineTo(7, 9.5);
      ctx.lineTo(-6, 8.5);
      ctx.closePath();
      ctx.fillStyle = '#fff';
      ctx.fill();
      // Tooth gap lines
      ctx.beginPath();
      ctx.moveTo(-1, 8.8);
      ctx.lineTo(-0.5, 12);
      ctx.strokeStyle = 'rgba(0,0,0,0.2)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(3, 9.2);
      ctx.lineTo(3.5, 12.2);
      ctx.stroke();
      ctx.restore();

      // ---- Hands / Stubby arms ----
      // Hands swing opposite on walk cycle
      const leftSwing  = Math.sin(walkAngle) * 12;
      const rightSwing = -Math.sin(walkAngle) * 12;

      // Left arm
      ctx.save();
      ctx.translate(-egg.rx + 4, 4);
      ctx.rotate((-0.6 + leftSwing * 0.05) * (Math.PI / 180) * 10);
      // Arm
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-14, 8 + leftSwing * 0.3);
      ctx.strokeStyle = '#f9a825';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.stroke();
      // Hand (circle)
      ctx.beginPath();
      ctx.arc(-14, 8 + leftSwing * 0.3, 5, 0, Math.PI * 2);
      ctx.fillStyle = '#fffde7';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();

      // Gun arm — only drawn when NOT using melee weapon
      if (equippedWeapon() && equippedWeapon().type === 'melee') {
        ctx.restore(); // close the main egg save
        return;
      }
      const facingRight = egg.aimDX >= 0;
      // Tilt up/down based on vertical aim component (capped so it never flips)
      const tiltAngle = Math.atan2(egg.aimDY, Math.abs(egg.aimDX) || 0.01);

      ctx.save();
      // Pivot from the side the gun is on
      ctx.translate(facingRight ? egg.rx - 2 : -(egg.rx - 2), 2);
      // Mirror horizontally when facing left
      if (!facingRight) ctx.scale(-1, 1);
      // Apply vertical tilt
      ctx.rotate(tiltAngle);

      // Arm segment
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(12, 0);
      ctx.strokeStyle = '#f9a825';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.stroke();

      // Gun body — shape depends on equipped weapon
      ctx.save();
      ctx.translate(14, 0);
      const wid = equippedWeapon() ? equippedWeapon().id : 'bomb_gun';

      if (wid === 'rpg') {
        const rpgMaxed = equippedStars() >= 5;
        if (rpgMaxed) {
          // ---- SHARK RPG (5★ legendary) ----
          const t = egg.bobAngle;
          // Blue shimmer glow
          const sharkHalo = ctx.createRadialGradient(14, 0, 2, 14, 0, 30);
          sharkHalo.addColorStop(0, `rgba(0,150,255,${0.3 + 0.15*Math.sin(t*3)})`);
          sharkHalo.addColorStop(1, 'transparent');
          ctx.beginPath(); ctx.arc(14, 0, 30, 0, Math.PI*2);
          ctx.fillStyle = sharkHalo; ctx.fill();
          // Shark body (torpedo + shark snout)
          ctx.fillStyle = '#2255aa';
          ctx.beginPath();
          ctx.roundRect(-2, -6, 36, 12, 6);
          ctx.fill();
          ctx.fillStyle = '#3388ff';
          ctx.beginPath(); ctx.roundRect(-1, -5, 34, 5, 4); ctx.fill();
          // Shark snout — pointy wedge at front
          ctx.fillStyle = '#eef';
          ctx.beginPath();
          ctx.moveTo(34, -5); ctx.lineTo(46, 0); ctx.lineTo(34, 5);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#cce';
          ctx.beginPath(); ctx.arc(40, 0, 3, 0, Math.PI*2); ctx.fill();
          // Shark fin on top
          ctx.fillStyle = '#2255aa';
          ctx.beginPath();
          ctx.moveTo(10, -6); ctx.lineTo(16, -18); ctx.lineTo(22, -6);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#3388ff';
          ctx.beginPath();
          ctx.moveTo(11, -6); ctx.lineTo(16, -15); ctx.lineTo(21, -6);
          ctx.closePath(); ctx.fill();
          // Teeth row at front
          ctx.fillStyle = '#fff';
          for (let tk = 0; tk < 4; tk++) {
            ctx.beginPath();
            ctx.moveTo(30 + tk*2.5, -3); ctx.lineTo(31.5 + tk*2.5, 0); ctx.lineTo(33 + tk*2.5, -3);
            ctx.closePath(); ctx.fill();
          }
          // Eye (dark with white sclera)
          ctx.beginPath(); ctx.arc(24, -1, 3.5, 0, Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
          ctx.beginPath(); ctx.arc(25, -1, 2, 0, Math.PI*2); ctx.fillStyle='#111'; ctx.fill();
          // Back exhaust with fire glow
          const fireGrd = ctx.createLinearGradient(-12, 0, -2, 0);
          fireGrd.addColorStop(0, 'transparent');
          fireGrd.addColorStop(1, `rgba(0,200,255,${0.5+0.4*Math.sin(t*4)})`);
          ctx.beginPath(); ctx.roundRect(-10, -4, 10, 8, 3);
          ctx.fillStyle = fireGrd; ctx.fill();
          // "SHARK RPG" label
          ctx.save();
          ctx.font = 'bold 7px monospace'; ctx.fillStyle = '#44aaff';
          ctx.shadowColor = '#44aaff'; ctx.shadowBlur = 6;
          ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          ctx.fillText('SHARK RPG', 16, 8); ctx.shadowBlur = 0;
          ctx.restore();
        } else {
          // ---- RPG: normal green tube ----
          ctx.fillStyle = '#4a7c3f';
          ctx.beginPath(); ctx.roundRect(-2, -5, 38, 10, 3); ctx.fill();
          ctx.fillStyle = '#6aad5a';
          ctx.beginPath(); ctx.roundRect(-1, -4, 36, 4, 2); ctx.fill();
          ctx.fillStyle = '#2a4a28';
          ctx.beginPath();
          ctx.moveTo(-2, -5); ctx.lineTo(-10, -3); ctx.lineTo(-10, 3); ctx.lineTo(-2, 5);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#333';
          ctx.beginPath(); ctx.roundRect(34, -6, 6, 12, 2); ctx.fill();
          ctx.fillStyle = '#555';
          ctx.beginPath(); ctx.arc(37, 0, 4, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#111';
          ctx.beginPath(); ctx.arc(37, 0, 2.5, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#2a4a28';
          ctx.beginPath(); ctx.roundRect(8, 5, 5, 10, 2); ctx.fill();
          ctx.fillStyle = '#222';
          ctx.beginPath(); ctx.roundRect(14, -9, 8, 4, 1); ctx.fill();
          ctx.fillStyle = '#ff3333';
          ctx.beginPath(); ctx.arc(22, -7, 1.5, 0, Math.PI*2); ctx.fill();
        }
      } else if (wid === 'bazooka') {
        const bazMaxed = equippedStars() >= 5;
        if (bazMaxed) {
          // ---- SHARK BAZOOKA (5★ legendary) ----
          const t = egg.bobAngle;
          // Wide jaw glow
          const jaw = ctx.createRadialGradient(16, 0, 2, 16, 0, 34);
          jaw.addColorStop(0, `rgba(0,220,180,${0.3+0.15*Math.sin(t*2.5)})`);
          jaw.addColorStop(1, 'transparent');
          ctx.beginPath(); ctx.arc(16, 0, 34, 0, Math.PI*2);
          ctx.fillStyle = jaw; ctx.fill();
          // Wide shark body
          ctx.fillStyle = '#006655';
          ctx.beginPath(); ctx.roundRect(-4, -9, 46, 18, 7); ctx.fill();
          ctx.fillStyle = '#00998a';
          ctx.beginPath(); ctx.roundRect(-3, -8, 44, 8, 5); ctx.fill();
          // Wide jaw/muzzle — open shark mouth
          ctx.fillStyle = '#004444';
          ctx.beginPath(); ctx.ellipse(44, 0, 8, 12, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#aa2222';
          ctx.beginPath(); ctx.ellipse(44, 2, 6, 8, 0, 0, Math.PI, Math.PI*2); ctx.fill(); // inside mouth
          // Shark teeth row (upper + lower)
          ctx.fillStyle = '#fff';
          for (let tk = 0; tk < 5; tk++) {
            // upper teeth
            ctx.beginPath();
            ctx.moveTo(37 + tk*1.8, -5); ctx.lineTo(38.5 + tk*1.8, 0); ctx.lineTo(40 + tk*1.8, -5);
            ctx.closePath(); ctx.fill();
            // lower teeth
            ctx.beginPath();
            ctx.moveTo(37 + tk*1.8, 5); ctx.lineTo(38.5 + tk*1.8, 0); ctx.lineTo(40 + tk*1.8, 5);
            ctx.closePath(); ctx.fill();
          }
          // Dorsal fin on top
          ctx.fillStyle = '#006655';
          ctx.beginPath();
          ctx.moveTo(6, -9); ctx.lineTo(14, -22); ctx.lineTo(22, -9);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#00aa99';
          ctx.beginPath();
          ctx.moveTo(7, -9); ctx.lineTo(14, -19); ctx.lineTo(21, -9);
          ctx.closePath(); ctx.fill();
          // Side fin (lower)
          ctx.fillStyle = '#006655';
          ctx.beginPath();
          ctx.moveTo(12, 9); ctx.lineTo(8, 20); ctx.lineTo(22, 9);
          ctx.closePath(); ctx.fill();
          // Eye
          ctx.beginPath(); ctx.arc(30, -2, 4, 0, Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
          ctx.beginPath(); ctx.arc(31, -2, 2.2, 0, Math.PI*2); ctx.fillStyle='#000'; ctx.fill();
          ctx.beginPath(); ctx.arc(30.5, -2.5, 0.8, 0, Math.PI*2); ctx.fillStyle='#fff'; ctx.fill();
          // Back vent with teal glow
          const ventGrd = ctx.createLinearGradient(-14, 0, -4, 0);
          ventGrd.addColorStop(0, 'transparent');
          ventGrd.addColorStop(1, `rgba(0,255,200,${0.5+0.35*Math.sin(t*3)})`);
          ctx.beginPath(); ctx.roundRect(-12, -5, 10, 10, 3); ctx.fillStyle = ventGrd; ctx.fill();
          // Label
          ctx.save();
          ctx.font = 'bold 7px monospace'; ctx.fillStyle = '#00ffcc';
          ctx.shadowColor = '#00ffcc'; ctx.shadowBlur = 6;
          ctx.textAlign = 'center'; ctx.textBaseline = 'top';
          ctx.fillText('SHARK BAZOOKA', 16, 10); ctx.shadowBlur = 0;
          ctx.restore();
        } else {
          // ---- Bazooka: normal fat tube ----
          ctx.fillStyle = '#8B4513';
          ctx.beginPath(); ctx.roundRect(-3, -7, 42, 14, 4); ctx.fill();
          ctx.fillStyle = '#a0522d';
          ctx.beginPath(); ctx.roundRect(-2, -6, 40, 6, 3); ctx.fill();
          ['#666','#777','#666'].forEach((c, i) => {
            ctx.fillStyle = c;
            ctx.beginPath(); ctx.roundRect(4 + i * 11, -7, 4, 14, 1); ctx.fill();
          });
          ctx.fillStyle = '#444';
          ctx.beginPath(); ctx.ellipse(40, 0, 5, 9, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#111';
          ctx.beginPath(); ctx.ellipse(40, 0, 3, 6, 0, 0, Math.PI*2); ctx.fill();
          ctx.fillStyle = '#333';
          ctx.beginPath();
          ctx.moveTo(-3, -7); ctx.lineTo(-12, -4); ctx.lineTo(-12, 4); ctx.lineTo(-3, 7);
          ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#5a2d0c';
          ctx.beginPath(); ctx.roundRect(12, 7, 6, 12, 2); ctx.fill();
        }
      } else {
        const bombStars = inventory.slots[0].stars;
        const bombMaxed = bombStars >= 5;

        if (bombMaxed) {
          // ---- LEGENDARY 5★ Dino Cannon ----
          // Animated shimmer using egg.bobAngle as time source
          const t = egg.bobAngle;

          // Outer golden glow halo
          const halo = ctx.createRadialGradient(10, 0, 2, 10, 0, 28);
          halo.addColorStop(0, `rgba(255,220,50,${0.35 + 0.2 * Math.sin(t * 3)})`);
          halo.addColorStop(0.5, `rgba(255,140,0,${0.2 + 0.15 * Math.sin(t * 2 + 1)})`);
          halo.addColorStop(1, 'transparent');
          ctx.beginPath();
          ctx.arc(10, 0, 28, 0, Math.PI * 2);
          ctx.fillStyle = halo; ctx.fill();

          // Main barrel — wide gilded cannon body
          const barrelGrd = ctx.createLinearGradient(-4, -8, -4, 8);
          barrelGrd.addColorStop(0, '#ffe566');
          barrelGrd.addColorStop(0.3, '#ffd700');
          barrelGrd.addColorStop(0.6, '#b8860b');
          barrelGrd.addColorStop(1, '#7a5800');
          ctx.fillStyle = barrelGrd;
          ctx.beginPath();
          ctx.roundRect(-4, -8, 38, 16, 5);
          ctx.fill();
          // Barrel shine streak
          ctx.fillStyle = 'rgba(255,255,200,0.45)';
          ctx.beginPath();
          ctx.roundRect(-2, -6, 34, 5, 3);
          ctx.fill();

          // Gold bands/rings along barrel
          [4, 14, 24].forEach(bx2 => {
            const ringGrd = ctx.createLinearGradient(bx2, -8, bx2, 8);
            ringGrd.addColorStop(0, '#ffe566');
            ringGrd.addColorStop(0.5, '#ffd700');
            ringGrd.addColorStop(1, '#7a5800');
            ctx.fillStyle = ringGrd;
            ctx.beginPath();
            ctx.roundRect(bx2, -9, 5, 18, 2);
            ctx.fill();
          });

          // Muzzle bell — large dark opening with gold rim
          ctx.fillStyle = '#1a1a1a';
          ctx.beginPath();
          ctx.ellipse(35, 0, 6, 10, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#ffd700';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          ctx.ellipse(35, 0, 6, 10, 0, 0, Math.PI * 2);
          ctx.stroke();
          // Barrel bore glow
          const boreGrd = ctx.createRadialGradient(35, 0, 0, 35, 0, 5);
          boreGrd.addColorStop(0, `rgba(255,200,50,${0.6 + 0.4 * Math.sin(t * 4)})`);
          boreGrd.addColorStop(1, 'transparent');
          ctx.beginPath();
          ctx.arc(35, 0, 5, 0, Math.PI * 2);
          ctx.fillStyle = boreGrd; ctx.fill();

          // Grip — ornate dark gold
          const gripGrd = ctx.createLinearGradient(-2, 8, 8, 8);
          gripGrd.addColorStop(0, '#7a5800');
          gripGrd.addColorStop(0.5, '#b8860b');
          gripGrd.addColorStop(1, '#7a5800');
          ctx.fillStyle = gripGrd;
          ctx.beginPath();
          ctx.roundRect(-2, 8, 8, 13, 3);
          ctx.fill();
          ctx.strokeStyle = '#ffd700'; ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.roundRect(-2, 8, 8, 13, 3);
          ctx.stroke();

          // Gem on the side — pulsing
          const gemPulse = 0.75 + 0.25 * Math.sin(t * 5);
          ctx.beginPath();
          ctx.arc(18, -5, 4, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(80,200,255,${gemPulse})`;
          ctx.fill();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
          ctx.stroke();
          // Gem shine
          ctx.beginPath();
          ctx.arc(16.5, -6.5, 1.2, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.9)'; ctx.fill();

          // Sparkles floating around gun
          for (let sp = 0; sp < 4; sp++) {
            const sa = t * 1.5 + sp * (Math.PI / 2);
            const sr = 14 + sp * 3;
            const sx2 = 14 + Math.cos(sa) * sr;
            const sy2 = Math.sin(sa) * (sr * 0.4);
            ctx.beginPath();
            ctx.arc(sx2, sy2, 1.5, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(255,230,80,${0.5 + 0.5 * Math.sin(t * 3 + sp)})`;
            ctx.fill();
          }

        } else {
          // ---- Bomb Gun (plain pistol, non-maxed) ----
          ctx.fillStyle = '#222';
          ctx.beginPath();
          ctx.roundRect(-2, 1, 6, 9, 2);
          ctx.fill();
          ctx.fillStyle = '#333';
          ctx.beginPath();
          ctx.roundRect(-1, -4, 16, 5, 2);
          ctx.fill();
          ctx.fillStyle = '#555';
          ctx.beginPath();
          ctx.roundRect(0, -3, 14, 2, 1);
          ctx.fill();
          ctx.fillStyle = '#444';
          ctx.beginPath();
          ctx.roundRect(14, -5, 4, 7, 1);
          ctx.fill();
        }
      }

      // Muzzle flash (when firing)
      if (egg.muzzleFlash > 0) {
        const f = egg.muzzleFlash;
        const flashX = wid === 'rpg' ? 43 : wid === 'bazooka' ? 45 : 20;
        ctx.save();
        ctx.translate(flashX, 0);
        const grd = ctx.createRadialGradient(0, 0, 0, 0, 0, 18 * f);
        grd.addColorStop(0, `rgba(255,240,100,${f})`);
        grd.addColorStop(0.4, `rgba(255,140,0,${f * 0.8})`);
        grd.addColorStop(1, 'transparent');
        ctx.beginPath();
        ctx.arc(0, 0, 18 * f, 0, Math.PI * 2);
        ctx.fillStyle = grd;
        ctx.fill();
        ctx.strokeStyle = `rgba(255,220,50,${f})`;
        ctx.lineWidth = 1.5;
        ctx.lineCap = 'round';
        for (let s = 0; s < 6; s++) {
          const a = (s / 6) * Math.PI * 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(a) * 12 * f, Math.sin(a) * 12 * f);
          ctx.stroke();
        }
        ctx.restore();
      }

      ctx.restore(); // gun body
      ctx.restore(); // arm

      // ---- Feet ----
      const leftFoot  = Math.sin(walkAngle) * 5;
      const rightFoot = -Math.sin(walkAngle) * 5;

      // Left foot
      ctx.save();
      ctx.translate(-10, egg.ry - 2);
      ctx.rotate(leftFoot * 0.08);
      ctx.beginPath();
      ctx.ellipse(0, 6, 7, 5, 0.2, 0, Math.PI * 2);
      ctx.fillStyle = '#f9a825';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();

      // Right foot
      ctx.save();
      ctx.translate(10, egg.ry - 2);
      ctx.rotate(rightFoot * 0.08);
      ctx.beginPath();
      ctx.ellipse(0, 6, 7, 5, -0.2, 0, Math.PI * 2);
      ctx.fillStyle = '#f9a825';
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.15)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();

      ctx.restore();
    }

    // =====================================================================
    // SWORD SWING
    // =====================================================================
    const sword  = { swinging: false, angle: 0, baseAngle: 0, timer: 0, facingRight: true };
    const sword2 = { swinging: false, angle: 0, baseAngle: 0, timer: 0, facingRight: true }; // mirror blade at 5★
    const SWORD_RANGE = 90;
    const SWORD_ARC   = Math.PI * 1.1;

    // Hit a single arc against all monsters; returns indices killed (for shared kill logic)
    function swordArcHit(baseAngle, range, maxed) {
      for (let j = monsters.length - 1; j >= 0; j--) {
        const m = monsters[j];
        const dx = m.x - egg.x, dy = m.y - egg.y;
        if (Math.sqrt(dx*dx + dy*dy) < range + m.r) {
          let diff = Math.atan2(dy, dx) - baseAngle;
          while (diff >  Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          if (Math.abs(diff) < SWORD_ARC / 2 + 0.2) {
            if (maxed) {
              if (m.golden) dropWeaponAt(m.x, m.y);
              spawnDeathParticles(m.x, m.y, m.color);
              spawnDeathParticles(m.x, m.y, '#44aaff');
              onKill(m);
              monsters.splice(j, 1);
            } else {
              m.hp--;
              if (m.hp <= 0) {
                if (m.golden) dropWeaponAt(m.x, m.y);
                spawnDeathParticles(m.x, m.y, m.color);
                onKill(m);
                monsters.splice(j, 1);
              } else {
                m.hitFlash = 1.0;
              }
            }
          }
        }
      }
    }

    function swordSwing() {
      if (sword.swinging) return;
      const facingRight = egg.aimDX >= 0;
      const tiltAngle   = Math.atan2(egg.aimDY, Math.abs(egg.aimDX) || 0.01);
      const baseAngle   = facingRight ? tiltAngle : Math.PI - tiltAngle;
      const maxed       = isMaxStar();
      const range       = maxed ? SWORD_RANGE * 2.5 : SWORD_RANGE;

      // Primary sword — remember which way we were facing
      sword.swinging    = true;
      sword.timer       = 0;
      sword.baseAngle   = baseAngle;
      sword.angle       = baseAngle - SWORD_ARC / 2;
      sword.facingRight = facingRight;
      swordArcHit(baseAngle, range, maxed);

      // 5★: launch mirror sword in the opposite arc simultaneously
      if (maxed) {
        const mirrorBase    = baseAngle + Math.PI; // 180° opposite
        sword2.swinging     = true;
        sword2.timer        = 0;
        sword2.baseAngle    = mirrorBase;
        sword2.angle        = mirrorBase - SWORD_ARC / 2;
        sword2.facingRight  = facingRight;
        swordArcHit(mirrorBase, range, maxed);
      }
    }

    function updateSword(dt) {
      if (sword.swinging) {
        sword.timer += dt * 0.1;
        sword.angle  = sword.baseAngle - SWORD_ARC / 2 + SWORD_ARC * Math.min(sword.timer, 1);
        if (sword.timer >= 1) sword.swinging = false;
      }
      if (sword2.swinging) {
        sword2.timer += dt * 0.1;
        sword2.angle  = sword2.baseAngle - SWORD_ARC / 2 + SWORD_ARC * Math.min(sword2.timer, 1);
        if (sword2.timer >= 1) sword2.swinging = false;
      }
    }

    // Draw one sword blade — electric blue at 5★, gold otherwise
    function drawOneSword(sw, maxed, isSecond) {
      const r = maxed ? SWORD_RANGE * 2.5 : SWORD_RANGE;
      const bladeCol   = maxed ? '#44bbff' : '#c8c8ff';
      const guardCol   = maxed ? '#0066ff' : '#ffd700';
      const armCol     = maxed ? '#2288ff' : '#f9a825';
      const arcFill    = maxed ? 'rgba(40,140,255,0.11)' : 'rgba(255,215,0,0.09)';

      if (sw.swinging) {
        const startA = sw.baseAngle - SWORD_ARC / 2;
        // The pivot side depends on which way the egg was facing when the swing started
        const fr = sw.facingRight;
        const pivotX = fr ? egg.rx - 4 : -(egg.rx - 4);

        // Arc sweep fill
        ctx.beginPath(); ctx.moveTo(0, 0);
        ctx.arc(0, 0, r, startA, sw.angle);
        ctx.closePath();
        ctx.fillStyle = arcFill; ctx.fill();

        // Electric arc trail along the sweep edge (5★ only)
        if (maxed) {
          ctx.save();
          ctx.beginPath();
          ctx.arc(0, 0, r, startA, sw.angle);
          ctx.strokeStyle = `rgba(100,200,255,0.55)`;
          ctx.lineWidth = 6;
          ctx.stroke();
          ctx.beginPath();
          ctx.arc(0, 0, r * 0.7, startA, sw.angle);
          ctx.strokeStyle = `rgba(180,230,255,0.18)`;
          ctx.lineWidth = 3;
          ctx.stroke();
          ctx.restore();
        }

        // Blade at current sweep angle — pivot from correct side
        ctx.save(); ctx.rotate(sw.angle);
        const dir = fr ? 1 : -1;
        const px  = egg.rx * dir;
        // Arm from body edge outward
        ctx.beginPath(); ctx.moveTo(px - dir * 4, 2); ctx.lineTo(px + dir * 10, 2);
        ctx.strokeStyle = armCol; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.stroke();
        // Blade tip
        const bladeStart = px + dir * 10;
        const bladeEnd   = px + dir * (maxed ? 72 : 55);
        ctx.beginPath(); ctx.moveTo(bladeStart, 0); ctx.lineTo(bladeEnd, -4);
        ctx.strokeStyle = bladeCol; ctx.lineWidth = maxed ? 5 : 4;
        if (maxed) { ctx.shadowColor = '#44aaff'; ctx.shadowBlur = 14; }
        ctx.stroke(); ctx.shadowBlur = 0;
        // Guard
        const guardX = px + dir * 12;
        ctx.beginPath(); ctx.moveTo(guardX, -10); ctx.lineTo(guardX, 11);
        ctx.strokeStyle = guardCol; ctx.lineWidth = maxed ? 6 : 5; ctx.stroke();
        // Blade shine
        ctx.beginPath(); ctx.moveTo(px + dir * 15, -2); ctx.lineTo(px + dir * (maxed ? 65 : 48), -3);
        ctx.strokeStyle = 'rgba(255,255,255,0.65)'; ctx.lineWidth = 1.5; ctx.stroke();
        // 5★: lightning crackle on blade
        if (maxed) {
          ctx.strokeStyle = 'rgba(180,240,255,0.85)';
          ctx.lineWidth = 1;
          ctx.beginPath();
          const bstart = px + dir * 14;
          for (let seg = 0; seg < 5; seg++) {
            const lx = bstart + dir * seg * 11;
            seg === 0 ? ctx.moveTo(lx, 0) : ctx.lineTo(lx, 0);
            ctx.lineTo(lx + dir * 4, (Math.random() - 0.5) * 10);
            ctx.lineTo(lx + dir * 8, (Math.random() - 0.5) * 6);
          }
          ctx.stroke();
        }
        ctx.restore();
      } else {
        // Idle pose — sword held on the correct side
        const facingRight = egg.aimDX >= 0;
        const tiltAngle   = Math.atan2(egg.aimDY, Math.abs(egg.aimDX) || 0.01);
        ctx.save();
        if (isSecond) {
          // Second sword: held behind, pointing backward
          ctx.translate(facingRight ? -(egg.rx - 2) : (egg.rx - 2), 2);
          ctx.scale(facingRight ? -1 : 1, 1);
        } else {
          // Primary: on the arm side matching facing direction
          ctx.translate(facingRight ? egg.rx - 2 : -(egg.rx - 2), 2);
          if (!facingRight) ctx.scale(-1, 1);
        }
        ctx.rotate(tiltAngle);
        // Arm
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(12,0);
        ctx.strokeStyle = armCol; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.stroke();
        // Blade
        ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(maxed ? 66 : 50, -3);
        ctx.strokeStyle = bladeCol; ctx.lineWidth = maxed ? 5 : 3.5;
        if (maxed) { ctx.shadowColor = '#44aaff'; ctx.shadowBlur = 12; }
        ctx.stroke(); ctx.shadowBlur = 0;
        // Guard
        ctx.beginPath(); ctx.moveTo(14, -9); ctx.lineTo(14, 10);
        ctx.strokeStyle = guardCol; ctx.lineWidth = maxed ? 6 : 4; ctx.stroke();
        // 5★ legendary label on idle blade
        if (maxed) {
          ctx.save();
          ctx.font = 'bold 8px monospace';
          ctx.fillStyle = '#44aaff';
          ctx.shadowColor = '#44aaff'; ctx.shadowBlur = 8;
          ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText('LEGENDARY', 30, -8);
          ctx.shadowBlur = 0;
          ctx.restore();
        }
        ctx.restore();
      }
    }

    function drawSwordArm() {
      const maxed = isMaxStar();
      ctx.save();
      ctx.translate(egg.x, egg.y);
      drawOneSword(sword, maxed, false);
      if (maxed) drawOneSword(sword2, maxed, true);
      ctx.restore();
    }

    // =====================================================================
    // WEAPON DROPS (from golden zombies)
    // =====================================================================
    const drops = []; // { x, y, weaponId, bobAngle, life }

    function dropWeaponAt(x, y) {
      const id = LOOT_POOL[Math.floor(Math.random() * LOOT_POOL.length)];
      drops.push({ x, y, weaponId: id, bobAngle: 0, life: 1.0 });
    }

    function updateDrops(dt) {
      for (let i = drops.length - 1; i >= 0; i--) {
        const d = drops[i];
        d.bobAngle += 0.05 * dt;
        d.life -= 0.002 * dt; // fade very slowly
        // Pickup if player walks over it
        const dx = egg.x - d.x, dy = egg.y - d.y;
        if (Math.sqrt(dx*dx + dy*dy) < egg.rx + 18) {
          grantWeapon(d.weaponId);
          drops.splice(i, 1);
        }
      }
    }

    function drawDrops() {
      for (const d of drops) {
        const bobY = Math.sin(d.bobAngle) * 5;
        const w = WEAPONS[d.weaponId];
        ctx.save();
        ctx.translate(d.x, d.y + bobY);
        // Glow
        const grd = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
        const gc = w.rarity === 'legend' ? '255,215,0' : w.rarity === 'epic' ? '180,80,255' : '80,150,255';
        grd.addColorStop(0, `rgba(${gc},0.35)`);
        grd.addColorStop(1, 'transparent');
        ctx.beginPath(); ctx.arc(0, 0, 22, 0, Math.PI * 2);
        ctx.fillStyle = grd; ctx.fill();
        // Icon
        ctx.font = '20px serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(w.icon, 0, 0);
        // Label
        ctx.font = '8px monospace';
        ctx.fillStyle = '#ffd700';
        ctx.fillText(w.name, 0, 16);
        ctx.restore();
      }
    }

    // =====================================================================
    // BULLETS
    // =====================================================================
    const bullets = [];

    function shootBullet() {
      const w = equippedWeapon();
      if (!w) return;
      if (w.type === 'melee') { swordSwing(); return; }

      const facingRight = egg.aimDX >= 0;
      const tiltAngle   = Math.atan2(egg.aimDY, Math.abs(egg.aimDX) || 0.01);
      const fireAngle   = facingRight ? tiltAngle : Math.PI - tiltAngle;
      const armPivotX   = egg.x + (facingRight ? egg.rx - 2 : -(egg.rx - 2));
      const armPivotY   = egg.y + 2;
      const bx = armPivotX + Math.cos(fireAngle) * 32;
      const by = armPivotY + Math.sin(fireAngle) * 32;
      const speed  = w.id === 'rpg' ? 18 : w.id === 'bazooka' ? 10 : 14;
      const radius = w.id === 'rpg' ? 150 : w.id === 'bazooka' ? 210 : 110;
      // 5★ RPG/Bazooka fires shark rockets
      const isSharkWeapon = (w.id === 'rpg' || w.id === 'bazooka') && equippedStars() >= 5;
      bullets.push({ x: bx, y: by,
        vx: Math.cos(fireAngle) * speed,
        vy: Math.sin(fireAngle) * speed,
        life: 1.0, dist: 0, bomb: true,
        weaponId: w.id, blastRadius: radius,
        shark: isSharkWeapon,
      });
      egg.muzzleFlash = 1.0;
      egg.recoil = 1.0;
    }

    const BOMB_RADIUS = 110; // fallback

    function explodeBomb(bx, by, radius) {
      const r = radius || BOMB_RADIUS;
      // 5-star bomb_gun: blast radius doubles AND spawns a dinosaur ally
      const maxed    = isMaxStar();
      const isBombGun = (inventory.slots[inventory.equipped] && inventory.slots[inventory.equipped].weapon.id === 'bomb_gun');
      const effectR  = maxed ? r * 2 : r;
      let killedAny = false;
      for (let j = monsters.length - 1; j >= 0; j--) {
        const m = monsters[j];
        const dx = bx - m.x, dy = by - m.y;
        if (Math.sqrt(dx*dx + dy*dy) < effectR + m.r) {
          if (maxed) {
            // Insta-kill
            if (m.golden) dropWeaponAt(m.x, m.y);
            spawnDeathParticles(m.x, m.y, m.color);
            spawnDeathParticles(m.x, m.y, '#ffd700');
            onKill(m);
            monsters.splice(j, 1);
            killedAny = true;
          } else {
            m.hp--;
            if (m.hp <= 0) {
              if (m.golden) dropWeaponAt(m.x, m.y);
              spawnDeathParticles(m.x, m.y, m.color);
              onKill(m);
              monsters.splice(j, 1);
              killedAny = true;
            } else {
              m.hitFlash = 1.0;
            }
          }
        }
      }
      // 5-star bomb_gun: ALWAYS spawn a dino at the blast site (unless truck is active)
      if (maxed && isBombGun && !dinosDisabled) {
        spawnDino(bx, by);
      }
      // Big explosion particle burst
      for (let i = 0; i < 28; i++) {
        const a = (i / 28) * Math.PI * 2;
        const spd = 3 + Math.random() * 7;
        deathParticles.push({
          x: bx, y: by,
          vx: Math.cos(a) * spd,
          vy: Math.sin(a) * spd,
          life: 1.0,
          r: 5 + Math.random() * 8,
          color: ['#ff6600','#ffcc00','#ff3300'][Math.floor(Math.random()*3)],
        });
      }
      // Shockwave ring stored separately
      shockwaves.push({ x: bx, y: by, r: 10, life: 1.0 });
    }

    // Shockwave rings
    const shockwaves = [];
    function updateShockwaves(dt) {
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.r += 6 * dt;
        s.life -= 0.06 * dt;
        if (s.life <= 0) shockwaves.splice(i, 1);
      }
    }
    function drawShockwaves() {
      for (const s of shockwaves) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,200,50,${s.life * 0.7})`;
        ctx.lineWidth = 3 * s.life;
        ctx.stroke();
        // Second ring slightly smaller
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r * 0.65, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255,100,0,${s.life * 0.4})`;
        ctx.lineWidth = 2 * s.life;
        ctx.stroke();
      }
    }

    function updateBullets(dt) {
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        const step = Math.sqrt(b.vx * b.vx + b.vy * b.vy) * dt;
        b.x += b.vx * dt;
        b.y += b.vy * dt;
        b.dist += step;
        b.life -= 0.018 * dt;
        if (b.life <= 0 || b.x < -20 || b.x > canvas.width + 20 || b.y < -20 || b.y > canvas.height + 20) {
          if (b.bomb) explodeBomb(b.x, b.y, b.blastRadius);
          bullets.splice(i, 1);
          continue;
        }
        // Hit monsters
        let hit = false;
        for (let j = monsters.length - 1; j >= 0; j--) {
          const m = monsters[j];
          const dx = b.x - m.x, dy = b.y - m.y;
          if (Math.sqrt(dx*dx + dy*dy) < m.r + (b.bomb ? 14 : 8)) {
            if (b.bomb) {
              explodeBomb(b.x, b.y, b.blastRadius);
            } else {
              spawnDeathParticles(m.x, m.y, m.color);
              monsters.splice(j, 1);
            }
            bullets.splice(i, 1);
            hit = true;
            break;
          }
        }
      }
    }

    function drawBullets() {
      for (const b of bullets) {
        const growScale = Math.min(1, b.dist / 600);

        if (b.weaponId === 'rpg' || b.weaponId === 'bazooka') {
          const isRpg   = b.weaponId === 'rpg';
          const isShark = b.shark === true;
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(Math.atan2(b.vy, b.vx));

          if (isShark) {
            // ---- SHARK ROCKET (5★ RPG or Bazooka) ----
            const sz = isRpg ? 1.0 : 1.5; // bazooka is bigger
            // Bubble trail (blue/cyan)
            const trailLen = (isRpg ? 30 : 45) + growScale * 25;
            const trailGrd = ctx.createLinearGradient(-trailLen, 0, 0, 0);
            trailGrd.addColorStop(0, 'transparent');
            trailGrd.addColorStop(0.5, `rgba(0,150,255,${b.life * 0.5})`);
            trailGrd.addColorStop(1, `rgba(0,220,255,${b.life * 0.9})`);
            for (let t = 0; t <= 1; t += 0.15) {
              const bx2 = -trailLen * t;
              const by2 = Math.sin(t * Math.PI * 4 + b.dist * 0.4) * 4 * t;
              ctx.beginPath(); ctx.arc(bx2, by2, (1.5 + Math.random() * 2) * b.life, 0, Math.PI*2);
              ctx.fillStyle = `rgba(0,200,255,${(1-t) * b.life * 0.5})`; ctx.fill();
            }
            // Shark body torpedo
            ctx.fillStyle = '#2255aa';
            ctx.beginPath(); ctx.roundRect(-14*sz, -5*sz, 30*sz, 10*sz, 5*sz); ctx.fill();
            ctx.fillStyle = '#4488ee';
            ctx.beginPath(); ctx.roundRect(-13*sz, -4*sz, 28*sz, 4*sz, 3*sz); ctx.fill();
            // Dorsal fin
            ctx.fillStyle = '#1a4488';
            ctx.beginPath();
            ctx.moveTo(-2*sz, -5*sz); ctx.lineTo(3*sz, -14*sz); ctx.lineTo(8*sz, -5*sz);
            ctx.closePath(); ctx.fill();
            // Snout / nose
            ctx.fillStyle = '#ddeeff';
            ctx.beginPath();
            ctx.moveTo(16*sz, -4*sz); ctx.lineTo(26*sz, 0); ctx.lineTo(16*sz, 4*sz);
            ctx.closePath(); ctx.fill();
            // Teeth
            ctx.fillStyle = '#fff';
            for (let tk = 0; tk < 3; tk++) {
              ctx.beginPath();
              ctx.moveTo(11*sz + tk*3*sz, -2*sz); ctx.lineTo(12.5*sz + tk*3*sz, 0);
              ctx.lineTo(14*sz + tk*3*sz, -2*sz); ctx.closePath(); ctx.fill();
            }
            // Tail fin (back)
            ctx.fillStyle = '#2255aa';
            ctx.beginPath();
            ctx.moveTo(-14*sz, -2*sz); ctx.lineTo(-22*sz, -8*sz);
            ctx.lineTo(-20*sz, 0); ctx.lineTo(-22*sz, 8*sz); ctx.lineTo(-14*sz, 2*sz);
            ctx.closePath(); ctx.fill();
            // Eye
            ctx.beginPath(); ctx.arc(7*sz, -1*sz, 2.5*sz, 0, Math.PI*2);
            ctx.fillStyle = '#111'; ctx.fill();
            ctx.beginPath(); ctx.arc(6.5*sz, -1.5*sz, 0.8*sz, 0, Math.PI*2);
            ctx.fillStyle = '#fff'; ctx.fill();
          } else {
            // ---- Normal rocket projectile ----
            const trailLen = isRpg ? 30 + growScale * 20 : 40 + growScale * 30;
            const trailGrd = ctx.createLinearGradient(-trailLen, 0, 0, 0);
            trailGrd.addColorStop(0, 'transparent');
            trailGrd.addColorStop(0.5, `rgba(255,100,0,${b.life * 0.5})`);
            trailGrd.addColorStop(1, `rgba(255,220,50,${b.life * 0.9})`);
            ctx.beginPath();
            for (let t = 0; t <= 1; t += 0.1) {
              const tx = -trailLen * t;
              const ty = Math.sin(t * Math.PI * 3 + b.dist * 0.3) * (isRpg ? 3 : 5) * t;
              t === 0 ? ctx.moveTo(tx, ty) : ctx.lineTo(tx, ty);
            }
            ctx.lineWidth = isRpg ? 6 : 9;
            ctx.strokeStyle = trailGrd; ctx.lineCap = 'round'; ctx.stroke();
            const bodyLen = isRpg ? 22 : 30;
            const bodyH   = isRpg ? 5  : 8;
            ctx.fillStyle = isRpg ? '#555' : '#8B4513';
            ctx.beginPath(); ctx.roundRect(-bodyLen*0.6, -bodyH/2, bodyLen, bodyH, bodyH*0.3); ctx.fill();
            ctx.fillStyle = isRpg ? '#777' : '#a0522d';
            ctx.beginPath(); ctx.roundRect(-bodyLen*0.6, -bodyH/2, bodyLen*0.7, bodyH*0.5, 2); ctx.fill();
            ctx.fillStyle = isRpg ? '#cc3300' : '#cc6600';
            ctx.beginPath();
            const noseX = bodyLen * 0.4;
            ctx.moveTo(noseX, 0); ctx.lineTo(noseX - bodyLen*0.3, -bodyH/2);
            ctx.lineTo(noseX - bodyLen*0.3, bodyH/2); ctx.closePath(); ctx.fill();
            ctx.fillStyle = isRpg ? '#333' : '#5a2d0c';
            const finX = -bodyLen * 0.55;
            [[-bodyH, -bodyH*1.6],[bodyH*0.1, bodyH*1.6]].forEach(([y1, y2]) => {
              ctx.beginPath(); ctx.moveTo(finX, y1); ctx.lineTo(finX - bodyLen*0.25, y2);
              ctx.lineTo(finX + bodyLen*0.15, y1); ctx.closePath(); ctx.fill();
            });
          }

          // Blast radius ring (faint dashed) — always shown
          ctx.beginPath(); ctx.arc(0, 0, b.blastRadius, 0, Math.PI * 2);
          ctx.strokeStyle = isShark ? `rgba(0,150,255,0.1)` : `rgba(255,100,0,0.07)`;
          ctx.lineWidth = 1; ctx.setLineDash([5, 8]); ctx.stroke(); ctx.setLineDash([]);
          ctx.restore();

        } else if (b.bomb) {
          // ---- Bomb Gun: round dark casing ----
          const r = 6 + growScale * 8;
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.beginPath();
          ctx.arc(0, 0, r, 0, Math.PI * 2);
          ctx.fillStyle = '#222'; ctx.fill();
          ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5; ctx.stroke();
          ctx.beginPath();
          ctx.arc(-r * 0.3, -r * 0.3, r * 0.25, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fill();
          ctx.beginPath();
          ctx.arc(r * 0.5, -r * 0.7, 2 + Math.random() * 2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255,${150 + Math.random()*100|0},0,${b.life})`; ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 0, b.blastRadius || BOMB_RADIUS, 0, Math.PI * 2);
          ctx.strokeStyle = `rgba(255,100,0,0.1)`; ctx.lineWidth = 1;
          ctx.setLineDash([4, 6]); ctx.stroke(); ctx.setLineDash([]);
          ctx.restore();
        } else {
          // Normal bullet — glowing, grows
          const headR = 3 + growScale * 9;
          const tailLen = 10 + growScale * 30;
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(Math.atan2(b.vy, b.vx));
          const grad = ctx.createLinearGradient(-tailLen, 0, headR, 0);
          grad.addColorStop(0, 'transparent');
          grad.addColorStop(1, `rgba(255,220,60,${b.life})`);
          ctx.beginPath();
          ctx.roundRect(-tailLen, -headR * 0.5, tailLen + headR, headR, headR * 0.4);
          ctx.fillStyle = grad;
          ctx.fill();
          ctx.beginPath();
          ctx.arc(0, 0, headR, 0, Math.PI * 2);
          const hgrad = ctx.createRadialGradient(0, 0, 0, 0, 0, headR);
          hgrad.addColorStop(0, `rgba(255,255,180,${b.life})`);
          hgrad.addColorStop(1, `rgba(255,180,0,${b.life * 0.6})`);
          ctx.fillStyle = hgrad;
          ctx.fill();
          ctx.restore();
        }
      }
    }

    // --- Monsters ---
    const monsters = [];
    let monsterSpawnTimer = 0;
    const SPAWN_INTERVAL = 120; // base; overridden by SPAWN_INTERVAL_CURRENT

    // Per-run random enemy variant (0-5) for color palette variety
    const runEnemyVariant = Math.floor(Math.random() * 6);

    // Wave tier → zombie shape: theme-aware
    function waveShape() {
      const t = Math.min(wave.number, 6);
      if (activeTheme === 'sonic') {
        return ['eggbot','eggbot','eggbot','eggbot2','eggbot3','eggman_mini','eggman_mech'][t];
      }
      if (activeTheme === 'backrooms') {
        return ['wanderer','wanderer','wanderer','smiler','skin_stealer','partygoer','entity'][t];
      }
      if (activeTheme === 'minecraft') {
        return ['zombie','zombie','skeleton','creeper','spider_mc','enderman','wither'][t];
      }
      return ['blob','blob','skull','spider','phantom','demon','abomination'][t];
    }

    function spawnMonster() {
      if (wave.phase !== 'fighting') return;
      if (monsters.filter(m => !m.boss).length >= 12) return;
      const y = 60 + Math.random() * (canvas.height - 120);
      const isGolden = Math.random() < 0.25;
      // Colors get darker/sicker each wave tier
      const tierCols = [
        ['#6a0dad','#c0392b','#1a7a1a','#1a4a8a'],   // w1 blob
        ['#555','#777','#333','#444'],                 // w2 skull
        ['#1a1a00','#2a1a00','#1a2200','#001a1a'],     // w3 spider
        ['#330033','#001133','#330011','#003333'],      // w4 phantom
        ['#660000','#440022','#220044','#002200'],      // w5 demon
        ['#000','#111','#0a000a','#000a00'],            // w6+ abomination
      ];
      const tier = Math.min(wave.number - 1, 5);
      const pallete = tierCols[tier];
      const color = isGolden ? '#d4a017' : pallete[(Math.floor(Math.random() * pallete.length) + runEnemyVariant) % pallete.length];
      const baseHp = isGolden ? 2 : 1;
      const shape = waveShape();
      monsters.push({
        x: -30, y,
        r: isGolden ? 22 + Math.random() * 6 : 18 + Math.random() * 10,
        speed: (isGolden ? 0.9 + Math.random() * 0.8 : 1.2 + Math.random() * 1.4) * monsterSpeedMult,
        color, bobAngle: Math.random() * Math.PI * 2,
        hp: baseHp * monsterHpMult, maxHp: baseHp * monsterHpMult,
        golden: isGolden, boss: false, hitFlash: 0, shape,
      });
    }

    function spawnBoss() {
      wave.bossAlive = true;
      const y = canvas.height / 2;
      // Boss colour escalates each wave — blood red → void black → toxic green → cosmic purple
      const bossHues = ['#8B0000','#4B0082','#006400','#00008B','#4a0000','#1a001a','#000','#220011'];
      const color = bossHues[(wave.number - 1) % bossHues.length];
      const hp = (5 + wave.number * 5) * monsterHpMult;
      const shape = waveShape();
      monsters.push({
        x: -60, y,
        r: Math.min(45 + wave.number * 6, 120),
        speed: (0.6 + wave.number * 0.12) * monsterSpeedMult,
        color, bobAngle: 0,
        hp, maxHp: hp,
        golden: false, boss: true, hitFlash: 0, shape,
      });
    }

    function getBossName() {
      if (activeTheme === 'sonic') return 'DR. EGGMAN';
      if (activeTheme === 'backrooms') return 'THE ENTITY';
      if (activeTheme === 'minecraft') {
        const names = ['ZOMBIE KING','SKELETON LORD','CREEPER PRIME','SPIDER QUEEN','ENDERMAN KING','WITHER','WITHER'];
        return names[Math.min(wave.number - 1, names.length - 1)];
      }
      const names = ['BLOB BOSS','SKULL BOSS','SPIDER BOSS','PHANTOM BOSS','DEMON BOSS','ABOMINATION'];
      return names[Math.min(wave.number - 1, names.length - 1)];
    }

    function updateMonsters(dt) {
      monsterSpawnTimer += dt;
      if (monsterSpawnTimer >= SPAWN_INTERVAL_CURRENT) {
        monsterSpawnTimer = 0;
        spawnMonster();
      }

      for (const m of monsters) {
        const dx = egg.x - m.x, dy = egg.y - m.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        m.x += (dx / dist) * m.speed * dt;
        m.y += (dy / dist) * m.speed * dt;
        m.bobAngle += 0.08 * dt;
        if (m.hitFlash > 0) m.hitFlash = Math.max(0, m.hitFlash - 0.08 * dt);
      }
    }

    function drawMonster(m) {
      const bob = Math.sin(m.bobAngle) * 2;
      ctx.save();
      ctx.translate(m.x, m.y + bob);

      const shape = m.shape || 'blob';
      const f = m.hitFlash;
      const c1 = f > 0 ? `rgba(255,255,255,${f})` : lighten(m.color);
      const c2 = f > 0 ? `rgba(220,220,220,${f})` : m.color;
      const lw =  Math.sin(m.bobAngle * 2.5) * 0.7;
      const rw = -Math.sin(m.bobAngle * 2.5 + 1) * 0.7;

      // ---- Arms (all shapes share waving arms) ----
      ctx.lineCap = 'round';
      const armCount = shape === 'spider' ? 6 : 2;
      for (let a = 0; a < armCount; a++) {
        const side = a % 2 === 0 ? -1 : 1;
        const wave2 = side > 0 ? rw + 0.5 : lw - 0.5;
        const extraAngle = armCount > 2 ? (a - armCount/2 + 0.5) * 0.5 : 0;
        ctx.save();
        ctx.translate(side * m.r * 0.85, -m.r * 0.1);
        ctx.rotate(wave2 + extraAngle);
        ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(side * m.r * 0.7, -m.r * 0.5);
        ctx.strokeStyle = m.color; ctx.lineWidth = m.r * (shape==='spider'?0.18:0.35); ctx.stroke();
        ctx.beginPath(); ctx.arc(side * m.r * 0.7, -m.r * 0.5, m.r * (shape==='spider'?0.12:0.22), 0, Math.PI*2);
        ctx.fillStyle = lighten(m.color); ctx.fill();
        ctx.restore();
      }

      // ---- Body by shape ----
      if (shape === 'skull') {
        // Rounded skull shape
        const grad = ctx.createRadialGradient(-m.r*0.2,-m.r*0.2,2,0,0,m.r*1.2);
        grad.addColorStop(0,'#e0e0e0'); grad.addColorStop(1,'#888');
        ctx.beginPath(); ctx.arc(0,-m.r*0.05,m.r,0,Math.PI*2);
        ctx.fillStyle = f>0?c1:grad; ctx.fill();
        ctx.strokeStyle='#333'; ctx.lineWidth=1.5; ctx.stroke();
        // Jaw
        ctx.beginPath(); ctx.moveTo(-m.r*0.55,m.r*0.2); ctx.lineTo(-m.r*0.55,m.r*0.7);
        ctx.lineTo(m.r*0.55,m.r*0.7); ctx.lineTo(m.r*0.55,m.r*0.2);
        ctx.fillStyle=f>0?c2:'#aaa'; ctx.fill(); ctx.strokeStyle='#333'; ctx.lineWidth=1.5; ctx.stroke();
        // Hollow eye sockets
        ctx.fillStyle=f>0?`rgba(0,0,0,${f})`:'#111';
        ctx.beginPath(); ctx.ellipse(-m.r*0.28,-m.r*0.15,m.r*0.18,m.r*0.22,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse( m.r*0.28,-m.r*0.15,m.r*0.18,m.r*0.22,0,0,Math.PI*2); ctx.fill();
        // Red glow in sockets
        ctx.fillStyle=`rgba(255,0,0,${0.5+0.3*Math.sin(m.bobAngle*3)})`;
        ctx.beginPath(); ctx.ellipse(-m.r*0.28,-m.r*0.15,m.r*0.08,m.r*0.10,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse( m.r*0.28,-m.r*0.15,m.r*0.08,m.r*0.10,0,0,Math.PI*2); ctx.fill();
        // Teeth
        ctx.fillStyle='#fff';
        for(let t=0;t<5;t++){
          ctx.beginPath(); ctx.rect(-m.r*0.4+t*m.r*0.2, m.r*0.28, m.r*0.14, m.r*0.2); ctx.fill();
          ctx.strokeStyle='#555'; ctx.lineWidth=0.8; ctx.stroke();
        }

      } else if (shape === 'spider') {
        // Low wide body
        const grad = ctx.createRadialGradient(0,0,2,0,0,m.r);
        grad.addColorStop(0,'#222'); grad.addColorStop(1,'#000');
        ctx.beginPath(); ctx.ellipse(0,0,m.r*1.3,m.r*0.7,0,0,Math.PI*2);
        ctx.fillStyle=f>0?c1:grad; ctx.fill(); ctx.strokeStyle='#111'; ctx.lineWidth=1.5; ctx.stroke();
        // Eyes — 8 red dots
        const eyePos=[[-0.4,-0.3],[-0.15,-0.45],[0.15,-0.45],[0.4,-0.3],[-0.35,0.0],[0.35,0.0],[-0.2,0.2],[0.2,0.2]];
        eyePos.forEach(([ex,ey])=>{
          ctx.beginPath(); ctx.arc(ex*m.r,ey*m.r,m.r*0.09,0,Math.PI*2);
          ctx.fillStyle=`rgba(255,0,0,${0.7+0.3*Math.sin(m.bobAngle*4)})`; ctx.fill();
        });
        // Fangs
        ctx.fillStyle='#ddd';
        ctx.beginPath(); ctx.moveTo(-m.r*0.12,m.r*0.3); ctx.lineTo(-m.r*0.22,m.r*0.6); ctx.lineTo(0,m.r*0.3); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(m.r*0.12,m.r*0.3); ctx.lineTo(m.r*0.22,m.r*0.6); ctx.lineTo(0,m.r*0.3); ctx.closePath(); ctx.fill();

      } else if (shape === 'phantom') {
        // Wispy cloak
        const grad = ctx.createRadialGradient(0,-m.r*0.1,2,0,0,m.r*1.4);
        grad.addColorStop(0,f>0?'rgba(255,255,255,0.9)':'rgba(120,0,180,0.9)');
        grad.addColorStop(0.7,f>0?`rgba(255,255,255,${f*0.5})`:'rgba(60,0,100,0.5)');
        grad.addColorStop(1,'transparent');
        ctx.beginPath(); ctx.arc(0,0,m.r*1.4,0,Math.PI*2);
        ctx.fillStyle=grad; ctx.fill();
        // Torn bottom edge
        ctx.beginPath(); ctx.moveTo(-m.r,m.r*0.3);
        for(let i=0;i<=8;i++){
          const wx=-m.r+i*m.r*0.25;
          const wy=m.r*0.4+Math.sin(m.bobAngle*2+i)*m.r*0.35*(i%2===0?1:-0.6);
          ctx.lineTo(wx,wy);
        }
        ctx.lineTo(m.r,m.r*0.3); ctx.closePath();
        ctx.fillStyle=f>0?'rgba(255,255,255,0.3)':'rgba(40,0,70,0.6)'; ctx.fill();
        // Glowing white eyes
        ctx.fillStyle=`rgba(255,255,255,${0.8+0.2*Math.sin(m.bobAngle*3)})`;
        ctx.beginPath(); ctx.ellipse(-m.r*0.28,-m.r*0.12,m.r*0.13,m.r*0.18,0,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse( m.r*0.28,-m.r*0.12,m.r*0.13,m.r*0.18,0,0,Math.PI*2); ctx.fill();

      } else if (shape === 'demon') {
        // Angular horned body
        const grad = ctx.createRadialGradient(-m.r*0.3,-m.r*0.3,2,0,0,m.r*1.2);
        grad.addColorStop(0,f>0?'#fff':'#880000'); grad.addColorStop(1,f>0?'#ccc':'#330000');
        ctx.beginPath(); ctx.arc(0,0,m.r,0,Math.PI*2);
        ctx.fillStyle=grad; ctx.fill(); ctx.strokeStyle='#220000'; ctx.lineWidth=2; ctx.stroke();
        // Horns
        ctx.fillStyle=f>0?'#fff':'#cc2200';
        ctx.beginPath(); ctx.moveTo(-m.r*0.3,-m.r); ctx.lineTo(-m.r*0.55,-m.r*1.8); ctx.lineTo(-m.r*0.05,-m.r); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo( m.r*0.3,-m.r); ctx.lineTo( m.r*0.55,-m.r*1.8); ctx.lineTo( m.r*0.05,-m.r); ctx.closePath(); ctx.fill();
        // Eyes — vertical slits
        ctx.fillStyle=f>0?'#fff':'#ff4400';
        ctx.beginPath(); ctx.ellipse(-m.r*0.28,-m.r*0.12,m.r*0.1,m.r*0.2,-0.2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse( m.r*0.28,-m.r*0.12,m.r*0.1,m.r*0.2, 0.2,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#000';
        ctx.beginPath(); ctx.ellipse(-m.r*0.28,-m.r*0.12,m.r*0.03,m.r*0.15,-0.2,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.ellipse( m.r*0.28,-m.r*0.12,m.r*0.03,m.r*0.15, 0.2,0,Math.PI*2); ctx.fill();
        // Fanged grin
        ctx.beginPath(); ctx.arc(0,m.r*0.2,m.r*0.35,0.1,Math.PI-0.1); ctx.strokeStyle='rgba(0,0,0,0.7)'; ctx.lineWidth=2; ctx.stroke();
        ctx.fillStyle='#eee';
        [-0.25,-0.08,0.08,0.25].forEach(tx=>{
          ctx.beginPath(); ctx.moveTo(tx*m.r,m.r*0.22); ctx.lineTo(tx*m.r,m.r*0.46); ctx.lineTo((tx+0.09)*m.r,m.r*0.22); ctx.closePath(); ctx.fill();
        });

      } else if (shape === 'abomination') {
        // Asymmetric mutant blob with tentacle stumps
        const grad = ctx.createRadialGradient(-m.r*0.2,-m.r*0.2,2,0,0,m.r*1.3);
        grad.addColorStop(0,f>0?'#fff':'#001a00'); grad.addColorStop(0.5,f>0?'#ccc':'#002200'); grad.addColorStop(1,'#000');
        // Pulsing irregular body
        ctx.beginPath();
        for(let ang=0;ang<Math.PI*2;ang+=Math.PI/8){
          const rr=m.r*(0.8+0.35*Math.sin(ang*3+m.bobAngle*2));
          ang===0?ctx.moveTo(Math.cos(ang)*rr,Math.sin(ang)*rr):ctx.lineTo(Math.cos(ang)*rr,Math.sin(ang)*rr);
        }
        ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
        ctx.strokeStyle=f>0?'rgba(200,255,200,0.5)':'rgba(0,80,0,0.5)'; ctx.lineWidth=2; ctx.stroke();
        // Many glowing eyes (5 random-ish positions)
        [[-.35,-.25],[.35,-.2],[0,-.45],[-.2,.1],[.25,.15]].forEach(([ex,ey],i)=>{
          ctx.beginPath(); ctx.arc(ex*m.r,ey*m.r,m.r*0.13,0,Math.PI*2);
          ctx.fillStyle=f>0?'#fff':`rgba(0,255,0,${0.6+0.4*Math.sin(m.bobAngle*4+i)})`; ctx.fill();
          ctx.beginPath(); ctx.arc(ex*m.r,ey*m.r,m.r*0.06,0,Math.PI*2);
          ctx.fillStyle='#000'; ctx.fill();
        });
        // Dripping slime
        ctx.fillStyle=f>0?'rgba(200,255,200,0.3)':'rgba(0,200,0,0.35)';
        [-.3,0,.3].forEach(dx=>{
          const drip=m.r*0.2+Math.sin(m.bobAngle+dx*10)*m.r*0.15;
          ctx.beginPath(); ctx.ellipse(dx*m.r,m.r*0.7+drip,m.r*0.07,m.r*0.2,0,0,Math.PI*2); ctx.fill();
        });

      } else if (shape === 'eggbot' || shape === 'eggbot2' || shape === 'eggbot3') {
        // Eggman robot — gray round body, red visor, robot arms
        const tier = shape === 'eggbot3' ? 2 : shape === 'eggbot2' ? 1 : 0;
        ctx.beginPath(); ctx.ellipse(0, 0, m.r, m.r * 1.1, 0, 0, Math.PI*2);
        ctx.fillStyle = f>0 ? c1 : '#8a8a8a'; ctx.fill();
        ctx.strokeStyle = '#444'; ctx.lineWidth = 1.5; ctx.stroke();
        // Belly panel
        ctx.beginPath(); ctx.ellipse(0, m.r*0.2, m.r*0.55, m.r*0.55, 0, 0, Math.PI*2);
        ctx.fillStyle = f>0 ? '#ddd' : '#ccc'; ctx.fill();
        // Red visor
        ctx.beginPath(); ctx.roundRect(-m.r*0.5, -m.r*0.35, m.r, m.r*0.28, 4);
        ctx.fillStyle = f>0 ? '#fff' : '#cc1111'; ctx.fill();
        // Eye dot(s) in visor
        ctx.fillStyle = f>0 ? '#aaa' : '#ffcc00';
        ctx.beginPath(); ctx.arc(0, -m.r*0.22, m.r*0.1, 0, Math.PI*2); ctx.fill();
        if (tier > 0) { ctx.beginPath(); ctx.arc(-m.r*0.25, -m.r*0.22, m.r*0.1, 0, Math.PI*2); ctx.fill(); }
        if (tier > 1) { ctx.beginPath(); ctx.arc( m.r*0.25, -m.r*0.22, m.r*0.1, 0, Math.PI*2); ctx.fill(); }
        // Robot arms
        ctx.strokeStyle = f>0 ? '#ddd' : '#777'; ctx.lineWidth = m.r*0.22; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-m.r*0.85, 0); ctx.lineTo(-m.r*1.4, -m.r*0.3 + lw*m.r*0.4); ctx.stroke();
        ctx.beginPath(); ctx.moveTo( m.r*0.85, 0); ctx.lineTo( m.r*1.4, -m.r*0.3 + rw*m.r*0.4); ctx.stroke();
        // Claws
        ctx.fillStyle = f>0 ? '#ddd' : '#555';
        ctx.beginPath(); ctx.arc(-m.r*1.4, -m.r*0.3 + lw*m.r*0.4, m.r*0.18, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc( m.r*1.4, -m.r*0.3 + rw*m.r*0.4, m.r*0.18, 0, Math.PI*2); ctx.fill();

      } else if (shape === 'eggman_mini') {
        // Mini Eggman in a pod — egg body, red coat visible, mustache
        ctx.beginPath(); ctx.ellipse(0, 0, m.r*0.85, m.r, 0, 0, Math.PI*2);
        ctx.fillStyle = f>0 ? '#fff' : '#d4230a'; ctx.fill(); ctx.strokeStyle='#880000'; ctx.lineWidth=1.5; ctx.stroke();
        // Belly
        ctx.beginPath(); ctx.ellipse(0, m.r*0.3, m.r*0.55, m.r*0.48, 0, 0, Math.PI*2);
        ctx.fillStyle = f>0 ? '#ddd' : '#f0c0a0'; ctx.fill();
        // Eyes
        ctx.fillStyle='#111';
        ctx.beginPath(); ctx.arc(-m.r*0.25, -m.r*0.25, m.r*0.13, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc( m.r*0.25, -m.r*0.25, m.r*0.13, 0, Math.PI*2); ctx.fill();
        // Mustache
        ctx.strokeStyle = f>0 ? '#aaa' : '#f5f5dc'; ctx.lineWidth = m.r*0.1; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(-m.r*0.05, m.r*0.05); ctx.bezierCurveTo(-m.r*0.35, m.r*0.25, -m.r*0.6, m.r*0.1, -m.r*0.55, -m.r*0.1); ctx.stroke();
        ctx.beginPath(); ctx.moveTo( m.r*0.05, m.r*0.05); ctx.bezierCurveTo( m.r*0.35, m.r*0.25,  m.r*0.6, m.r*0.1,  m.r*0.55, -m.r*0.1); ctx.stroke();
        // Pod halo ring

      } else if (shape === 'skeleton') {

      } else if (shape === 'creeper') {

      } else if (shape === 'spider_mc') {

        ctx.beginPath(); ctx.moveTo( m.r*0.32,-m.r*0.6); ctx.lineTo( m.r*(0.9+rw*0.3), m.r*(0.8+rw*0.4)); ctx.stroke();

          ctx.beginPath(); ctx.rect(hx-m.r*0.38,hy-m.r*0.38,m.r*0.76,m.r*0.76);
          ctx.fillStyle=f>0?'#888':'#1a1a2a'; ctx.fill(); ctx.strokeStyle='#444'; ctx.lineWidth=1.5; ctx.stroke();
          // Eyes (center head bigger)
          const eyeA=hi===1?0.85+0.15*Math.sin(m.bobAngle*3):0.6+0.4*Math.sin(m.bobAngle*3+hi);

          ctx.beginPath(); ctx.rect(hx-m.r*0.18,hy-m.r*0.18,m.r*0.16,m.r*0.16); ctx.fill();
          ctx.beginPath(); ctx.rect(hx+m.r*0.02,hy-m.r*0.18,m.r*0.16,m.r*0.16); ctx.fill();
        });

        ctx.strokeStyle=f>0?'#888':'#333'; ctx.lineWidth=m.r*0.22; ctx.lineCap='round';

        const grad = ctx.createRadialGradient(-m.r*0.3,-m.r*0.3,2,0,0,m.r*1.3);
        grad.addColorStop(0,c1); grad.addColorStop(1,c2);

        ctx.strokeStyle=m.golden?'rgba(180,130,0,0.7)':'rgba(0,0,0,0.4)';
        ctx.lineWidth=m.golden?2.5:1.5; ctx.stroke();

        ctx.beginPath(); ctx.arc(-m.r*0.28,-m.r*0.15,m.r*0.15,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc( m.r*0.28,-m.r*0.15,m.r*0.15,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='rgba(255,255,100,0.7)';
        ctx.beginPath(); ctx.arc(-m.r*0.28,-m.r*0.15,m.r*0.06,0,Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc( m.r*0.28,-m.r*0.15,m.r*0.06,0,Math.PI*2); ctx.fill();

        ctx.lineTo(0,m.r*0.22); ctx.lineTo(m.r*0.2,m.r*0.38); ctx.lineTo(m.r*0.4,m.r*0.2);

      // Golden crown (all shapes)
      if (m.golden) {

        [-cw*0.7,0,cw*0.7].forEach((px,i)=>{

      // Boss HP bar (all shapes)
      if (m.boss) {
        const barW=m.r*2.5, barH=10, bx=-barW/2, by=-m.r-26;
        ctx.fillStyle='#330000'; ctx.beginPath(); ctx.roundRect(bx,by,barW,barH,4); ctx.fill();

        ctx.strokeStyle='#660000'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.roundRect(bx,by,barW,barH,4); ctx.stroke();
        // Wave tier label on boss
